 of filling"},{"k":"E","t":"Low abdominal leak point pressure"}],"answer":"A","explanation":"In children with neurogenic bladder, storage pressure is the key determinant of upper tract safety. A detrusor leak point pressure greater than 40 cm H₂O, often together with poor compliance and detrusor-sphincter dyssynergia, is associated with a high risk of hydronephrosis, vesicoureteral reflux and renal damage.\n\nSuch children need active management with clean intermittent catheterization and anticholinergic therapy, with bladder augmentation if pressures remain high. Absent sensation alone does not predict deterioration, and a low abdominal leak point pressure reflects outlet weakness.","summary":"A — DLPP > 40 cm H₂O. High storage pressure threatens the upper tracts in neurogenic bladder; treat with CIC + anticholinergics.","sub":"ped.voiding.neurogenic","sex":"girl","organ":["bladder","kidney"],"special":[],"qtype":"diagnosis","format":"clinical","highYield":true,"tax2":["neuro.uds.interp"],"conf":1.0,"year":2003,"age":5},{"id":"d2-c4-01","src":"demo2","num":1,"stem":"A 64-year-old man has taken finasteride for BPH for 12 months. His PSA is now 2.1 ng/mL. For prostate cancer risk assessment, how should this value be interpreted?","options":[{"k":"A","t":"Use 2.1 ng/mL as measured"},{"k":"B","t":"Double it to about 4.2 ng/mL"},{"k":"C","t":"Halve it to about 1.05 ng/mL"},{"k":"D","t":"PSA cannot be interpreted while on finasteride"},{"k":"E","t":"Multiply it by four"}],"answer":"B","explanation":"5-alpha reductase inhibitors such as finasteride and dutasteride lower serum PSA by approximately 50% after 6 to 12 months of treatment. To estimate the equivalent untreated value, the measured PSA is commonly doubled.\n\nA PSA that rises while a man is taking a 5-alpha reductase inhibitor, even within the normal range, should prompt evaluation for prostate cancer. Stopping the drug is not required for PSA to be interpreted.","summary":"B — Double the PSA. 5-ARIs lower PSA by about 50% after 6–12 months; any confirmed PSA rise on treatment warrants evaluation.","sub":"bph.med.5ari","sex":"M","organ":["prostate"],"special":[],"qtype":"pharmacology","format":"clinical","highYield":true,"tax2":["onc.prostate.psa"],"conf":1.0,"chapter":{"n":4,"title":"Prostate & BPH"},"age":64},{"id":"d1-2001-02","src":"demo1","num":2,"stem":"A 71-year-old man presents with painful acute urinary retention after taking a cold remedy containing an antihistamine. A urethral catheter drains 900 mL. What is the most appropriate management?","options":[{"k":"A","t":"Immediate TURP the same day"},{"k":"B","t":"Start an alpha-blocker and plan a trial without catheter after a few days"},{"k":"C","t":"Remove the catheter immediately and discharge"},{"k":"D","t":"Suprapubic cystostomy for 6 months"},{"k":"E","t":"Start finasteride and remove the catheter the next day"}],"answer":"B","explanation":"Acute urinary retention precipitated by medication in a man with BPH is managed with bladder catheterization, withdrawal of the precipitating drug and an alpha-blocker. Starting an alpha-blocker for a few days before a trial without catheter significantly increases the chance of voiding successfully.\n\nSurgery is considered if the trial fails or retention recurs, but immediate TURP during acute retention carries a higher complication rate. 5-alpha reductase inhibitors take months to act and do not help an early trial.","summary":"B — Alpha-blocker, then trial without catheter. It improves successful voiding after AUR; surgery only if the trial fails.","sub":"bph.ret.acute","sex":"M","organ":["prostate","bladder"],"special":[],"qtype":"management","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"year":2001,"age":71},{"id":"d2-c7-01","src":"demo2","num":1,"stem":"A 52-year-old man with gout has a 9 mm renal pelvic stone that is not visible on plain radiography but is clearly seen on non-contrast CT with low attenuation. His urine pH is 5.0. Which treatment is most appropriate initially?","options":[{"k":"A","t":"Oral alkalinization with potassium citrate"},{"k":"B","t":"Thiazide diuretic"},{"k":"C","t":"Acidification of urine with ammonium chloride"},{"k":"D","t":"Low-oxalate diet alone"},{"k":"E","t":"Allopurinol alone without urine alkalinization"}],"answer":"A","explanation":"A radiolucent, low-attenuation stone in a man with gout and persistently acidic urine is most likely uric acid. Uric acid solubility rises sharply as urine pH increases, so oral alkalinization with potassium citrate to a urine pH of about 6.0–6.5 can dissolve existing stones and prevent new ones.\n\nAllopurinol is added when hyperuricosuria or hyperuricemia is present, but alkalinization is the cornerstone. Thiazides are used for hypercalciuria, a low-oxalate diet targets calcium oxalate stones, and acidification would worsen uric acid precipitation.","summary":"A — Potassium citrate to a urine pH of about 6.0–6.5. Uric acid stones are radiolucent and dissolve with alkalinization; low urine pH is the main risk factor.","sub":"stone.disease.types","sex":"M","organ":["kidney"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":["stone.disease.prevention"],"conf":1.0,"chapter":{"n":7,"title":"Stones"},"age":52},{"id":"d1-2004-02","src":"demo1","num":2,"stem":"A 28-year-old woman at 24 weeks of pregnancy has right flank pain, a fever of 39 °C and rigors. Ultrasound shows moderate right hydronephrosis with a 7 mm upper ureteric stone. Blood pressure is 95/60 mmHg despite intravenous fluids. What is the most appropriate management after starting antibiotics?","options":[{"k":"A","t":"Urgent decompression with a ureteral stent or nephrostomy tube"},{"k":"B","t":"Immediate ureteroscopic laser lithotripsy"},{"k":"C","t":"Shock wave lithotripsy"},{"k":"D","t":"Oral antibiotics and outpatient follow-up"},{"k":"E","t":"Wait until delivery before any intervention"}],"answer":"A","explanation":"An obstructed, infected kidney is a urological emergency in any patient, and sepsis in pregnancy threatens both mother and fetus. After resuscitation and broad-spectrum antibiotics, the collecting system must be decompressed urgently with either a retrograde ureteral stent or a percutaneous nephrostomy tube.\n\nDefinitive stone treatment is deferred until the infection has resolved. Shock wave lithotripsy is contraindicated in pregnancy, and stone manipulation in the presence of active infection risks worsening sepsis.","summary":"A — Urgent drainage (stent or nephrostomy) plus antibiotics. An infected obstructed kidney is an emergency; treat the stone later. SWL is contraindicated in pregnancy.","sub":"stone.disease.pregnancy","sex":"F","organ":["kidney","ureter"],"special":["pregnant"],"qtype":"management","format":"clinical","highYield":true,"tax2":["inf.uti.complicated"],"conf":1.0,"year":2004,"age":28},{"id":"d2-c8-01","src":"demo2","num":1,"stem":"A 24-year-old man with sickle cell disease has had a painful, fully rigid erection for 6 hours. Corporal blood gas shows hypoxia and acidosis. What is the most appropriate first-line management?","options":[{"k":"A","t":"Corporal aspiration with irrigation and intracavernosal phenylephrine"},{"k":"B","t":"Observation and oral analgesia"},{"k":"C","t":"Immediate penile prosthesis insertion"},{"k":"D","t":"Selective arterial embolization"},{"k":"E","t":"Ice packs only and discharge"}],"answer":"A","explanation":"A painful, fully rigid erection lasting more than 4 hours with hypoxic, acidotic corporal blood is ischemic (low-flow) priapism, a compartment syndrome of the corpora that requires emergency treatment.\n\nFirst-line management is corporal aspiration, with or without saline irrigation, combined with intracavernosal phenylephrine injections, repeated as needed while monitoring blood pressure and heart rate. Treatment of the sickle cell crisis should run alongside but must not delay intracavernosal therapy. Shunt surgery is indicated if these measures fail. Arterial embolization is used for non-ischemic (high-flow) priapism.","summary":"A — Aspiration ± irrigation + intracavernosal phenylephrine. Ischemic priapism is an emergency; sickle cell care must not delay it. Embolization is for high-flow priapism.","sub":"andro.pp.priapism","sex":"M","organ":["penis"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":8,"title":"Andrology"},"age":24,"guideline":"AUA"},{"id":"d1-2002-02","src":"demo1","num":2,"stem":"A 30-year-old man with primary infertility has azoospermia, small firm testes, a markedly elevated FSH and a 47,XXY karyotype. The couple wants a biological child. What is the most appropriate option?","options":[{"k":"A","t":"Microdissection testicular sperm extraction (micro-TESE) with ICSI"},{"k":"B","t":"Exogenous testosterone therapy to stimulate spermatogenesis"},{"k":"C","t":"Varicocelectomy"},{"k":"D","t":"Vasoepididymostomy"},{"k":"E","t":"No option exists; recommend donor sperm only"}],"answer":"A","explanation":"Klinefelter syndrome is the most common chromosomal cause of non-obstructive azoospermia. Although the ejaculate contains no sperm, focal areas of spermatogenesis may exist, and microdissection testicular sperm extraction retrieves sperm in a substantial proportion of men, allowing ICSI.\n\nExogenous testosterone suppresses gonadotropins and impairs spermatogenesis, so it should be avoided in men seeking fertility. Varicocelectomy and vasoepididymostomy treat other conditions, and donor sperm is an alternative rather than the only option.","summary":"A — Micro-TESE with ICSI. Klinefelter (47,XXY) causes non-obstructive azoospermia, but sperm can often be retrieved. Avoid exogenous testosterone when fertility is desired.","sub":"andro.infert.azoo","sex":"M","organ":["testis"],"special":[],"qtype":"management","format":"clinical","highYield":false,"tax2":["andro.infert.retrieval"],"conf":1.0,"year":2002,"age":30},{"id":"d2-c8-02","src":"demo2","num":2,"stem":"A 55-year-old man has had stable dorsal penile curvature of 45 degrees for 6 months, with a palpable plaque, no pain and intact erectile function. He wants to avoid surgery if possible. Which treatment has the best evidence?","options":[{"k":"A","t":"Intralesional collagenase Clostridium histolyticum"},{"k":"B","t":"Oral vitamin E"},{"k":"C","t":"Penile prosthesis"},{"k":"D","t":"Oral tamoxifen"},{"k":"E","t":"Shock wave therapy to correct the curvature"}],"answer":"A","explanation":"In the stable phase of Peyronie's disease, intralesional collagenase Clostridium histolyticum combined with penile modeling is the non-surgical treatment with the strongest evidence for reducing curvature in men with a palpable plaque and curvature of roughly 30 to 90 degrees.\n\nOral agents such as vitamin E and tamoxifen have not shown meaningful benefit. Shock wave therapy may help pain but does not correct curvature. A prosthesis is reserved for men with Peyronie's disease and erectile dysfunction that does not respond to medical treatment.","summary":"A — Intralesional collagenase (with modeling) for stable curvature of 30–90° with a palpable plaque. Oral agents do not work; prosthesis if refractory ED coexists.","sub":"andro.pp.peyronie","sex":"M","organ":["penis"],"special":[],"qtype":"management","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"chapter":{"n":8,"title":"Andrology"},"age":55,"guideline":"AUA"},{"id":"d1-2006-02","src":"demo1","num":2,"stem":"In which of the following patients should asymptomatic bacteriuria be treated?","options":[{"k":"A","t":"A healthy 70-year-old woman living at home"},{"k":"B","t":"A pregnant woman at 12 weeks of gestation"},{"k":"C","t":"A patient with a long-term indwelling urethral catheter"},{"k":"D","t":"A man with spinal cord injury on intermittent catheterization"},{"k":"E","t":"A patient with diabetes mellitus"}],"answer":"B","explanation":"Screening for and treating asymptomatic bacteriuria is recommended in pregnancy because it reduces the risk of pyelonephritis and adverse pregnancy outcomes. Treatment is also indicated before urologic procedures in which mucosal bleeding is expected, such as transurethral resection.\n\nIn older adults, people with diabetes, catheterized patients and those with spinal cord injury, treating asymptomatic bacteriuria does not improve outcomes and promotes antimicrobial resistance and adverse drug effects.","summary":"B — Pregnancy. Treat ASB in pregnancy and before procedures with expected mucosal bleeding; not in the elderly, diabetics or catheterized patients.","sub":"inf.uti.asb","sex":"none","organ":["bladder"],"special":[],"qtype":"management","format":"recall","highYield":true,"tax2":[],"conf":1.0,"year":2006},{"id":"d2-c9-02","src":"demo2","num":2,"stem":"A 38-year-old man has frequency, dysuria and sterile pyuria on repeated urinalysis with acidic urine. Standard urine cultures are negative and a chest radiograph shows an old apical scar. Which test is most appropriate to confirm the suspected diagnosis?","options":[{"k":"A","t":"Three early-morning urine samples for mycobacterial culture and PCR"},{"k":"B","t":"Repeat standard urine culture"},{"k":"C","t":"Serum PSA"},{"k":"D","t":"Urine cytology only"},{"k":"E","t":"Plain abdominal radiograph"}],"answer":"A","explanation":"Persistent sterile pyuria with acidic urine and evidence of previous pulmonary tuberculosis should raise suspicion of genitourinary tuberculosis. The diagnosis is confirmed by culture of Mycobacterium tuberculosis from early-morning urine samples collected on at least three consecutive days, often supplemented by nucleic acid amplification tests such as PCR.\n\nStandard cultures are negative because mycobacteria need special media. Imaging may show calcifications, calyceal irregularity, ureteric strictures or a small contracted bladder, but it does not confirm the diagnosis.","summary":"A — Three early-morning urine mycobacterial cultures (± PCR). Sterile pyuria + acidic urine suggests GU TB; standard cultures are negative.","sub":"inf.special.tb","sex":"M","organ":["kidney","bladder"],"special":[],"qtype":"workup","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"chapter":{"n":9,"title":"Infections"},"age":38},{"id":"d1-2000-02","src":"demo1","num":2,"stem":"A 61-year-old man with poorly controlled diabetes has a 2-day history of perineal pain, fever and a swollen, erythematous scrotum with crepitus and areas of dusky skin. What is the most important next step after resuscitation and broad-spectrum antibiotics?","options":[{"k":"A","t":"Urgent radical surgical debridement of all necrotic tissue"},{"k":"B","t":"Oral antibiotics and review in one week"},{"k":"C","t":"Scrotal ultrasound and observation"},{"k":"D","t":"Hyperbaric oxygen as sole therapy"},{"k":"E","t":"Elective orchiectomy after the infection settles"}],"answer":"A","explanation":"This is Fournier's gangrene, a polymicrobial necrotizing fasciitis of the perineum and genitalia. Diabetes is the most common predisposing factor. Mortality remains substantial and rises with any delay to surgery.\n\nTreatment combines aggressive resuscitation, broad-spectrum intravenous antibiotics and urgent, wide surgical debridement of all non-viable tissue, with repeat debridement as needed. The testes are usually spared because of their separate blood supply. Hyperbaric oxygen may be an adjunct but never replaces surgery.","summary":"A — Urgent wide surgical debridement plus IV antibiotics. Fournier's gangrene is a surgical emergency; the testes are usually spared.","sub":"inf.special.fournier","sex":"M","organ":["scrotum","penis"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2000,"age":61},{"id":"d2-c10-01","src":"demo2","num":1,"stem":"A 23-year-old man is hemodynamically stable after a motorcycle accident. Contrast CT shows a grade IV right renal laceration with urinary extravasation and a perirenal hematoma confined to Gerota's fascia, with no active arterial bleeding. What is the preferred management?","options":[{"k":"A","t":"Nonoperative management with close monitoring"},{"k":"B","t":"Immediate exploration and nephrectomy"},{"k":"C","t":"Immediate exploration and renorrhaphy"},{"k":"D","t":"Angioembolization of the main renal artery"},{"k":"E","t":"Discharge home without follow-up"}],"answer":"A","explanation":"Most renal injuries, including high-grade injuries, can be managed without surgery in hemodynamically stable patients. Nonoperative management with bed rest, serial hematocrit and close monitoring has high renal salvage rates and avoids unnecessary nephrectomy.\n\nUrinary extravasation often resolves spontaneously; a ureteral stent or drain is placed if a urinoma enlarges or symptoms persist. Follow-up imaging is advised for deep lacerations or a worsening clinical picture. Selective angioembolization is used for active bleeding, and exploration is reserved for hemodynamic instability.","summary":"A — Nonoperative management. Stable patients with high-grade renal injury usually do well without surgery; stent for a persistent urinoma, angioembolization for active bleeding.","sub":"trauma.renal.mgmt","sex":"M","organ":["kidney"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":10,"title":"Trauma"},"age":23,"guideline":"AUA"},{"id":"d1-2005-02","src":"demo1","num":2,"stem":"A 29-year-old man with a pelvic fracture after a crush injury has blood at the urethral meatus and is unable to void. What should be done before attempting urethral catheterization?","options":[{"k":"A","t":"Retrograde urethrogram"},{"k":"B","t":"Forceful urethral catheterization with a 22 Fr catheter"},{"k":"C","t":"Intravenous urography"},{"k":"D","t":"Immediate open urethroplasty"},{"k":"E","t":"Cystoscopy under general anesthesia after 3 months"}],"answer":"A","explanation":"Blood at the meatus after a pelvic fracture strongly suggests a posterior urethral injury. A retrograde urethrogram should be performed to assess urethral integrity before any attempt at catheterization, because blind passage of a catheter can convert a partial disruption into a complete one.\n\nIf a disruption is found, urinary drainage is established with a suprapubic tube, or primary endoscopic realignment is attempted in selected patients. Delayed urethroplasty is performed later for the resulting stricture.","summary":"A — Retrograde urethrogram first. Blood at the meatus + pelvic fracture = suspected urethral injury; avoid blind catheterization. Drain with a suprapubic tube if disrupted.","sub":"trauma.urethra.imaging","sex":"M","organ":["urethra"],"special":[],"qtype":"workup","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2005,"age":29},{"id":"d2-c10-02","src":"demo2","num":2,"stem":"A 35-year-old man was struck in the lower abdomen while his bladder was full. CT cystography shows contrast outlining bowel loops in the peritoneal cavity. What is the most appropriate management?","options":[{"k":"A","t":"Surgical exploration and repair of the bladder"},{"k":"B","t":"Urethral catheter drainage alone for 10 days"},{"k":"C","t":"Observation without catheterization"},{"k":"D","t":"Suprapubic aspiration"},{"k":"E","t":"Repeat CT cystography in 6 weeks"}],"answer":"A","explanation":"Contrast around bowel loops indicates intraperitoneal bladder rupture, typically from a blow to a distended bladder that tears the dome. These injuries do not heal reliably with catheter drainage, and urinary ascites can cause peritonitis and metabolic disturbances, so surgical repair is required.\n\nUncomplicated extraperitoneal ruptures, by contrast, are usually managed with urethral catheter drainage alone. Surgery is advised for extraperitoneal injuries that involve the bladder neck, contain bone fragments or occur in patients undergoing open surgery for other injuries.","summary":"A — Surgical repair. Intraperitoneal rupture (contrast around bowel) needs an operation; uncomplicated extraperitoneal rupture is managed with catheter drainage.","sub":"trauma.bladder.mgmt","sex":"M","organ":["bladder"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":10,"title":"Trauma"},"age":35},{"id":"d1-2003-03","src":"demo1","num":3,"stem":"A 40-year-old man has a 1.5 cm bulbar urethral stricture that recurred after two previous internal urethrotomies. What is the most appropriate treatment?","options":[{"k":"A","t":"Excision and primary anastomosis urethroplasty"},{"k":"B","t":"A third internal urethrotomy"},{"k":"C","t":"Lifelong urethral self-dilation"},{"k":"D","t":"Perineal urethrostomy as first-line treatment"},{"k":"E","t":"Permanent suprapubic catheter"}],"answer":"A","explanation":"Repeated urethrotomy after failure has very low success rates and may lengthen the stricture. Urethroplasty is recommended for men with recurrent anterior urethral strictures after failed endoscopic treatment.\n\nFor a short bulbar stricture of about 1 to 2 cm, excision and primary anastomosis offers durable success rates above 90%. Longer strictures usually require substitution with a buccal mucosa graft. Self-dilation, urethrostomy and permanent catheters are reserved for patients who are unfit for, or decline, reconstruction.","summary":"A — Excision and primary anastomosis. Short bulbar strictures recurring after urethrotomy need urethroplasty; repeat urethrotomy rarely works.","sub":"recon.stricture.urethroplasty","sex":"M","organ":["urethra"],"special":[],"qtype":"management","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"year":2003,"age":40,"guideline":"AUA"},{"id":"d2-c11-01","src":"demo2","num":1,"stem":"Eight weeks after kidney transplantation, a 47-year-old man has a rising creatinine and ipsilateral leg swelling. Ultrasound shows a large perigraft fluid collection compressing the ureter; aspirated fluid has a creatinine level equal to that of serum. What is the definitive treatment?","options":[{"k":"A","t":"Laparoscopic peritoneal fenestration (marsupialization)"},{"k":"B","t":"Repeated percutaneous aspiration only"},{"k":"C","t":"Transplant nephrectomy"},{"k":"D","t":"Increase immunosuppression"},{"k":"E","t":"Ureteral reimplantation"}],"answer":"A","explanation":"A fluid collection whose creatinine equals serum creatinine is a lymphocele, whereas a urinoma has a creatinine level much higher than serum. Lymphoceles are the most common perigraft fluid collections and can cause ureteric obstruction, graft dysfunction and leg swelling from iliac vein compression.\n\nSimple aspiration is associated with high recurrence rates. Symptomatic lymphoceles are treated definitively by internal drainage into the peritoneal cavity, usually by laparoscopic peritoneal fenestration, or by percutaneous drainage with sclerotherapy.","summary":"A — Laparoscopic peritoneal fenestration. Fluid creatinine equal to serum = lymphocele (a urinoma is much higher). Aspiration alone recurs.","sub":"renal.tx.complications","sex":"M","organ":["kidney","ureter"],"special":["transplant"],"qtype":"complication","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"chapter":{"n":11,"title":"Transplantation"},"age":47},{"id":"d1-2006-03","src":"demo1","num":3,"stem":"A 44-year-old woman has episodic headaches, palpitations and hypertension. Plasma free metanephrines are markedly elevated and CT shows a 4 cm right adrenal mass. Which preoperative treatment should be started first?","options":[{"k":"A","t":"Alpha-adrenergic blockade, for example phenoxybenzamine or doxazosin"},{"k":"B","t":"A beta-blocker alone"},{"k":"C","t":"Fluid restriction and a low-salt diet"},{"k":"D","t":"High-dose corticosteroids"},{"k":"E","t":"No preparation is needed before laparoscopic adrenalectomy"}],"answer":"A","explanation":"This is a pheochromocytoma. Preoperative alpha-adrenergic blockade for about 7 to 14 days controls blood pressure and expands the contracted intravascular volume, reducing the risk of intraoperative hypertensive crises and of hypotension after resection. A high-sodium diet and generous fluid intake are encouraged.\n\nBeta-blockers may be added for tachycardia only after adequate alpha-blockade, because unopposed alpha stimulation can precipitate a hypertensive crisis. Corticosteroids are not part of routine preparation for pheochromocytoma.","summary":"A — Alpha-blockade first (7–14 days), then a beta-blocker if needed. Never start a beta-blocker alone in pheochromocytoma.","sub":"onc.adrenal.pheo","sex":"F","organ":["adrenal"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2006,"age":44},{"id":"d2-c12-01","src":"demo2","num":1,"stem":"Into which vessel does the left gonadal vein usually drain?","options":[{"k":"A","t":"Inferior vena cava"},{"k":"B","t":"Left renal vein"},{"k":"C","t":"Left common iliac vein"},{"k":"D","t":"Left internal iliac vein"},{"k":"E","t":"Left adrenal vein"}],"answer":"B","explanation":"The right gonadal vein drains directly into the inferior vena cava at an acute angle, whereas the left gonadal vein drains into the left renal vein at a right angle.\n\nThis anatomy, together with compression of the left renal vein between the aorta and the superior mesenteric artery, helps explain why varicoceles are much more common on the left side. A new right-sided or non-reducing varicocele should prompt evaluation for a retroperitoneal mass.","summary":"B — Left renal vein (the right gonadal vein drains into the IVC). This explains the predominance of left-sided varicoceles.","sub":"basic.anat.anatomy","sex":"none","organ":["testis","kidney"],"special":[],"qtype":"anatomy","format":"recall","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":12,"title":"Basic & perioperative sciences"}},{"id":"d1-2002-03","src":"demo1","num":3,"stem":"The prostatic utricle is derived from which embryologic structure?","options":[{"k":"A","t":"Paramesonephric (Müllerian) duct"},{"k":"B","t":"Mesonephric (Wolffian) duct"},{"k":"C","t":"Urogenital sinus only"},{"k":"D","t":"Ureteric bud"},{"k":"E","t":"Genital tubercle"}],"answer":"A","explanation":"The prostatic utricle is a small midline pouch in the verumontanum and is considered a remnant of the paramesonephric (Müllerian) ducts, which normally regress in males under the influence of anti-Müllerian hormone produced by Sertoli cells.\n\nThe mesonephric ducts form the epididymis, vas deferens, seminal vesicles and ejaculatory ducts, while the ureteric bud forms the ureter and collecting system. An enlarged utricle may be seen in boys with proximal hypospadias or disorders of sex development.","summary":"A — Müllerian (paramesonephric) duct remnant. The Wolffian duct forms the epididymis, vas, seminal vesicles and ejaculatory ducts.","sub":"basic.anat.embryology","sex":"none","organ":["prostate"],"special":[],"qtype":"anatomy","format":"recall","highYield":false,"tax2":[],"conf":0.72,"year":2002},{"id":"d2-c4-02","src":"demo2","num":2,"stem":"A 62-year-old man has a PSA of 5.2 ng/mL, a normal digital rectal examination and a targeted biopsy showing Gleason 3+3 (Grade Group 1) cancer in 2 of 14 cores. MRI shows no extraprostatic extension. What is the preferred management?","options":[{"k":"A","t":"Active surveillance"},{"k":"B","t":"Radical prostatectomy within 2 weeks"},{"k":"C","t":"Androgen deprivation therapy"},{"k":"D","t":"External beam radiotherapy with long-term ADT"},{"k":"E","t":"Docetaxel chemotherapy"}],"answer":"A","explanation":"This man has low-risk localized prostate cancer: Grade Group 1, PSA below 10 ng/mL and clinical stage T1c–T2a. Active surveillance is the preferred management for most men with low-risk disease because the risk of progression and cancer death is very low, and it avoids or delays the urinary, sexual and bowel side effects of definitive treatment.\n\nSurveillance includes regular PSA testing, examination, MRI and repeat biopsy, with curative treatment offered if higher-grade disease appears. Hormonal therapy and chemotherapy have no role in low-risk localized disease.","summary":"A — Active surveillance for low-risk disease (GG1, PSA < 10, cT1–T2a). Treat curatively only if the disease is reclassified to a higher risk.","sub":"onc.prostate.localized","sex":"M","organ":["prostate"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":4,"title":"Prostate & BPH"},"age":62,"guideline":"AUA"},{"id":"d1-2004-03","src":"demo1","num":3,"stem":"Upper tract urothelial carcinoma is a recognized feature of which hereditary syndrome?","options":[{"k":"A","t":"Lynch syndrome (hereditary non-polyposis colorectal cancer)"},{"k":"B","t":"Von Hippel-Lindau disease"},{"k":"C","t":"Birt-Hogg-Dubé syndrome"},{"k":"D","t":"Multiple endocrine neoplasia type 2"},{"k":"E","t":"Tuberous sclerosis complex"}],"answer":"A","explanation":"Lynch syndrome, caused by germline mutations in DNA mismatch repair genes, carries an increased risk of upper tract urothelial carcinoma, which is the third most common Lynch-associated cancer after colorectal and endometrial cancers. Patients with UTUC who are young or have a personal or family history of Lynch-associated cancers should be screened.\n\nVon Hippel-Lindau disease, Birt-Hogg-Dubé syndrome and tuberous sclerosis are associated with renal tumors such as clear cell RCC, chromophobe or oncocytic tumors and angiomyolipoma, respectively. MEN2 is associated with pheochromocytoma.","summary":"A — Lynch syndrome (mismatch repair genes). UTUC is the third commonest Lynch cancer; VHL, BHD and TSC are linked to renal tumors instead.","sub":"onc.uttuc.dx","sex":"none","organ":["kidney","ureter"],"special":[],"qtype":"pathology","format":"recall","highYield":true,"tax2":[],"conf":1.0,"year":2004},{"id":"d2-c2-01","src":"demo2","num":1,"stem":"A newborn boy has distal hypospadias with a dorsal hooded foreskin and both testes descended. His parents ask for neonatal circumcision. What is the most appropriate advice?","options":[{"k":"A","t":"Avoid circumcision because the foreskin may be needed for reconstruction"},{"k":"B","t":"Perform circumcision immediately to lower the risk of infection"},{"k":"C","t":"Perform circumcision together with urethral dilation"},{"k":"D","t":"Circumcision is mandatory before hypospadias repair"},{"k":"E","t":"Obtain a karyotype before any discussion"}],"answer":"A","explanation":"Neonatal circumcision should be avoided in boys with hypospadias because preputial skin may be needed for the urethroplasty or for skin coverage at the time of repair, which is usually performed between about 6 and 18 months of age.\n\nIsolated distal hypospadias with descended testes does not require a karyotype. Evaluation for a disorder of sex development is indicated when hypospadias is proximal or associated with one or both undescended testes.","summary":"A — Do not circumcise; the foreskin may be used in the repair (usually at 6–18 months). DSD work-up if hypospadias is proximal or with an undescended testis.","sub":"ped.genital.hypospadias","sex":"boy","organ":["penis"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":2,"title":"Genital anomalies"},"age":0.003},{"id":"d2-c12-02","src":"demo2","num":2,"stem":"Which nerve is most commonly injured by compression in the lithotomy position?","options":[{"k":"A","t":"Common peroneal nerve"},{"k":"B","t":"Femoral nerve"},{"k":"C","t":"Obturator nerve"},{"k":"D","t":"Sciatic nerve"},{"k":"E","t":"Genitofemoral nerve"}],"answer":"A","explanation":"Lower extremity neuropathies are a recognized complication of prolonged lithotomy positioning. The common peroneal nerve is the most frequently injured because it is superficial where it wraps around the fibular head and can be compressed against leg supports, causing foot drop and numbness over the dorsum of the foot.\n\nThe risk rises with operative time beyond about 2 hours, extreme hip flexion and low body mass index. Careful padding of the lateral knee, limiting time in lithotomy and avoiding extreme positions reduce the risk.","summary":"A — Common peroneal nerve (compression at the fibular head causes foot drop). Pad the lateral knee and limit time in lithotomy.","sub":"periop.comp.position","sex":"none","organ":[],"special":[],"qtype":"complication","format":"recall","highYield":false,"tax2":[],"conf":1.0,"chapter":{"n":12,"title":"Basic & perioperative sciences"}}]}};</script>
<script>
/* UroBank — core: utilities, taxonomy, facet labels */
(function () {
  'use strict';
  const UB = (window.UB = window.UB || {});
  const U = (UB.U = {});

  /* ---------- text & numbers ---------- */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  U.pad = (n, w = 2) => String(n).padStart(w, '0');
  U.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  U.clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  U.uid = (n = 10) => {
    let s = '';
    const a = 'abcdefghijkmnopqrstuvwxyz23456789';
    for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  };
  U.sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  U.debounce = (fn, ms) => {
    let t = null;
    const d = (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
    d.flush = () => {
      clearTimeout(t);
      fn();
    };
    return d;
  };
  U.fnv = (str) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  };
  U.rng = (seed) => {
    let a = seed >>> 0 || 1;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.shuffle = (arr, seed) => {
    const r = U.rng(seed == null ? Math.floor(Math.random() * 1e9) : seed);
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const WORD = /[\p{L}\p{N}]/u;

  ui.dot = (specId, size) => {
    const sp = UB.tx.get(specId);
    const st = size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size / 3) + 'px;border-radius:' + Math.round(size / 3.4) + 'px;' : '';

  };

    const r = 38, c = 2 * Math.PI * r;

      '<circle cx="46" cy="46" r="' + r + '" stroke="' + (color || 'var(--pri)') + '" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
  };
  ui.bar = (pct, color) => '<div class="bar"><i style="width:' + U.clamp(pct, 0, 100) + '%;' + (color ? 'background:' + color : '') + '"></i></div>';
  // accuracy status for meters (status palette + text label, never colour alone)
  ui.accStatus = (p) => (p == null ? ['var(--ink3)', '—', ''] : p >= 80 ? ['var(--st-good)', 'جيد', '✓'] : p >= 65 ? ['var(--st-warn)', 'متوسط', '◐'] : p >= 50 ? ['var(--st-serious)', 'ضعيف', '▲'] : ['var(--st-critical)', 'ضعيف جدًا', '▲']);
  ui.chip = (attrs, label, cls, n) => '<button class="chip ' + (cls || '') + '" ' + attrs + '><span class="t">' + label + '</span>' + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>';
  ui.switchRow = (key, title, desc, on, extra) => '<div class="sw-row"><div class="t"><b>' + title + '</b>' + (desc ? '<span>' + desc + '</span>' : '') + '</div>' + (extra || '') +
    '<button class="switch' + (on ? ' on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" data-a="sw" data-k="' + key + '" aria-label="' + U.esc(title) + '"></button></div>';
  ui.qRow = function (q, extra, attrs) {
    const i = S.info(q.id);
    const e = UB.B.eff(q);
    const badges = ['<span class="mini pri">' + U.esc(UB.B.srcLabel(q)) + '</span>'];
    if (e.sex && e.sex !== 'none') badges.push('<span class="mini">' + UB.sexIcon(e.sex) + ' ' + (e.age != null ? UB.ageText(e.age) : '') + '</span>');
    badges.push('<span class="mini">' + q.words + ' w</span>');
    if (q.imgs.some((x) => x.where === 'stem')) badges.push('<span class="mini">📷 ' + U.esc(q.imgs[0].mod || '') + '</span>');
    if (i.wrong) badges.push('<span class="mini bad">✕ ' + i.wrong + '</span>');
    else if (i.n) badges.push('<span class="mini ok">✓</span>');
    if (i.star) badges.push('<span class="mini">⭐</span>');
    return '<button class="list-row" ' + (attrs || '') + '>' + ui.dot(e.spec, 30) + '<div class="grow"><div class="qs en">' + U.esc(q.stem) + '</div><div class="m">' + badges.join('') + '</div>' + (extra || '') + '</div></button>';
  };

  /* ---------- global events ---------- */
  ui.bind = function () {
    document.addEventListener('click', (e) => {
      if (e.target.closest('.syncb')) {
        if (UB.PWA) {
          if (UB.GH && UB.GH.cfg) { UB.GH.syncNow(); ui.toast('جارٍ النسخ إلى GitHub…'); }
          else { ui.go('prefs'); ui.toast('فعّل النسخ التلقائي إلى GitHub من هنا'); }
          return;
        }
        if (S.mode !== 'cloud') { ui.toast('الحفظ في الحساب غير متاح هنا — بياناتك محفوظة على هذا الجهاز'); return; }
        const was = S.sync.state;
        S.retry();
        ui.toast(was === 'ok' ? '✓ كل إجاباتك محفوظة في حسابك' : 'جارٍ إعادة المحاولة…');
        return;
      }
      const n = e.target.closest('[data-nav]');
      if (n) {
        const id = n.dataset.nav;
        if (id === 'more') { ui.moreMenu(); return; }
        ui.go(id);
        return;
      }
      const p = e.target.closest('[data-preset]');
      if (p) { UB.openPreset(p.dataset.preset); return; }
      const root = $('#view');
      const t = e.target.closest('[data-a]');
      if (t && root.contains(t)) {
        const v = V[ui.cur];
        if (v && v.act) v.act(t.dataset.a, t, e);
      }
    });
    const vroot = $('#view');
    vroot.addEventListener('input', (e) => { const t = e.target.closest('[data-i]'); const v = V[ui.cur]; if (t && v && v.input) v.input(t.dataset.i, t, e); });
    vroot.addEventListener('change', (e) => { const t = e.target.closest('[data-c]'); const v = V[ui.cur]; if (t && v && v.change) v.change(t.dataset.c, t, e); });
    document.addEventListener('keydown', (e) => {
      const top = ui.top();
      if (top) { if (e.key === 'Escape') top.close(); return; }
      const v = V[ui.cur];
      const tag = (e.target && e.target.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
      if (v && v.key) v.key(e);
    });
    window.addEventListener('hashchange', () => { ui.closeAll(); ui.show(); });
    S.on('sync', ui.updateSync);
  };
  ui.moreMenu = function () {
    const items = [['plan', 'خطة اليوم', 'plan'], ['bank', 'بنك الأسئلة', 'bank'], ['starred', 'المحفوظة', 'star'], ['topics', 'ملخص المواضيع', 'topics'], ['library', 'المصادر والاستيراد', 'library'], ['prefs', 'الإعدادات والنسخ الاحتياطي', 'prefs']];
    ui.sheet({
      cls: 'sm',
      html: sh('المزيد') + '<div class="card">' + items.map(([id, l, ic]) => '<button class="ni" data-a="go" data-v="' + id + '" style="border-radius:0">' + ui.icon(ic) + '<span>' + l + '</span></button>').join('') + '</div>',
      onAct: (a, el, e, h) => { if (a === 'go') { h.close(); ui.go(el.dataset.v); } },
    });
  };
})();

</script><script>
/* UroBank — session engine (practice / exam / review / plan) + start dialog */
(function () {
  'use strict';
  const UB = window.UB;
  const U = UB.U, S = UB.S, B = UB.B, ui = UB.ui;
  const SE = (UB.SE = {});
  const MODE = { practice: 'p', exam: 'e', review: 'r', plan: 'd' };
  const MAXQ = 400;
  SE.MAXQ = MAXQ;

  SE.create = function (o) {
    const qids = o.qids.slice(0, MAXQ);
    const s = {
      id: 's' + U.uid(8), kind: o.kind || 'practice', title: o.title || '', created: Date.now(), qids, i: 0,
      disp: o.disp || 'clean', shuf: !!o.shuf, hideTags: !!o.hideTags, sumOnly: !!o.sumOnly,
      timer: o.timer && o.timer.kind !== 'none' ? { kind: 'total', sec: Math.max(60, Math.round(o.timer.sec)) } : { kind: 'none' },
      elapsed: 0, ans: {}, flags: {}, strike: {}, guess: {}, qt: {}, done: false, src: o.src || null,
    };
    S.setSession(s);
    return s;
  };
  SE.cur = () => (ui.params && ui.params.review && ui.st.rsess ? ui.st.rsess : S.session());
  SE.isExam = (s) => s && s.kind === 'exam';
  SE.live = (s) => s && !s.done && s !== ui.st.rsess;
  SE.save = (s) => { if (s && s === S.session()) S.setSession(s, true); };
  SE.order = (s, q) => {
    const keys = q.opts.map((o) => o.k);
    return s.shuf ? U.shuffle(keys, U.fnv(s.id + '|' + q.id)) : keys;
  };

  /* per-question timing */
  SE.enter = function (s, qid) {
    ui.st.qid = qid;
    ui.st.qStart = Date.now();
  };
  SE.leaveQ = function (s) {
    if (!s || !ui.st.qid || !ui.st.qStart) return;
    const qid = ui.st.qid;
    const a = s.ans[qid];
    if (!(a && a.ok !== undefined && !SE.isExam(s))) s.qt[qid] = (s.qt[qid] || 0) + (Date.now() - ui.st.qStart) / 1000;
    ui.st.qStart = Date.now();
  };
  SE.qTime = (s, qid) => (s.qt[qid] || 0) + (ui.st.qid === qid && ui.st.qStart ? (Date.now() - ui.st.qStart) / 1000 : 0);

  /* exam clock */
  SE.resume = (s) => { if (s && s.timer.kind !== 'none' && !s.done) ui.st.tStart = Date.now(); };
  SE.pause = (s) => {
    if (s && ui.st.tStart && !s.done) { s.elapsed += (Date.now() - ui.st.tStart) / 1000; ui.st.tStart = null; }
  };
  SE.remaining = (s) => {
    if (!s || s.timer.kind === 'none') return null;
    const run = ui.st.tStart ? (Date.now() - ui.st.tStart) / 1000 : 0;
    return Math.max(0, s.timer.sec - s.elapsed - run);
  };
  SE.locked = (s) => SE.isExam(s) && SE.live(s) && s.timer.kind !== 'none';

  /* answering */
  SE.answer = function (s, q, key) {
    if (!SE.live(s)) return;
    if (SE.isExam(s)) {
      const prev = s.ans[q.id];
      s.ans[q.id] = { k: key, ts: U.sec(), g: s.guess[q.id] ? 1 : 0 };
      if (prev && prev.k === key) delete s.ans[q.id];
      SE.save(s);
      return;
    }
    if (s.ans[q.id]) return;
    const t = SE.qTime(s, q.id);
    s.qt[q.id] = t;
    ui.st.qStart = Date.now();
    const ok = key === q.ans ? 1 : 0;
    let ts = U.sec();
    const st = S.st(q.id);
    if (st && st.a.some((x) => x[0] === ts && x[1] === key)) ts += 1;
    const conf = s.guess[q.id] ? 'g' : '';
    S.addAttempt(q.id, [ts, key, ok, Math.round(t * 10) / 10, MODE[s.kind] || 'p', s.id, '', conf]);
    s.ans[q.id] = { k: key, ok, t, ts, g: conf ? 1 : 0 };
    SE.save(s);
  };
  SE.setReason = function (s, q, r) {
    const a = s.ans[q.id];
    if (!a || !a.ts) return;
    a.r = a.r === r ? '' : r;
    S.updateAttempt(q.id, a.ts, { reason: a.r });
    SE.save(s);
  };

  SE.result = function (s) {
    const bySpec = {};
    let ok = 0, answered = 0, sec = 0;
    const ans = {};
    for (const qid of s.qids) {
      const q = B.byId[qid];
      if (!q) continue;
      const sp = B.eff(q).spec || 'x';
      bySpec[sp] = bySpec[sp] || [0, 0];
      const a = s.ans[qid];
      sec += s.qt[qid] || 0;
      if (SE.isExam(s) || a) bySpec[sp][0]++;
      if (!a) continue;
      answered++;
      ans[qid] = a.k;
      const isOk = a.k === q.ans;
      if (isOk) { ok++; bySpec[sp][1]++; }
    }
    const n = SE.isExam(s) ? s.qids.length : answered;
    return {
      id: s.id, at: Date.now(), kind: s.kind, title: s.title, n, total: s.qids.length, answered, ok,
      sec: Math.round(SE.isExam(s) && s.timer.kind !== 'none' ? s.elapsed : sec), bySpec, qids: s.qids.slice(), ans, disp: s.disp,
    };
  };
  SE.submit = function (s) {
    SE.leaveQ(s);
    SE.pause(s);
    for (const qid of s.qids) {
      const q = B.byId[qid];
      const a = s.ans[qid];
      if (!q || !a) continue;
      const isOk = a.k === q.ans ? 1 : 0;
      a.ok = isOk;
      S.addAttempt(qid, [a.ts || U.sec(), a.k, isOk, Math.round((s.qt[qid] || 0) * 10) / 10, 'e', s.id, '', a.g ? 'g' : '']);
    }
    s.done = true;
    const r = SE.result(s);
    S.addExam(r);
    S.setSession(null);
    return r;
  };
  SE.finish = function (s) {
    SE.leaveQ(s);
    const r = SE.result(s);
    if (r.answered) S.addExam(r);
    S.setSession(null);
    return r;
  };
  // open a finished exam/practice for review (read-only)
  SE.reviewOf = function (res, startIdx) {
    // questions of a removed source are skipped, so map the tapped row to its place in the filtered list
    const all = res.qids || [];
    const qids = all.filter((id) => B.byId[id]);
    const at = startIdx ? qids.indexOf(all[startIdx]) : 0;
    const s = {
      id: res.id, kind: res.kind, title: res.title, qids, i: Math.max(0, at),
      disp: 'clean', shuf: false, hideTags: false, sumOnly: false, timer: { kind: 'none' }, elapsed: res.sec,
      ans: {}, flags: {}, strike: {}, guess: {}, qt: {}, done: true, review: true,
    };
    for (const qid in res.ans || {}) {
      const q = B.byId[qid];
      if (!q) continue;
      const k = res.ans[qid];
      const st = S.st(qid);
      const at = st && st.a.find((x) => x[5] === res.id);
      s.ans[qid] = { k, ok: k === q.ans ? 1 : 0, ts: at ? at[0] : 0, r: at ? at[6] || '' : '' };
    }
    ui.st.rsess = s;
    return s;
  };

  /* ---------- start dialog ---------- */
  function hasHistory(qids) { for (const id of qids) if (S.info(id).n) return true; return false; }
  UB.startSheet = function (o) {
    const qids = o.qids || [];
    if (!qids.length) { ui.toast('لا توجد أسئلة مطابقة الآن', 'bad'); return; }
    const total = qids.length;
    const kind0 = o.kind || S.pref('sessMode') || 'practice';
    const st = {
      mode: kind0 === 'exam' ? 'exam' : 'practice',
      n: Math.min(total, o.n || (kind0 === 'exam' ? S.pref('boardN') : S.pref('sessN')) || 40, MAXQ),
      tkind: o.board ? 'total' : S.pref('timer') || 'total',
      perq: S.pref('examSec') || 72,
      mins: o.board ? S.pref('boardMin') : Math.max(5, Math.round(((S.pref('examSec') || 72) * Math.min(total, S.pref('sessN') || 40)) / 60)),
      disp: o.board ? 'clean' : S.pref('display') || 'clean',
      shuf: o.board ? true : S.pref('shuffle'), hideTags: o.board ? true : S.pref('hideTags'), sumOnly: S.pref('sumOnly'),
    };
    if (o.board) { st.mode = 'exam'; st.n = Math.min(total, S.pref('boardN') || 100, MAXQ); }
    const hist = hasHistory(qids);
    const html = () => {
      const mc = (id, ic, title, desc, def) =>
        '<button class="mc' + (st.disp === id ? ' on' : '') + '" data-a="disp" data-v="' + id + '"><div class="row" style="justify-content:space-between"><span style="font-size:22px">' + ic + '</span>' +
        (def ? '<span class="def">الافتراضي</span>' : '') + '</div><b>' + title + '</b><div class="d">' + desc + '</div></button>';
      const timerHtml = st.mode !== 'exam' ? '' :
        '<div class="lbl" style="font-size:14px;font-weight:700;margin:16px 0 8px">الوقت</div>' +
        '<div class="seg" style="max-width:520px"><button class="' + (st.tkind === 'none' ? 'on' : '') + '" data-a="tk" data-v="none">بدون وقت</button>' +
        '<button class="' + (st.tkind === 'perq' ? 'on' : '') + '" data-a="tk" data-v="perq">وقت لكل سؤال</button>' +
        '<button class="' + (st.tkind === 'total' ? 'on' : '') + '" data-a="tk" data-v="total">وقت كلي</button></div>' +
        (st.tkind === 'perq' ? '<div class="row" style="margin-top:10px"><div class="stepper"><button class="sb" data-a="perq" data-d="-6">−</button><input type="number" inputmode="numeric" data-i="perq" value="' + st.perq + '"><button class="sb" data-a="perq" data-d="6">+</button><span class="st">ثانية لكل سؤال</span></div><span class="note">= ' + U.dur(st.perq * st.n) + '</span></div>' : '') +

        '</div>' +

        '<button class="btn g" data-a="close">إلغاء</button><button class="btn p" data-a="start" style="min-width:200px">' + (st.mode === 'exam' ? '⏱ ابدأ الامتحان · ' : '📖 ابدأ · ') + U.nQ(st.n) + '</button></div>';
    };
    ui.sheet({
      cls: 'lg',
      html: html(),
      onAct: (a, el, e, h) => {
        const max = Math.min(total, MAXQ);
        if (a === 'mode') { st.mode = el.dataset.v; if (st.mode === 'exam' && st.tkind === 'none' && o.board) st.tkind = 'total'; }

      const kind = st.mode === 'exam' ? 'exam' : o.kind === 'review' || o.kind === 'plan' ? o.kind : 'practice';
      const ids = qids.slice(0, st.n);
      const timer = kind !== 'exam' || st.tkind === 'none' ? { kind: 'none' } : { kind: 'total', sec: st.tkind === 'perq' ? st.perq * ids.length : st.mins * 60 };
      if (!o.board) {
        const p = S.docs.meta.prefs || (S.docs.meta.prefs = {});
        p.sessMode = st.mode; p.display = st.disp; p.shuffle = st.shuf; p.hideTags = st.hideTags; p.sumOnly = st.sumOnly;
        p.timer = st.tkind; p.examSec = st.perq;
        if (st.mode === 'practice') p.sessN = st.n;
        S.touch('meta', true);
      }
      SE.create({ kind, title: o.title, qids: ids, disp: st.disp, shuf: st.shuf, hideTags: st.hideTags, sumOnly: st.sumOnly && kind !== 'exam', timer, src: o.src || null });
      ui.params = {};
      ui.go('study');
    }
  };

  UB.startBoard = function () {
    const all = U.shuffle(B.list.filter((q) => B.usable(q)).map((q) => q.id));
    UB.startSheet({ qids: all, title: 'محاكاة البورد العراقي', kind: 'exam', board: true });
  };
  UB.presetById = (id) => UB.F.preset(id) || S.saved().find((x) => x.id === id) || null;
  UB.openPreset = function (id) {
    const p = UB.presetById(id);
    if (!p) return;
    const f = UB.F.norm(p.f);
    const list = UB.F.sort(UB.F.run(f), f.sort || 'random');
    if (!list.length) { ui.toast('لا توجد أسئلة مطابقة لهذا الفلتر الآن', 'bad'); return; }
    UB.startSheet({ qids: list.map((q) => q.id), title: p.name, kind: p.mode || 'practice', src: { label: p.name, f } });
  };
  UB.startList = function (qids, title, kind, startAt) {
    if (!qids.length) return;
    const s = SE.create({ kind: kind || 'practice', title, qids, disp: S.pref('display'), shuf: S.pref('shuffle'), hideTags: S.pref('hideTags'), sumOnly: S.pref('sumOnly'), timer: { kind: 'none' } });
    s.i = U.clamp(startAt || 0, 0, s.qids.length - 1);
    SE.save(s);
    ui.params = {};
    ui.go('study');
  };
})();

</script><script>
/* UroBank — study view: question screen, explanations, history, notes, edit, image viewer, exam navigator */
(function () {
  'use strict';
  const UB = window.UB;
  const U = UB.U, S = UB.S, B = UB.B, ui = UB.ui, SE = UB.SE, V = UB.V;
  const L = 'ABCDEFGHIJ';
  const esc = U.esc;
  let ticker = null;

  const paras = (t) => esc(t).split(/\n\s*\n/).map((p) => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
  function sumHtml(q, s) {
    let t = q.sum;
    // the summary starts with the book letter ("B — …"); show the letter as displayed in this session
    if (t && s) {
      const m0 = /^([A-J])\s*—\s*/.exec(t);
      if (m0 && m0[1] === q.ans) { const pos = SE.order(s, q).indexOf(q.ans); if (pos >= 0) t = L[pos] + ' — ' + t.slice(m0[0].length); }
    }
    if (!t) { const s = q.expl.split(/\.\s+/); t = s.slice(0, 2).join('. ') + (s.length > 1 ? '.' : ''); }
    const m = /^(.{2,140}?\.)\s+(.*)$/s.exec(t);
    return m ? '<b>' + esc(m[1]) + '</b> ' + esc(m[2]) : esc(t);
  }
  const priorOf = (s, q) => ((S.st(q.id) && S.st(q.id).a) || []).filter((x) => x[5] !== s.id);

  function tagsHtml(s, q) {
    const e = B.eff(q);
    const src = B.src(q);
    const t = ['<span class="tag" style="background:' + src.color + '1A;color:' + src.color + ';border-color:transparent">' + esc(B.srcLabel(q)) + '</span>'];
    if (!s.hideTags || s.done) {
      if (e.sub || e.topic || e.spec) t.push('<span class="tag" style="background:' + UB.tx.color(e.spec) + '18;color:' + UB.tx.color(e.spec) + ';border-color:transparent">' + esc(UB.tx.label(e.sub || e.topic || e.spec, 2)) + '</span>');
      if (e.sex && e.sex !== 'none') t.push('<span class="tag">' + UB.sexIcon(e.sex) + ' ' + esc(UB.ageText(e.age)) + '</span>');
      if (q.qtype) t.push('<span class="tag">' + esc(UB.facLabel('qtype', q.qtype)) + '</span>');
    }
    t.push('<span class="tag">' + q.words + ' words</span>');
    if (B.isDemo(q)) t.push('<span class="tag warn">تجريبي</span>');
    if (B.status(q) === 'review') t.push('<span class="tag warn">تصنيف غير مؤكد</span>');
    return '<div class="qtags">' + t.join('') + '</div>';
  }

  function priorBadges(s, q, revealed) {
    if (revealed || s.disp === 'clean' || !SE.live(s)) return '';
    const p = priorOf(s, q);
    if (!p.length) return '';
    const wrong = p.filter((x) => x[2] !== 1).length;
    const last = p[p.length - 1];
    const b = [];
    if (wrong) b.push('<span class="tag bad">⚠ أخطأت فيه ' + U.nTimes(wrong) + '</span>');
    else b.push('<span class="tag ok">✓ أجبته صحيحًا ' + U.nTimes(p.length) + '</span>');
    b.push('<span class="tag">آخر مرة: ' + U.rel(last[0] * 1000) + '</span>');
    return '<div class="prior">' + b.join('') + '</div>';
  }

  function optionsHtml(s, q, revealed) {
    const a = s.ans[q.id];
    const order = SE.order(s, q);
    const prevWrong = {};
    if (!revealed && s.disp === 'full' && SE.live(s)) for (const x of priorOf(s, q)) if (x[2] !== 1) prevWrong[x[1]] = (prevWrong[x[1]] || 0) + 1;
    const struck = s.strike[q.id] || [];
    return '<div class="opts en">' + order.map((k, idx) => {
      const o = q.opts.find((x) => x.k === k) || { t: '' };
      let cls = 'opt', mk = '', mkc = '';
      if (revealed) {
        cls += ' lock';
        if (k === q.ans) { cls += ' ok'; mk = a && a.k === k ? 'إجابتك ✓' : 'الصحيحة ✓'; mkc = 'ok'; }
        else if (a && a.k === k) { cls += ' bad'; mk = 'إجابتك ✕'; mkc = 'bad'; }
      } else {
        if (a && a.k === k) cls += ' picked';
        else if (prevWrong[k]) { cls += ' prevbad'; mk = 'اخترته ' + U.nTimes(prevWrong[k]) + ' ✕'; mkc = 'bad'; }
        if (struck.includes(k)) cls += ' struck';
      }
      return '<button class="' + cls + '" data-a="opt" data-k="' + esc(k) + '"><span class="k">' + L[idx] + '</span><span class="t">' + esc(o.t) + '</span>' +
        (mk ? '<span class="mk ' + mkc + '">' + mk + '</span>' : '') +
        (!revealed ? '<span class="xs" data-a="strike" data-k="' + esc(k) + '" title="شطب هذا الاختيار" aria-label="شطب">⊘</span>' : '') + '</button>';
    }).join('') + '</div>';
  }

  function imgsHtml(q, where) {
    const list = q.imgs.filter((x) => x.where === where);
    if (!list.length) return '';
    return '<div class="qimgs">' + list.map((im) => '<button class="qimg" data-a="img" data-src="' + esc(im.src) + '" data-cap="' + esc(im.cap) + '"><img src="' + esc(im.src) + '" alt="' + esc(im.cap || im.mod || 'image') + '" loading="lazy"><span class="zoom">⤢ تكبير</span>' + (im.cap ? '<span class="cap">' + esc(im.cap) + '</span>' : '') + '</button>').join('') + '</div>';
  }

  function compareHtml(s, q) {
    const a = s.ans[q.id];
    if (!a || s.review) return '';
    const p = priorOf(s, q);
    const inf = S.info(q.id);
    let streak = '';
    if (inf.wrong) streak = inf.active ? ' · صحيح متتالٍ ' + inf.streak + ' من 2 للخروج من قائمة الأخطاء' : ' · 🎉 خرج السؤال من قائمة الأخطاء';
    if (!p.length) {
      if (a.ok) return '';
      return '<div class="cmpline"><span class="ic">📌</span><div>أُضيف السؤال إلى قائمة الأخطاء. سيعود إليك للمراجعة بعد يوم، ثم بعد 3 أيام، ثم بعد أسبوع.</div></div>';
    }
    const pw = p.filter((x) => x[2] !== 1);
    const lastWrong = pw[pw.length - 1];
    if (a.ok) {
      if (pw.length) return '<div class="cmpline"><span class="ic">📈</span><div><b style="color:var(--ok)">صحيحة هذه المرة!</b> سابقًا أخطأت ' + U.nTimes(pw.length) + ' واخترت «<span class="ens">' + esc(B.optText(q, lastWrong[1])) + '</span>»' + streak + (a.g ? ' · بالتخمين: لا تُحسب للخروج من القائمة' : '') + '</div></div>';
      return '<div class="cmpline"><span class="ic">✓</span><div>أجبته صحيحًا في المرات السابقة أيضًا (' + U.nTimes(p.length) + ').</div></div>';
    }
    const same = pw.some((x) => x[1] === a.k);
    if (pw.length) return '<div class="cmpline"><span class="ic">🔁</span><div><b style="color:var(--bad)">أخطأت فيه مرة أخرى</b> — المجموع ' + U.nTimes(inf.wrong) + (same ? ' · اخترت نفس الإجابة الخاطئة السابقة' : ' · هذه المرة اخترت إجابة خاطئة مختلفة') + '</div></div>';
    return '<div class="cmpline"><span class="ic">⚠</span><div>سبق أن أجبته صحيحًا ' + U.nTimes(p.length) + '، لكن أخطأت هذه المرة — أُضيف إلى قائمة الأخطاء.</div></div>';
  }

  function reasonsHtml(s, q) {
    const a = s.ans[q.id];
    if (!a || a.ok || !a.ts) return '';
    return '<div class="reasons"><div class="h">لماذا أخطأت؟ <span class="note">(اختياري — يساعدك في الإحصائيات)</span></div><div class="chips">' +
      UB.REASONS.map(([k, l]) => '<button class="chip' + (a.r === k ? ' inc' : '') + '" data-a="reason" data-v="' + k + '">' + l + '</button>').join('') + '</div></div>';
  }

  function explHtml(s, q) {
    const a = s.ans[q.id];
    const tab = ui.st.tab || (s.sumOnly ? 'sum' : S.pref('explTab') || 'sum');
    const demo = B.isDemo(q);
    let verdict;
    if (!a) verdict = '<div class="verdict neutral"><div><b>— لم تُجب على هذا السؤال</b><span>الإجابة الصحيحة: ' + L[SE.order(s, q).indexOf(q.ans)] + '</span></div></div>';
    else if (a.ok) verdict = '<div class="verdict ok"><div><b>✓ إجابة صحيحة</b><span>' + (a.t ? 'استغرقت ' + U.dur(a.t) : '') + (a.g ? ' · كانت تخمينًا: يبقى السؤال في المراجعة' : '') + '</span></div></div>';
    else {
      const inf = S.info(q.id);
      verdict = '<div class="verdict bad"><div><b>✕ إجابة خاطئة</b><span>' + (s.review ? 'الإجابة الصحيحة: ' + L[SE.order(s, q).indexOf(q.ans)] : 'أُضيف إلى قائمة الأخطاء · أخطأت فيه ' + U.nTimes(inf.wrong)) + '</span></div></div>';
    }
    const seg = '<div class="seg"><button class="' + (tab === 'sum' ? 'on' : '') + '" data-a="tab" data-v="sum">⚡ الملخص</button><button class="' + (tab === 'full' ? 'on' : '') + '" data-a="tab" data-v="full">📖 الشرح الكامل</button><button class="' + (tab === 'both' ? 'on' : '') + '" data-a="tab" data-v="both">الاثنان معًا</button></div>';
    const sum = '<div class="sum"><h5><span class="ens">Quick summary</span><span style="font-weight:500;font-size:12.5px">ملخص' + (q.sum ? '' : ' (من الشرح)') + '</span></h5><p class="en">' + sumHtml(q, s) + '</p></div>';
    const refs = (q.refs || []).length ? '<div class="ref en">' + q.refs.map(esc).join(' · ') + '</div>' : '';
    const page = q.page ? '<div class="ref">صفحة ' + esc(q.page) + ' في المصدر</div>' : '';
    const full = '<div class="full"><h5><span class="ens">' + (demo ? 'Full explanation (sample)' : 'Full explanation (from the book)') + '</span><span style="font-weight:500;font-size:12.5px;color:var(--ink3)">' + (demo ? 'شرح تجريبي' : 'الشرح الكامل') + '</span></h5><div class="en">' + paras(q.expl) + '</div>' + imgsHtml(q, 'expl') + refs + page + '</div>';
    const body = tab === 'sum' ? sum : tab === 'full' ? full : sum + full;
    let sim = '';
    if (!s.review) {
      const list = B.similar(q, 3);
      if (list.length) {
        sim = '<div class="card"><div class="sec" style="padding:12px 14px 0;margin:0"><h3 style="font-size:15px">أسئلة مشابهة من الموضوع نفسه</h3></div>' +
          list.map((x) => {
            const inSess = s.qids.includes(x.id);
            return '<div class="list-row" style="align-items:center"><div class="grow"><div class="qs en">' + esc(x.stem) + '</div><div class="m"><span class="mini pri">' + esc(B.srcLabel(x)) + '</span>' + (S.info(x.id).n ? '<span class="mini">حللته</span>' : '') + '</div></div>' +
              (inSess ? '<span class="note">في الجلسة</span>' : '<button class="btn s sm" data-a="addsim" data-id="' + esc(x.id) + '">＋ بعد هذا السؤال</button>') + '</div>';
          }).join('') + '</div>';
      }
    }
    return verdict + seg + body + sim;
  }

  V.study = {
    focus: true,
    render() {
      const s = SE.cur();
      if (!s) {
        return '<div class="study"><header class="qhead"><button class="ib" data-a="home">' + ui.icon('close') + '</button><div class="qnum">لا توجد جلسة</div></header><div class="qbody"><div class="empty"><div class="big">📚</div>لا توجد جلسة مفتوحة.<br><br><button class="btn p" data-a="home">العودة للرئيسية</button></div></div></div>';
      }
      s.i = U.clamp(s.i || 0, 0, Math.max(0, s.qids.length - 1));
      const qid = s.qids[s.i];
      const q = B.byId[qid];
      if (ui.st.qid !== qid) {
        if (SE.live(s)) SE.leaveQ(s);
        SE.enter(s, qid);
        ui.st.tab = null;
      }
      const n = s.qids.length;
      const live = SE.live(s);
      const exam = SE.isExam(s);
      const answeredN = s.qids.filter((id) => s.ans[id]).length;
      const rem = SE.remaining(s);
      const locked = SE.locked(s);
      const head = '<header class="qhead">' +
        '<button class="ib" data-a="exit" aria-label="خروج">' + ui.icon('close') + '</button>' +
        '<div class="qnum ens">Q ' + (s.i + 1) + ' / ' + n + '</div>' +
        '<div class="prog" title="تمت الإجابة على ' + answeredN + '"><i style="width:' + U.pct(answeredN, n) + '%"></i></div>' +
        (rem != null && live ? '<div class="timer" id="tmr">⏱ ' + U.clock(rem) + '</div>' : '') +
        '<button class="ib" data-a="grid" aria-label="كل الأسئلة">' + ui.icon('grid') + '</button>' +
        '<button class="btn g sm" data-a="hist"' + (locked ? ' style="opacity:.45"' : '') + '>🕘 <span class="hide-sm">سجلي</span></button>' +
        '<button class="ib ens" data-a="aa" style="font-weight:700;font-size:15px" aria-label="حجم الخط والمظهر">Aa</button>' +
        '</header>';
      if (!q) {
        return '<div class="study">' + head + '<div class="qbody"><div class="empty"><div class="big">🔍</div>هذا السؤال لم يعد موجودًا في المصادر المفعّلة.<br><br><button class="btn p" data-a="next">التالي</button></div></div></div>';
      }
      const a = s.ans[q.id];
      const revealed = exam ? !!s.done : !!a || !!s.done;
      const inf = S.info(q.id);
      const qcol = '<section class="qcol" data-scroll="q">' + tagsHtml(s, q) + priorBadges(s, q, revealed) +
        '<div class="qtext en">' + esc(q.stem) + '</div>' + imgsHtml(q, 'stem') + optionsHtml(s, q, revealed) +
        (!revealed && live && S.pref('askConf') ? '<div class="guess"><button class="chip' + (s.guess[q.id] ? ' inc' : '') + '" data-a="guess">🤔 أخمّن</button><span>علّمها إن لم تكن متأكدًا — الإجابة الصحيحة بالتخمين تبقى في المراجعة</span></div>' : '') +
        (exam && live && a ? '<div class="note" style="margin-top:10px">حُفظت إجابتك · تستطيع تغييرها حتى التسليم</div>' : '') +
        (revealed && !exam ? '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">' + compareHtml(s, q) + reasonsHtml(s, q) + '</div>' : '') +
        (revealed && exam && a && !a.ok && s.review ? '<div style="margin-top:14px">' + reasonsHtml(s, q) + '</div>' : '') +
        '</section>';
      const ecol = '<section class="ecol" data-scroll="e">' + (revealed ? explHtml(s, q) :
        '<div class="placeholder">' + (exam ? '<div class="big">⏱</div>وضع الامتحان: الإجابات والشرح تظهر بعد التسليم.' : '<div class="big">👆</div>اختر إجابتك… الملخص والشرح الكامل سيظهران هنا.') +
        '<div style="margin-top:10px" class="note">لوحة المفاتيح: <span class="kbd">A–E</span> اختيار · <span class="kbd">Enter</span> التالي · <span class="kbd">Space</span> الشرح</div></div>') + '</section>';
      const last = s.i === n - 1;
      const nextLabel = last ? (exam && live ? 'تسليم الامتحان' : s.review ? 'العودة للنتيجة' : 'إنهاء الجلسة') : 'التالي ›';
      const flagOn = exam && live ? !!s.flags[q.id] : inf.flag;
      const foot = '<footer class="qfoot">' +
        '<button class="btn g" data-a="prev"' + (s.i === 0 ? ' disabled' : '') + '>‹ السابق</button>' +
        '<button class="ib' + (inf.star ? ' on' : '') + '" data-a="star" title="حفظ ⭐" aria-label="حفظ">⭐</button>' +
        '<button class="ib' + (inf.note ? ' on' : '') + '" data-a="note" title="ملاحظتي" aria-label="ملاحظة">📝</button>' +
        '<button class="ib' + (flagOn ? ' on' : '') + '" data-a="flag" title="' + (exam && live ? 'علّمه للرجوع إليه قبل التسليم' : 'معلَّم للرجوع إليه') + '" aria-label="تعليم">🚩</button>' +
        '<button class="ib" data-a="edit" title="تعديل التصنيف / إبلاغ عن خطأ" aria-label="تعديل">' + ui.icon('edit') + '</button>' +
        '<div style="flex:1"></div>' +
        '<span class="hint"><span class="kbd">A–E</span> اختيار <span class="kbd">Enter</span> التالي <span class="kbd">S</span> حفظ <span class="kbd">H</span> سجلي</span>' +
        (exam && live && !last ? '<button class="btn s" data-a="submit">تسليم</button>' : '') +
        '<button class="btn p" data-a="next" style="min-width:170px">' + nextLabel + '</button></footer>';
      return '<div class="study">' + head + '<div class="qbody">' + qcol + ecol + '</div>' + foot + '</div>';
    },
    after() {
      const s = SE.cur();
      clearInterval(ticker);
      if (s && SE.live(s) && s.timer.kind !== 'none') {
        if (!ui.st.tStart) SE.resume(s);
        ticker = setInterval(() => {
          const cur = SE.cur();
          if (!cur || cur !== s || UB.ui.cur !== 'study') { clearInterval(ticker); return; }
          const rem = SE.remaining(s);
          const el = document.getElementById('tmr');
          if (el) { el.textContent = '⏱ ' + U.clock(rem); el.classList.toggle('low', rem < Math.min(300, s.timer.sec * 0.1)); }
          if (rem <= 0) { clearInterval(ticker); ui.toast('انتهى الوقت — تم تسليم الامتحان تلقائيًا', 'bad', 4000); doSubmit(s); }
        }, 1000);
      }
    },
    leave() {
      clearInterval(ticker);
      const s = SE.cur();
      if (s && SE.live(s)) { SE.leaveQ(s); SE.pause(s); SE.save(s); }
      ui.st.qid = null;
      ui.st.tStart = null;
    },
    act(a, el) {
      const s = SE.cur();
      if (a === 'home') { ui.go('home'); return; }
      if (!s) return;
      const q = B.byId[s.qids[s.i]];
      switch (a) {
        case 'exit':
          if (s.review) { const id = s.id; ui.st.rsess = null; ui.go('results', { id }); return; }
          ui.go('home');
          if (SE.live(s)) ui.toast('حُفظت الجلسة — تستطيع إكمالها من الرئيسية');
          return;
        case 'opt': {
          if (!q || !SE.live(s)) return;
          if (!SE.isExam(s) && s.ans[q.id]) return;
          SE.answer(s, q, el.dataset.k);
          ui.refresh();
          if (!SE.isExam(s)) {
            const ec = document.querySelector('.ecol');
            if (ec && getComputedStyle(ec).overflowY !== 'auto') setTimeout(() => ec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
          }
          return;
        }
        case 'strike': {
          if (!q || !SE.live(s)) return;
          const k = el.dataset.k;
          const arr = s.strike[q.id] || [];
          s.strike[q.id] = arr.includes(k) ? arr.filter((x) => x !== k) : arr.concat([k]);
          SE.save(s);
          ui.refresh();
          return;
        }
        case 'guess': if (q) { s.guess[q.id] = s.guess[q.id] ? 0 : 1; SE.save(s); ui.refresh(); } return;
        case 'reason': if (q) { SE.setReason(s, q, el.dataset.v); ui.refresh(); } return;
        case 'tab': ui.st.tab = el.dataset.v; ui.refresh(); return;
        case 'next': return next(s);
        case 'prev': if (s.i > 0) { s.i--; SE.save(s); ui.render(true); } return;
        case 'star': if (q) { const v = !S.info(q.id).star; S.setStar(q.id, v); ui.toast(v ? '⭐ حُفظ السؤال' : 'أُزيل من المحفوظة'); ui.refresh(); } return;
        case 'flag':
          if (!q) return;
          if (SE.isExam(s) && SE.live(s)) { s.flags[q.id] = s.flags[q.id] ? 0 : 1; SE.save(s); }
          else S.setFlag(q.id, !S.info(q.id).flag);
          ui.refresh();
          return;
        case 'note': if (q) UB.noteSheet(q, () => ui.refresh()); return;
        case 'edit': if (q) UB.editQuestion(q, () => ui.refresh()); return;
        case 'hist':
          if (!q) return;
          if (SE.locked(s)) { ui.toast('🔒 "سجلي" مقفل أثناء الامتحان المؤقت حتى التسليم'); return; }
          UB.historySheet(q);
          return;
        case 'aa': UB.aaSheet(); return;
        case 'grid': return gridSheet(s);
        case 'submit': return confirmSubmit(s);
        case 'img': UB.viewImage(el.dataset.src, el.dataset.cap); return;
        case 'addsim': {
          const id = el.dataset.id;
          if (!s.qids.includes(id)) { s.qids.splice(s.i + 1, 0, id); SE.save(s); ui.toast('أُضيف بعد هذا السؤال'); ui.refresh(); }
          return;
        }
      }
    },
    key(e) {
      const s = SE.cur();
      if (!s) return;
      const q = B.byId[s.qids[s.i]];
      const k = e.key;
      if (/^[a-eA-E1-5]$/.test(k) && q) {
        const idx = /\d/.test(k) ? +k - 1 : k.toUpperCase().charCodeAt(0) - 65;
        const order = SE.order(s, q);
        if (idx < order.length) { e.preventDefault(); V.study.act('opt', { dataset: { k: order[idx] } }); }
        return;
      }
      if (k === 'Enter' || k === 'ArrowLeft') { e.preventDefault(); next(s); return; }
      if (k === 'ArrowRight') { e.preventDefault(); V.study.act('prev', {}); return; }
      if (k === ' ') {
        e.preventDefault();
        const t = ui.st.tab || S.pref('explTab') || 'sum';
        ui.st.tab = t === 'sum' ? 'full' : 'sum';
        ui.refresh();
        return;
      }
      const map = { s: 'star', S: 'star', f: 'flag', F: 'flag', h: 'hist', H: 'hist', n: 'note', N: 'note' };
      if (map[k]) { e.preventDefault(); V.study.act(map[k], {}); }
    },
  };

  function next(s) {
    if (s.i < s.qids.length - 1) { s.i++; SE.save(s); ui.render(true); return; }
    if (s.review) { const id = s.id; ui.st.rsess = null; ui.go('results', { id }); return; }
    if (SE.isExam(s) && SE.live(s)) { confirmSubmit(s); return; }
    const r = SE.finish(s);
    if (r.answered) ui.go('results', { id: r.id });
    else { ui.go('home'); ui.toast('انتهت الجلسة'); }
  }
  async function confirmSubmit(s) {
    const un = s.qids.filter((id) => !s.ans[id]).length;
    const fl = s.qids.filter((id) => s.flags[id]).length;
    const ok = await ui.confirm({
      title: 'تسليم الامتحان؟',
      html: 'أجبت على ' + (s.qids.length - un) + ' من ' + s.qids.length + '.' + (un ? '<br><b style="color:var(--bad)">' + U.nQ(un) + ' بلا إجابة</b> (تُحسب خاطئة في النتيجة ولا تُضاف لسجلك).' : '') + (fl ? '<br>🚩 ' + U.nQ(fl) + ' معلَّمة للمراجعة.' : ''),
      ok: 'تسليم', cancel: 'متابعة الامتحان',
    });
    if (ok) doSubmit(s);
  }
  function doSubmit(s) {
    clearInterval(ticker);
    const r = SE.submit(s);
    ui.st.qid = null;
    ui.go('results', { id: r.id });
  }

  function gridSheet(s) {
    const live = SE.live(s), exam = SE.isExam(s);
    const html = () => ui.sh('كل أسئلة الجلسة', U.nQ(s.qids.length) + (exam && live ? ' · المجاب: ' + s.qids.filter((id) => s.ans[id]).length : '')) +
      '<div class="navgrid ens">' + s.qids.map((id, i) => {
        const a = s.ans[id];
        const q = B.byId[id];
        let c = '';
        if (a) c = exam && live ? 'ans' : q && a.k === q.ans ? 'ok' : 'bad';
        if (i === s.i) c += ' cur';
        if (s.flags[id] || (!exam && S.info(id).flag)) c += ' fl';
        return '<button class="' + c + '" data-a="jump" data-i="' + i + '">' + (i + 1) + '</button>';
      }).join('') + '</div>' +
      '<div class="row note" style="margin-top:14px"><span class="mini pri">مجاب</span>' + (exam && live ? '' : '<span class="mini ok">صحيح</span><span class="mini bad">خطأ</span>') + '<span>🚩 معلَّم</span></div>' +
      (exam && live ? '<div class="acts"><button class="btn s" data-a="sub">تسليم الامتحان</button></div>' : '');
    ui.sheet({
      html: html(),
      onAct: (a, el, e, h) => {
        if (a === 'jump') { h.close(); s.i = +el.dataset.i; SE.save(s); ui.render(true); }
        if (a === 'sub') { h.close(); confirmSubmit(s); }
      },
    });
  }

  /* ---------- history ---------- */
  UB.historySheet = function (q) {
    const st = S.st(q.id);
    const list = ((st && st.a) || []).slice().reverse();
    const inf = S.info(q.id);
    const rows = list.length ? list.map((x) => {
      const ok = x[2] === 1;
      const meta = [U.rel(x[0] * 1000) + ' · ' + U.date(x[0] * 1000, true), UB.MODE_LABEL[x[4]] || 'تدريب'];
      if (x[3]) meta.push(U.dur(x[3]));
      if (x[6]) meta.push('السبب: ' + UB.facLabel('reason', x[6]));
      if (x[7] === 'g') meta.push('بالتخمين');
      return '<div class="att"><div class="r ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✕') + '</div><div class="x"><b class="ens" style="display:block;text-align:right">' + esc(B.optText(q, x[1])) + '</b><span>' + meta.join(' · ') + '</span></div></div>';
    }).join('') : '<div class="empty">لم تحل هذا السؤال من قبل.</div>';
    const summary = list.length ? '<div class="row" style="margin-bottom:10px"><span class="tag">' + U.ar(list.length, ['محاولة واحدة', 'محاولتان', 'محاولات', 'محاولة', 'محاولة']) + '</span>' +
      (inf.wrong ? '<span class="tag bad">✕ أخطأت ' + U.nTimes(inf.wrong) + '</span>' : '<span class="tag ok">✓ بلا أخطاء</span>') +
      (inf.active ? '<span class="tag warn">في قائمة الأخطاء</span>' : '') + (inf.due && inf.wrong ? '<span class="tag">المراجعة القادمة: ' + U.date(inf.due) + '</span>' : '') + '</div>' : '';
    ui.sheet({
      cls: 'sm',
      html: ui.sh('🕘 سجل هذا السؤال') + summary + '<div>' + rows + '</div>' + (inf.note ? '<div class="banner info" style="margin-top:12px">📝 ' + esc(inf.note) + '</div>' : '') +
        '<div class="acts"><button class="btn g" data-a="note">📝 ملاحظتي على السؤال</button><button class="btn p" data-a="close">إغلاق</button></div>',
      onAct: (a, el, e, h) => { if (a === 'note') { h.close(); UB.noteSheet(q, () => ui.refresh()); } },
    });
  };

  UB.noteSheet = async function (q, done) {
    const cur = S.info(q.id).note;
    const v = await ui.prompt({ title: '📝 ملاحظتي على السؤال', value: cur, multi: true, placeholder: 'اكتب ملاحظة تظهر لك كلما رجعت لهذا السؤال…', del: cur ? 'حذف الملاحظة' : '' });
    if (v === null) return;
    S.setNote(q.id, v);
    ui.toast(v ? 'حُفظت الملاحظة' : 'حُذفت الملاحظة');
    if (done) done();
  };

  /* ---------- appearance ---------- */
  UB.aaSheet = function () {
    const html = () => {
      const fs = S.pref('fs') || 1;
      const th = S.pref('theme');
      const et = S.pref('explTab');
      return ui.sh('حجم الخط والمظهر') +
        '<div class="lbl" style="font-weight:700;margin-bottom:8px">حجم خط السؤال</div><div class="row"><div class="stepper"><button class="sb" data-a="fs" data-d="-0.05">−</button><span class="st ens" style="min-width:56px;text-align:center;font-weight:700">' + Math.round(fs * 100) + '%</span><button class="sb" data-a="fs" data-d="0.05">+</button></div><button class="chip" data-a="fs0">إعادة 100%</button></div>' +
        '<div class="lbl" style="font-weight:700;margin:16px 0 8px">المظهر</div><div class="seg"><button class="' + (th === 'light' ? 'on' : '') + '" data-a="th" data-v="light">☀︎ فاتح</button><button class="' + (th === 'sepia' ? 'on' : '') + '" data-a="th" data-v="sepia">📜 بيج للقراءة</button><button class="' + (th === 'dark' ? 'on' : '') + '" data-a="th" data-v="dark">☾ داكن</button></div>' +
        '<div class="lbl" style="font-weight:700;margin:16px 0 8px">يظهر بعد الإجابة أولًا</div><div class="seg"><button class="' + (et === 'sum' ? 'on' : '') + '" data-a="et" data-v="sum">⚡ الملخص</button><button class="' + (et === 'full' ? 'on' : '') + '" data-a="et" data-v="full">📖 الشرح الكامل</button><button class="' + (et === 'both' ? 'on' : '') + '" data-a="et" data-v="both">الاثنان</button></div>' +
        '<div class="acts"><button class="btn p" data-a="close">تم</button></div>';
    };
    ui.sheet({
      cls: 'sm', html: html(),
      onAct: (a, el, e, h) => {
        if (a === 'fs') S.setPref('fs', Math.round(U.clamp((S.pref('fs') || 1) + +el.dataset.d, 0.8, 1.6) * 100) / 100);
        else if (a === 'fs0') S.setPref('fs', 1);
        else if (a === 'th') S.setPref('theme', el.dataset.v);
        else if (a === 'et') { S.setPref('explTab', el.dataset.v); ui.st.tab = null; }
        else return;
        ui.applyTheme();
        h.update(html());
        ui.refresh();
      },
    });
  };

  /* ---------- edit classification / report ---------- */
  UB.editQuestion = function (q, done) {
    const e = B.eff(q);
    const inf = S.info(q.id);
    const st = { spec: e.spec || '', topic: e.topic || '', sub: e.sub || '', sex: e.sex || 'none', age: e.age != null ? e.age : '', rev: inf.rev || B.status(q) === 'ok', issue: (inf.ov && inf.ov.issue) || '' };
    const html = () => {
      const sp = UB.tx.get(st.spec);
      const tp = UB.tx.get(st.topic);
      const opt = (v, l, cur) => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>';
      return ui.sh('تعديل بيانات السؤال', 'التعديل يخصّك ويُحفظ مع سجلك، ولا يغيّر ملف الكتاب') +
        '<div class="note en" style="margin-bottom:12px;-webkit-line-clamp:3;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">' + esc(q.stem) + '</div>' +
        '<div class="formgrid">' +
        '<label>التخصص<select class="inp" data-c="spec">' + opt('', '—', st.spec) + UB.tx.specs.map((x) => opt(x.id, x.en + ' — ' + x.ar, st.spec)).join('') + '</select></label>' +
        '<label>الموضوع<select class="inp" data-c="topic">' + opt('', '—', st.topic) + (sp ? sp.topics.map((x) => opt(x.id, x.en, st.topic)).join('') : '') + '</select></label>' +
        '<label>الموضوع الفرعي<select class="inp" data-c="sub">' + opt('', '—', st.sub) + (tp ? tp.subs.map((x) => opt(x.id, x.en, st.sub)).join('') : '') + '</select></label>' +
        '<label>الجنس<select class="inp" data-c="sex">' + UB.FAC.sex.v.map(([v, l]) => opt(v, l, st.sex)).join('') + '</select></label>' +
        '<label>العمر بالسنوات (0.5 = 6 أشهر)<input class="inp" type="number" step="0.1" inputmode="decimal" data-i="age" value="' + esc(st.age) + '"></label>' +
        '<label>ملاحظة عن خطأ في السؤال (اختياري)<input class="inp" data-i="issue" value="' + esc(st.issue) + '" placeholder="مثلًا: الإجابة في الكتاب C"></label>' +
        '</div>' +
        ui.switchRow('rev', '✓ التصنيف صحيح (تمت المراجعة)', 'يزيل السؤال من قائمة "بحاجة لمراجعة"', st.rev) +
        '<div class="acts">' + (inf.ov ? '<button class="btn dg" data-a="reset" style="margin-inline-end:auto">إرجاع بيانات الكتاب</button>' : '') + '<button class="btn g" data-a="close">إلغاء</button><button class="btn p" data-a="save">حفظ</button></div>';
    };
    ui.sheet({
      html: html(),
      onChange: (k, el, ev, h) => {
        st[k] = el.value;
        if (k === 'spec') { st.topic = ''; st.sub = ''; }
        if (k === 'topic') st.sub = '';
        h.update(html());
      },
      onInput: (k, el) => { st[k] = el.value; },
      onAct: (a, el, e, h) => {
        if (a === 'sw') { st.rev = !st.rev; h.update(html()); return; }
        if (a === 'reset') { S.setOverride(q.id, null); h.close(); ui.toast('أُرجعت بيانات الكتاب'); if (done) done(); return; }
        if (a === 'save') {
          const o = {};
          const base = q.c;
          const cls = st.sub || st.topic || st.spec;
          if (cls && cls !== (base.sub || base.topic || base.spec)) { o.spec = st.spec; o.topic = st.topic; o.sub = st.sub; }
          if (st.sex !== (base.sex || 'none')) o.sex = st.sex;
          const ageV = st.age === '' ? null : +st.age;
          if (ageV !== (base.age != null ? base.age : null)) o.age = ageV === null ? null : ageV;
          if (st.issue) o.issue = st.issue;
          if (o.age === null) o.age = 'none';
          S.setOverride(q.id, o);
          S.setReviewed(q.id, st.rev);
          q._eff = null;
          h.close();
          ui.toast('حُفظ التعديل');
          if (done) done();
        }
      },
    });
  };

  /* ---------- image viewer (pinch / drag / double-tap) ---------- */
  UB.viewImage = function (src, cap) {
