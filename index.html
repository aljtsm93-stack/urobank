    const el = document.createElement('div');
    el.className = 'imgv';
    el.innerHTML = '<div class="bar2"><span>' + esc(cap || '') + '</span><div class="row"><button class="ib" data-z="-">−</button><button class="ib" data-z="+">+</button><button class="ib" data-z="x" aria-label="إغلاق">' + ui.icon('close') + '</button></div></div><img src="' + esc(src) + '" alt="">';
    document.body.appendChild(el);
    const img = el.querySelector('img');
    let sc = 1, tx = 0, ty = 0;
    const apply = () => (img.style.transform = 'translate(calc(-50% + ' + tx + 'px), calc(-50% + ' + ty + 'px)) scale(' + sc + ')');
    apply();
    const pts = new Map();
    let start = null;
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      el.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      start = { sc, tx, ty, pts: new Map(pts) };
    });
    el.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId) || !start) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const cur = [...pts.values()], st0 = [...start.pts.values()];
      if (cur.length >= 2 && st0.length >= 2) {
        const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        sc = U.clamp(start.sc * (d(cur[0], cur[1]) / Math.max(1, d(st0[0], st0[1]))), 1, 6);
      } else if (cur.length === 1 && st0.length === 1) {
        tx = start.tx + (cur[0].x - st0[0].x);
        ty = start.ty + (cur[0].y - st0[0].y);
      }
      apply();
    });
    const up = (e) => { pts.delete(e.pointerId); start = pts.size ? { sc, tx, ty, pts: new Map(pts) } : null; if (sc <= 1.01) { tx = 0; ty = 0; sc = 1; apply(); } };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    let lastTap = 0;
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-z]');
      if (b) {
        if (b.dataset.z === 'x') { el.remove(); return; }
        sc = U.clamp(sc * (b.dataset.z === '+' ? 1.4 : 1 / 1.4), 1, 6);
        if (sc === 1) { tx = 0; ty = 0; }
        apply();
        return;
      }
      const now = Date.now();
      if (now - lastTap < 320) { sc = sc > 1 ? 1 : 2.4; tx = 0; ty = 0; apply(); }
      lastTap = now;
    });
    el.addEventListener('wheel', (e) => { e.preventDefault(); sc = U.clamp(sc * (e.deltaY < 0 ? 1.1 : 0.9), 1, 6); apply(); }, { passive: false });
    const onKey = (e) => { if (e.key === 'Escape') { el.remove(); document.removeEventListener('keydown', onKey, true); e.stopPropagation(); } };
    document.addEventListener('keydown', onKey, true);
  };

  document.addEventListener('visibilitychange', () => {
    if (UB.ui.cur !== 'study') return;
    const s = SE.cur();
    if (!s || !SE.live(s)) return;
    if (document.hidden) { SE.leaveQ(s); SE.pause(s); SE.save(s); S.flushLocal(); }
    else { SE.resume(s); ui.st.qStart = Date.now(); }
  });
})();

</script><script>
/* UroBank — home dashboard + results */
(function () {
  'use strict';
  const UB = window.UB;
  const U = UB.U, S = UB.S, B = UB.B, F = UB.F, ui = UB.ui, SE = UB.SE, V = UB.V;
  const esc = U.esc;

  /* aggregate helpers shared by several views */
  UB.agg = function () {
    if (UB._agg && UB._agg.v === S.ver + ':' + B.ver) return UB._agg;
    const spec = {}, sub = {};
    let total = 0, answered = 0, att = 0, okAtt = 0, active = 0, starred = 0, tSum = 0, reviewN = 0;
    const days = new Set();
    let today = 0;
    const t0 = U.dayStart();
    for (const q of B.list) {
      if (!B.usable(q)) continue;
      total++;
      const e = B.eff(q);
      const i = S.info(q.id);
      const sp = e.spec || 'x';
      const so = spec[sp] || (spec[sp] = { n: 0, ans: 0, att: 0, ok: 0 });
      so.n++;
      const key = e.sub || e.topic || sp;
      const su = sub[key] || (sub[key] = { n: 0, ans: 0, att: 0, ok: 0, qids: [] });
      su.n++;
      su.qids.push(q.id);
      if (B.status(q) === 'review') reviewN++;
      if (i.star) starred++;
      if (i.active) active++;
      if (!i.n) continue;
      answered++; so.ans++; su.ans++;
      for (const x of i.attempts) {
        att++; so.att++; su.att++;
        if (x[2] === 1) { okAtt++; so.ok++; su.ok++; }
        tSum += +x[3] || 0;
        const ms = x[0] * 1000;
        days.add(U.dayKey(ms));
        if (ms >= t0) today++;
      }
    }
    let streak = 0;
    let d = Date.now();
    if (!days.has(U.dayKey(d))) d -= 864e5;
    while (days.has(U.dayKey(d))) { streak++; d -= 864e5; }
    UB._agg = { v: S.ver + ':' + B.ver, spec, sub, total, answered, att, okAtt, acc: att ? U.pct(okAtt, att) : null, active, starred, tAvg: att ? tSum / att : 0, today, streak, reviewN };
    return UB._agg;
  };
  UB.weak = function (min = 2, n = 5) {
    const a = UB.agg();
    return Object.entries(a.sub).filter(([, v]) => v.att >= min).map(([id, v]) => ({ id, acc: U.pct(v.ok, v.att), att: v.att, n: v.n, qids: v.qids }))
      .sort((x, y) => x.acc - y.acc || y.att - x.att).slice(0, n);
  };
  UB.loadFilter = function (f) { ui.st.f = F.norm(f); try { localStorage.setItem('ub1:fdraft', JSON.stringify(ui.st.f)); } catch (e) {} ui.go('filter'); };

  function presetCard(p, builtin) {
    const f = F.norm(p.f);
    const n = F.count(f);
    const desc = builtin ? p.desc : F.describe(f).map((d) => d.label).join(' · ') || 'كل الأسئلة';
    return '<div class="pc"><b>' + esc(p.name) + '</b><div class="d">' + esc(desc) + '</div><div class="f"><span>' + U.nQ(n) + '</span>' +
      '<div class="row" style="gap:6px"><button class="btn g sm" data-a="pedit" data-id="' + esc(p.id) + '" style="height:34px;padding:0 10px">فلترة</button>' +
      '<button class="play" data-a="pplay" data-id="' + esc(p.id) + '" aria-label="ابدأ"' + (n ? '' : ' disabled style="opacity:.4"') + '>▶</button></div></div></div>';
  }

  V.home = {
    render() {
      if (!B.loaded) return '<div class="view"><div class="loading">جارٍ تحميل بنك الأسئلة…</div></div>';
      const a = UB.agg();
      const plan = S.plan();
      const h = new Date().getHours();
      const greet = h >= 4 && h < 12 ? 'صباح الخير' : 'مساء الخير';
      let countdown = '';
      if (plan.exam) {
        const dl = U.daysBetween(Date.now(), U.parseDay(plan.exam));
        countdown = dl > 0 ? ' · باقي على الامتحان ' + U.nDays(dl) : dl === 0 ? ' · الامتحان اليوم — بالتوفيق!' : '';
      }
      const srcs = B.srcList();
      const onlyDemo = srcs.length && srcs.every((s) => s.demo);
      const banners = [];
      if (onlyDemo) banners.push('<div class="banner info"><span style="font-size:20px">🧪</span><div class="grow">الأسئلة الحالية <b>تجريبية</b> كتبتها لتجربة البرنامج، وليست من AUA أو Campbell أو FRCS. أرسل كتبك في المحادثة لتحويلها إلى بنك أسئلة، ثم تختفي هذه الأسئلة من الإعدادات.</div><button class="btn s sm" data-a="go" data-v="library">المصادر</button></div>');
      const bk = S.docs.backup;
      if (UB.PWA) {
        // standalone app: data lives on the device; nudge towards the automatic GitHub copy or an iCloud file
        const gh = UB.GH && UB.GH.cfg;
        if (gh && UB.GH.state === 'error') banners.push('<div class="banner"><span style="font-size:20px">☁</span><div class="grow">تعذّر النسخ التلقائي إلى GitHub: ' + esc(UB.GH.err || '') + '</div><button class="btn s sm" data-a="go" data-v="prefs">الإعدادات</button></div>');
        else if (!gh && a.att >= 20 && Date.now() - (bk.lastExport || 0) > 7 * 864e5) banners.push('<div class="banner"><span style="font-size:20px">💾</span><div class="grow">إجاباتك محفوظة على هذا الجهاز فقط، وتُحذف إذا حُذف التطبيق. فعّل النسخ التلقائي إلى GitHub، أو احفظ ملفًا في iCloud.</div><button class="btn g sm" data-a="go" data-v="prefs">النسخ التلقائي</button><button class="btn s sm" data-a="export">حفظ ملف</button></div>');
      } else if (a.att >= 20 && Date.now() - (bk.lastExport || 0) > 7 * 864e5) banners.push('<div class="banner"><span style="font-size:20px">💾</span><div class="grow">' + (bk.lastExport ? 'مرّ أسبوع بلا نسخة احتياطية في ملفاتك.' : 'لم تحفظ بعد نسخة احتياطية في ملفاتك.') + ' إجاباتك محفوظة في حسابك' + (S.mode === 'cloud' ? '' : ' (على هذا الجهاز فقط حاليًا)') + '، ونسخة إضافية في iCloud تزيد الأمان.</div><button class="btn s sm" data-a="export">حفظ نسخة الآن</button></div>');
      if (B.errors.length) {
        banners.push(UB.PWA
          ? '<div class="banner"><span>📚</span><div class="grow">كتب غير موجودة على هذا الجهاز: ' + esc(B.errors.join('، ')) + ' — استورد ملفاتها من «المصادر».</div><button class="btn s sm" data-a="go" data-v="library">المصادر</button></div>'
          : '<div class="banner"><span>⚠️</span><div class="grow">تعذّر تحميل بعض المصادر: ' + esc(B.errors.join('، ')) + '</div></div>');
      }
      const sess = S.session();
      const sessCard = sess ? (() => {
        const q0 = B.byId[sess.qids[sess.i]];
        const sp = q0 ? B.eff(q0).spec : null;
        const ans = sess.qids.filter((id) => sess.ans[id]).length;
        return '<div class="card planc">' + ui.dot(sp, 44) + '<div class="grow"><b style="font-size:15.5px">أكمل من حيث توقفت</b><div class="note">' + esc(sess.title || (sess.kind === 'exam' ? 'امتحان' : 'جلسة تدريب')) + ' · السؤال ' + (sess.i + 1) + ' من ' + sess.qids.length + ' · أجبت ' + ans + ' · ' + U.rel(sess.created) + '</div></div>' +
          '<button class="btn g sm" data-a="drop">إنهاء</button><button class="btn s sm" data-a="resume">متابعة ›</button></div>';
      })() : '';
      // plan card
      const pl = UB.planToday ? UB.planToday() : null;
      const planCard = pl ? '<button class="card planc" data-a="go" data-v="plan" style="width:100%;text-align:start"><div class="ring">' + ui.ring(pl.goal ? U.pct(pl.doneNew + pl.doneRev, pl.goal + pl.due) : 0) + '<b>' + (pl.doneNew + pl.doneRev) + '</b></div>' +
        '<div class="grow"><b style="font-size:15.5px">خطة اليوم</b><div class="note">' + (plan.exam ? 'هدف اليوم: ' + U.nQ(pl.goal) + ' جديدة + ' + U.nQ(pl.due) + ' للمراجعة' : 'حدد تاريخ امتحانك ليقسّم البرنامج الأسئلة على الأيام') + '</div></div><span class="btn p sm">' + (plan.exam ? 'ابدأ ›' : 'إعداد ›') + '</span></button>' : '';
      // presets
      const saved = S.saved();
      const presets = saved.map((p) => presetCard(p, false)).join('') + F.PRESETS.map((p) => presetCard(p, true)).join('');
      // specialties
      const specRows = UB.tx.specs.filter((sp) => a.spec[sp.id]).map((sp) => {
        const o = a.spec[sp.id];
        const acc = o.att ? U.pct(o.ok, o.att) : null;
        const [col, lab, ic] = ui.accStatus(acc);
        return '<button class="cat" data-a="spec" data-v="' + sp.id + '">' + ui.dot(sp.id) + '<div class="t"><b>' + esc(sp.en) + '</b>' + ui.bar(U.pct(o.ans, o.n)) + '</div>' +
          '<div class="pv">' + (acc == null ? '—' : '<span class="st-ic" style="color:' + col + '">' + ic + '</span>' + acc + '%') + '<small>' + o.ans + '/' + o.n + '</small></div></button>';
      }).join('');
      const weak = UB.weak(2, 4);
      const weakHtml = weak.length ? weak.map((w) => {
        const [col, lab, ic] = ui.accStatus(w.acc);
        return '<div class="meter"><div class="nm">' + esc(UB.tx.name(w.id)) + '</div>' + ui.bar(w.acc, col) + '<div class="v"><span class="st-ic" style="color:' + col + '">' + ic + '</span>' + w.acc + '% <small>' + lab + '</small></div></div>';
      }).join('') + '<button class="btn p w" style="margin-top:10px;height:44px" data-a="weak">↻ امتحان من نقاط ضعفي</button>'
        : '<div class="note" style="padding:6px 2px">تظهر نقاط ضعفك هنا بعد أن تحل بعض الأسئلة (محاولتان على الأقل في الموضوع).</div>';
      return '<div class="view">' + banners.join('') +
        '<div class="vtop"><div><div class="sub">' + greet + ' 👋' + countdown + '</div><h1>لوحة الدراسة</h1></div>' +
        '<div class="row"><button class="ib" data-a="go" data-v="bank" aria-label="بحث">' + ui.icon('search') + '</button><button class="btn p" data-a="board">⏱ محاكاة البورد العراقي</button></div></div>' +
        '<div class="hgrid"><div class="hcol">' +
        '<div class="hero"><div class="ring" style="width:100px;height:100px">' + ui.ring(U.pct(a.answered, a.total), '#F3C27A', 'rgba(255,255,255,.22)') + '<b style="font-size:19px;color:#fff">' + U.pct(a.answered, a.total) + '%</b></div>' +
        '<div class="grow"><div class="hl">نسبة الإنجاز</div><div class="hv">' + U.num(a.answered) + ' <small>/ ' + U.num(a.total) + '</small></div><div class="hs">سؤال تمت الإجابة عليه' + (a.streak ? ' · 🔥 سلسلة ' + U.nDays(a.streak) : '') + ' · اليوم ' + a.today + '</div></div></div>' +
        '<div class="stats">' +
        '<div class="stat"><b>' + (a.acc == null ? '—' : a.acc + '%') + '</b><span>نسبة الصحيح</span></div>' +
        '<button class="stat" data-a="go" data-v="mistakes"><b style="color:var(--bad)">' + a.active + '</b><span>أخطاء للمراجعة</span></button>' +
        '<button class="stat" data-a="go" data-v="starred"><b>' + a.starred + '</b><span>محفوظة ⭐</span></button>' +
        '<div class="stat"><b>' + (a.att ? Math.round(a.tAvg) + '<span style="font-size:14px">s</span>' : '—') + '</b><span>متوسط وقت السؤال</span></div></div>' +
        sessCard + planCard +
        '<div><div class="sec"><h3>ابدأ بلمسة</h3><button class="lnk" data-a="go" data-v="filter">+ فلتر جديد</button></div><div class="pgrid">' + presets + '</div></div>' +
        '</div><div class="hcol">' +
        '<div class="card"><div class="sec" style="padding:14px 16px 4px;margin:0"><h3>التخصصات</h3><span class="note">الشريط: الإنجاز · الرقم: نسبة الصحيح</span></div>' + specRows + '</div>' +
        '<div class="card pad"><div class="sec"><h3>نقاط الضعف</h3><button class="lnk" data-a="go" data-v="stats">الإحصائيات ›</button></div>' + weakHtml + '</div>' +
        (a.reviewN ? '<button class="card planc" data-a="go" data-v="needs-review" style="width:100%;text-align:start"><span style="font-size:26px">🔎</span><div class="grow"><b>بحاجة لمراجعة التصنيف</b><div class="note">' + U.nQ(a.reviewN) + ' تصنيفها غير مؤكد — راجعها بلمسة</div></div><span class="btn g sm">مراجعة ›</span></button>' : '') +
        '</div></div></div>';
    },
    act(a, el) {
      switch (a) {
        case 'go': ui.go(el.dataset.v); return;
        case 'board': UB.startBoard(); return;
        case 'resume': ui.params = {}; ui.go('study'); return;
        case 'drop': {
          ui.confirm({ title: 'إنهاء الجلسة المفتوحة؟', text: 'إجاباتك التي أجبتها محفوظة في سجلك. الجلسة نفسها ستُغلق.', ok: 'إنهاء الجلسة' }).then((ok) => {
            if (!ok) return;
            const s = S.session();
            if (s && SE.isExam(s)) { const r = SE.submit(s); ui.go('results', { id: r.id }); }
            else if (s) { const r = SE.finish(s); if (r.answered) ui.go('results', { id: r.id }); else ui.refresh(); }
          });
          return;
        }
        case 'pplay': UB.openPreset(el.dataset.id); return;
        case 'pedit': { const p = UB.presetById(el.dataset.id); if (p) UB.loadFilter(p.f); return; }
        case 'spec': UB.loadFilter({ inc: { tax: [el.dataset.v] } }); return;
        case 'weak': {
          const w = UB.weak(2, 3);
          const ids = new Set();
          w.forEach((x) => x.qids.forEach((id) => ids.add(id)));
          const list = F.sort([...ids].map((id) => B.byId[id]).filter(Boolean), 'hard');
          UB.startSheet({ qids: list.map((q) => q.id), title: 'نقاط ضعفي: ' + w.map((x) => UB.tx.name(x.id)).join('، '), kind: 'review' });
          return;
        }
        case 'export': UB.doExport(); return;
      }
    },
  };

  /* ---------- results ---------- */
  V.results = {
    render(p) {
      const r = (p && p.id && S.examById(p.id)) || S.exams()[0];
      if (!r) return '<div class="view"><div class="empty"><div class="big">📋</div>لا توجد نتائج بعد.<br><br><button class="btn p" data-a="home">الرئيسية</button></div></div>';
      ui.st.resId = r.id;
      const pct = U.pct(r.ok, r.n);
      const [col, lab] = ui.accStatus(pct);
      const exam = r.kind === 'exam';
      const specRows = Object.entries(r.bySpec || {}).filter(([, v]) => v[0]).sort((a, b) => U.pct(a[1][1], a[1][0]) - U.pct(b[1][1], b[1][0])).map(([sp, v]) => {
        const acc = U.pct(v[1], v[0]);
        const [c2, l2, ic] = ui.accStatus(acc);
        return '<div class="meter"><div class="nm">' + esc(UB.tx.name(sp) || '—') + '</div>' + ui.bar(acc, c2) + '<div class="v"><span class="st-ic" style="color:' + c2 + '">' + ic + '</span>' + v[1] + '/' + v[0] + ' <small>' + acc + '%</small></div></div>';
      }).join('');
      const rows = (r.qids || []).map((id, i) => {
        const q = B.byId[id];
        if (!q) return '';
        const k = r.ans ? r.ans[id] : undefined;
        const st = k === undefined ? '<span class="mini">— بلا إجابة</span>' : k === q.ans ? '<span class="mini ok">✓ صحيح</span>' : '<span class="mini bad">✕ خطأ</span>';
        return '<button class="list-row" data-a="rev" data-i="' + i + '"><span class="ens" style="font-weight:700;min-width:28px">' + (i + 1) + '</span><div class="grow"><div class="qs en">' + esc(q.stem) + '</div><div class="m">' + st + '<span class="mini pri">' + esc(B.srcLabel(q)) + '</span></div></div></button>';
      }).join('');
      const wrongN = (r.qids || []).filter((id) => B.byId[id] && r.ans && r.ans[id] !== undefined && r.ans[id] !== B.byId[id].ans).length;
      return '<div class="view"><div class="vtop"><div><div class="sub">' + esc(r.title || '') + ' · ' + U.date(r.at, true) + ' ' + U.time(r.at) + '</div><h1>' + (exam ? 'نتيجة الامتحان' : 'نتيجة الجلسة') + '</h1></div>' +
        '<div class="row"><button class="btn g" data-a="home">الرئيسية</button>' + (rows ? '<button class="btn s" data-a="rev" data-i="0">راجع الأسئلة</button>' : '') + (wrongN ? '<button class="btn p" data-a="retry">↻ تدرّب على أخطائها (' + wrongN + ')</button>' : '') + '</div></div>' +
        '<div class="cgrid"><div class="card pad"><div class="res-top"><div class="bigring">' + ui.ring(pct, col) + '<b>' + pct + '%</b></div><div>' +
        '<div style="font-size:22px;font-weight:700">' + r.ok + ' من ' + r.n + ' صحيحة</div>' +
        '<div class="muted" style="margin-top:4px">' + lab + (exam && r.total - r.answered > 0 ? ' · ' + U.nQ(r.total - r.answered) + ' بلا إجابة' : '') + '</div>' +
        '<div class="muted">الوقت: ' + U.dur(r.sec) + (r.answered ? ' · متوسط السؤال ' + U.dur(r.sec / Math.max(1, r.answered)) : '') + '</div>' +
        '<div class="note" style="margin-top:8px">الأخطاء أُضيفت لقائمة المراجعة تلقائيًا.</div></div></div></div>' +
        '<div class="card pad"><div class="sec"><h3>حسب التخصص</h3><span class="note">الأضعف أولًا</span></div>' + (specRows || '<div class="note">—</div>') + '</div></div>' +
        (rows ? '<div class="card" style="margin-top:16px"><div class="sec" style="padding:14px 16px 4px;margin:0"><h3>الأسئلة</h3><span class="note">المس أي سؤال لمراجعته مع الشرح</span></div>' + rows + '</div>' : '') + '</div>';
    },
    act(a, el) {
      const r = S.examById(ui.st.resId);
      if (a === 'home') { ui.go('home'); return; }
      if (!r) return;
      if (a === 'rev') {
        const s = SE.reviewOf(r, +el.dataset.i || 0);
        if (!s.qids.length) { ui.st.rsess = null; ui.toast('أسئلة هذه الجلسة لم تعد موجودة في المصادر الحالية', 'bad'); return; }
        ui.params = { review: 1 }; location.hash = 'study'; if (ui.cur === 'study') ui.show();
        return;
      }
      if (a === 'retry') {
        const ids = (r.qids || []).filter((id) => B.byId[id] && r.ans && r.ans[id] !== undefined && r.ans[id] !== B.byId[id].ans);
        UB.startList(ids, 'أخطاء: ' + (r.title || 'الجلسة'), 'review');
      }
    },
  };
})();

</script><script>
/* UroBank — full filter screen */
(function () {
  'use strict';
  const UB = window.UB;
  const U = UB.U, S = UB.S, B = UB.B, F = UB.F, ui = UB.ui, V = UB.V;
  const esc = U.esc;
  const tx = UB.tx;

  function cur() {
    if (!ui.st.f) {
      let d = null;
      try { d = JSON.parse(localStorage.getItem('ub1:fdraft') || 'null'); } catch (e) { d = null; }
      ui.st.f = F.norm(d);
    }
    return ui.st.f;
  }
  const saveDraft = () => { try { localStorage.setItem('ub1:fdraft', JSON.stringify(ui.st.f)); } catch (e) {} };
  const fx = () => ui.st.fx || (ui.st.fx = new Set());

  function chipFor(f, counts, fac, v, label, allowExc = true) {
    const st = F.state(f, fac, v);
    const n = counts[fac] ? counts[fac].get(v) || 0 : null;
    const cls = (st || '') + (n === 0 && !st ? ' zero' : '');
    return ui.chip('data-a="chip" data-f="' + fac + '" data-v="' + esc(v) + '"' + (allowExc ? '' : ' data-noexc="1"'), esc(label), cls, n);
  }
  const facChips = (f, counts, fac, allowExc = true) => '<div class="chips">' + UB.FAC[fac].v.map(([v, l]) => chipFor(f, counts, fac, v, l, allowExc)).join('') + '</div>';
  function headCount(f, facs) {
    const d = F.describe(f).filter((x) => facs.includes(x.fac));
    return d.length ? '<span class="cnt">' + esc(d.map((x) => (x.kind === 'exc' ? '− ' : '') + x.label).join(' · ')) + '</span>' : '';
  }
  function num(key, val, cls, ph) {
    return '<input type="number" inputmode="numeric" class="' + (cls || '') + '" data-i="num" data-k="' + key + '" data-key="n-' + key + '" value="' + (val == null ? '' : esc(val)) + '" placeholder="' + (ph || '—') + '">';
  }
  const has = (x) => x !== null && x !== undefined && x !== '';

  function groupSource(f, counts) {
    const srcs = B.srcList();
    let html = '<div class="lbl">الكتاب</div><div class="chips">' + srcs.map((s) => chipFor(f, counts, 'src', s.id, s.name)).join('') + '</div>';
    const incSrc = f.inc.src || [];
    for (const s of srcs) {
      if (incSrc.length && !incSrc.includes(s.id)) continue;
      if ((f.exc.src || []).includes(s.id)) continue;
      if (s.kind === 'year') {
        const ys = B.years(s.id);
        if (!ys.length) continue;
        const r = (f.yr && f.yr[s.id]) || [null, null];
        const opt = (v, curv) => '<option value="' + v + '"' + (String(v) === String(curv) ? ' selected' : '') + '>' + v + '</option>';
        html += '<div class="lbl">سنوات ' + esc(s.name) + '</div><div class="row">' +
          '<span class="note">من</span><select class="inp" data-c="yr" data-s="' + esc(s.id) + '" data-p="0"><option value="">الكل</option>' + ys.map((y) => opt(y, r[0])).join('') + '</select>' +
          '<span class="note">إلى</span><select class="inp" data-c="yr" data-s="' + esc(s.id) + '" data-p="1"><option value="">الكل</option>' + ys.map((y) => opt(y, r[1])).join('') + '</select>' +
          (has(r[0]) || has(r[1]) ? '<button class="chip" data-a="yrclear" data-s="' + esc(s.id) + '">كل السنوات</button>' : '') + '</div>';
      } else if (s.kind === 'chapter') {
        const chs = B.chapters(s.id);
        if (!chs.length) continue;
        const sel = new Set((f.chs && f.chs[s.id]) || []);
        html += '<div class="lbl">فصول ' + esc(s.name) + (sel.size ? ' · ' + sel.size + ' مختارة' : ' · الكل') + '</div><div class="chips">' +
          chs.map(([n, t]) => ui.chip('data-a="ch" data-s="' + esc(s.id) + '" data-v="' + n + '"', '<span class="ens">Ch.' + n + '</span> ' + esc(t), sel.has(n) ? 'inc' : '')).join('') + '</div>';
      }
    }
    return '<div class="fg"><h4><span class="l">أ</span>المصدر والسنة' + headCount(f, ['src', 'yr', 'chs']) + '</h4>' + html + '</div>';
  }

  function groupLength(f, counts) {
    const quick = [5, 10, 20, 30, 50];
    return '<div class="fg"><h4><span class="l">ب</span>الطول' + headCount(f, ['w', 'wa', 'explLen']) + '</h4>' +
      '<div class="lbl">عدد كلمات السؤال · اكتب أي رقم</div>' +
      '<div class="row"><div class="stepper"><span class="st">حتى</span><button class="sb" data-a="wstep" data-d="-1" aria-label="أقل">−</button>' + num('wMax', f.wMax) +
      '<button class="sb" data-a="wstep" data-d="1" aria-label="أكثر">+</button><span class="st">كلمة</span></div>' +
      '<div class="chips">' + quick.map((n) => ui.chip('data-a="wq" data-v="' + n + '"', String(n), +f.wMax === n && !has(f.wMin) ? 'inc' : '')).join('') + ui.chip('data-a="wq" data-v=""', 'الكل', !has(f.wMax) && !has(f.wMin) ? 'inc' : '') + '</div></div>' +
      '<div class="fg2" style="margin-top:6px"><div><div class="lbl">حد أدنى (اختياري)</div><div class="stepper"><span class="st">من</span>' + num('wMin', f.wMin, 'thin') + '<span class="st">كلمة</span></div></div>' +
      '<div><div class="lbl">السؤال مع الاختيارات</div><div class="stepper"><span class="st">حتى</span>' + num('waMax', f.waMax, 'thin') + '<span class="st">كلمة</span></div></div></div>' +
      '<div class="lbl">طول الشرح</div>' + facChips(f, counts, 'explLen') + '</div>';
  }

  function groupTopic(f, counts) {
    const tc = counts.tax;
    const show = (id) => fx().has(id) || ui.st.fxAll || F.state(f, 'tax', id) || [...(f.inc.tax || []), ...(f.exc.tax || [])].some((x) => x !== id && x.startsWith(id + '.'));
    const tchip = (node, label) => {
      const st = F.state(f, 'tax', node.id);
      const n = tc.get(node.id) || 0;
      if (!n && !st) return '';
      return ui.chip('data-a="tax" data-v="' + node.id + '"', esc(label), (st || '') + (n === 0 && !st ? ' zero' : ''), n);
    };
    let rows = '';
    for (const sp of tx.specs) {
      if (!show(sp.id)) continue;
      const topics = sp.topics.map((t) => tchip(t, t.en)).join('');
      if (topics) rows += '<div class="taxrow"><div class="tt">' + esc(sp.en) + ' ›</div><div class="chips en" style="direction:ltr">' + topics + '</div></div>';
      for (const t of sp.topics) {
        if (!show(t.id)) continue;
        const subs = t.subs.map((x) => tchip(x, x.en)).join('');
        if (subs) rows += '<div class="taxrow"><div class="tt">' + esc(sp.en) + ' › ' + esc(t.en) + ' ›</div><div class="chips en" style="direction:ltr">' + subs + '</div></div>';
      }
    }
    return '<div class="fg"><h4><span class="l">ج</span>الموضوع' + headCount(f, ['tax', 'organ', 'q']) + '</h4>' +
      '<div class="lbl">التخصص <span class="note">— لمسة: تضمين وفتح المواضيع · لمستان: استبعاد</span></div>' +
      '<div class="chips en" style="direction:ltr">' + tx.specs.map((sp) => tchip(sp, sp.en)).join('') +
      ui.chip('data-a="fxall"', ui.st.fxAll ? 'إخفاء كل المواضيع' : 'كل المواضيع ▾', 'more') + '</div>' + rows +
      '<div class="lbl">العضو</div>' + facChips(f, counts, 'organ') +
      '<div class="lbl">بحث بكلمة في السؤال أو الشرح</div><input class="inp" style="width:100%" data-i="q" data-key="q" value="' + esc(f.q || '') + '" placeholder="مثلًا: BCG أو Wilms" dir="auto"></div>';
  }

  function groupPatient(f, counts) {
    return '<div class="fg"><h4><span class="l">د</span>المريض' + headCount(f, ['sex', 'ag', 'age', 'special']) + '</h4>' +
      '<div class="fg2"><div><div class="lbl">الجنس</div>' + facChips(f, counts, 'sex') + '</div><div><div class="lbl">الفئة العمرية</div>' + facChips(f, counts, 'ag') + '</div></div>' +
      '<div class="fg2"><div><div class="lbl">العمر بالضبط (سنوات)</div><div class="stepper"><span class="st">من</span>' + num('aMin', f.aMin, 'thin') + '<span class="st">إلى</span>' + num('aMax', f.aMax, 'thin') + '</div></div>' +
      '<div><div class="lbl">حالات خاصة</div>' + facChips(f, counts, 'special') + '</div></div></div>';
  }

  function groupType(f, counts) {
    return '<div class="fg"><h4><span class="l">هـ</span>نوع السؤال' + headCount(f, ['qtype', 'fmt', 'img', 'mod', 'gl', 'hy']) + '</h4>' +
      '<div class="lbl">المطلوب في السؤال</div>' + facChips(f, counts, 'qtype') +
      '<div class="fg2"><div><div class="lbl">شكل السؤال</div>' + facChips(f, counts, 'fmt') + '</div><div><div class="lbl">الصور</div>' + facChips(f, counts, 'img', false) + '</div></div>' +
      '<div class="lbl">نوع الصورة</div>' + facChips(f, counts, 'mod') +
      '<div class="lbl">الإرشادات</div>' + facChips(f, counts, 'gl') +
      '<div style="margin-top:6px">' + ui.switchRow('hy', '⭐ High-yield فقط', 'مواضيع مهمة أو متكررة في أكثر من مصدر', f.hy) + '</div></div>';
  }

  function groupMine(f, counts) {
    return '<div class="fg"><h4><span class="l">و</span>حالتي' + headCount(f, ['status', 'wc', 'last', 'diff', 'reason', 'slow', 'nodup']) + '</h4>' +
      '<div class="lbl">الحالة</div>' + facChips(f, counts, 'status') +
      '<div class="fg2"><div><div class="lbl">عدد مرات الخطأ</div>' + facChips(f, counts, 'wc') + '</div><div><div class="lbl">آخر محاولة</div>' + facChips(f, counts, 'last') + '</div></div>' +
      '<div class="fg2"><div><div class="lbl">الصعوبة (حسب إجاباتي)</div>' + facChips(f, counts, 'diff') + '</div><div><div class="lbl">سبب الخطأ</div>' + facChips(f, counts, 'reason') + '</div></div>' +
      '<div style="margin-top:6px">' + ui.switchRow('slow', '🐢 الأسئلة التي أخذت مني وقتًا أطول', 'أبطأ من متوسط وقتك بمرة ونصف', f.slow) +
      ui.switchRow('nodup', 'إخفاء الأسئلة المكررة بين المصادر', 'يبقى سؤال واحد من كل مجموعة متشابهة', f.nodup) + '</div></div>';
  }

  V.filter = {
    render() {
      if (!B.loaded) return '<div class="view"><div class="loading">جارٍ التحميل…</div></div>';
      const f = cur();
      const counts = F.allCounts(f);
      const list = F.run(f);
      const total = B.list.filter((q) => B.usable(q)).length;
      if (!ui.st.seed) ui.st.seed = Math.floor(Math.random() * 1e9);
      const sorted = F.sort(list, f.sort || 'random', ui.st.seed);
      ui.st.flist = sorted;
      const desc = F.describe(f);
      const chips = desc.map((d, i) => '<button class="chip ' + (d.kind === 'exc' ? 'exc' : '') + '" data-a="rm" data-i="' + i + '"><span class="t">' + esc(d.label) + '</span><span class="x">✕</span></button>').join('');
      const preview = sorted.slice(0, 8).map((q, i) => ui.qRow(q, '', 'data-a="pq" data-i="' + i + '"')).join('');
      const sortSel = '<select class="inp" data-c="sort">' + F.SORTS.map(([v, l]) => '<option value="' + v + '"' + ((f.sort || 'random') === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>';
      const summary = desc.length ? desc.map((d) => (d.kind === 'exc' ? '− ' : '') + d.label).join(' · ') : 'كل الأسئلة';
      return '<div class="view">' +
        '<div class="vtop"><div><h1>الفلترة</h1><div class="sub">اجمع أي فلاتر معًا · لمسة = تضمين · لمستان = استبعاد · ثلاث = إلغاء</div></div>' +
        '<div class="row"><button class="btn g sm" data-a="reset">↺ مسح الكل</button><button class="btn g sm" data-a="mine">📂 فلاتري</button><button class="btn s sm" data-a="save">💾 حفظ الفلتر</button></div></div>' +
        '<div class="fwrap"><div class="fcol">' + groupSource(f, counts) + groupLength(f, counts) + groupTopic(f, counts) + groupPatient(f, counts) + groupType(f, counts) + groupMine(f, counts) + '</div>' +
        '<div class="rpanel"><div class="bigc"><div class="n ens">' + U.num(list.length) + '</div><div class="t">' + (list.length === 1 ? 'سؤال واحد يطابق' : 'سؤالًا يطابق الفلاتر') + ' · من أصل ' + U.num(total) + '</div>' +
        (chips ? '<div class="chips">' + chips + '</div>' : '') + '</div>' +
        '<div class="row startrow"><button class="btn s grow" data-a="start" data-v="practice"' + (list.length ? '' : ' disabled') + '>📖 تدريب</button><button class="btn p grow" data-a="start" data-v="exam"' + (list.length ? '' : ' disabled') + '>⏱ امتحان</button></div>' +
        '<div class="card prev"><h5>معاينة الأسئلة<span class="row" style="gap:6px"><span class="note">الترتيب:</span>' + sortSel + '</span></h5>' +
        (preview || '<div class="empty">لا توجد أسئلة مطابقة. جرّب إزالة بعض الفلاتر.</div>') +
        (sorted.length > 8 ? '<div class="note" style="padding:10px 16px">و' + U.nQ(sorted.length - 8) + ' أخرى…</div>' : '') + '</div></div></div>' +
        '<div class="fbar"><div class="grow"><div class="n ens">' + U.num(list.length) + '</div><div class="t">' + esc(summary) + '</div></div>' +
        '<button class="btn g2" data-a="start" data-v="practice"' + (list.length ? '' : ' disabled') + '>📖 تدريب</button><button class="btn w2" data-a="start" data-v="exam"' + (list.length ? '' : ' disabled') + '>⏱ امتحان</button></div>' +
        '</div>';
    },
    act(a, el) {
      const f = cur();
      switch (a) {
        case 'chip': F.toggle(f, el.dataset.f, el.dataset.v, !el.dataset.noexc); break;
        case 'tax': {
          const id = el.dataset.v;
          const before = F.state(f, 'tax', id);
          F.toggle(f, 'tax', id);
          const after = F.state(f, 'tax', id);
          const parents = tx.anc(id).slice(0, -1);
          if (after === 'inc') {
            f.inc.tax = (f.inc.tax || []).filter((x) => !parents.includes(x));
            if (tx.get(id).level !== 'sub') fx().add(id);
          } else if (after === 'exc' && before === 'inc' && parents.length) {
            const parent = parents[parents.length - 1];
            const any = (f.inc.tax || []).some((x) => x === parent || x.startsWith(parent + '.'));
            if (!any) f.inc.tax = (f.inc.tax || []).concat([parent]);
          } else if (after === null) fx().delete(id);
          if (f.inc.tax && !f.inc.tax.length) delete f.inc.tax;
          break;
        }
        case 'fxall': ui.st.fxAll = !ui.st.fxAll; break;
        case 'ch': {
          const s = el.dataset.s, v = +el.dataset.v;
          f.chs = f.chs || {};
          const set = new Set(f.chs[s] || []);
          if (set.has(v)) set.delete(v); else set.add(v);
          f.chs[s] = [...set].sort((x, y) => x - y);
          if (!f.chs[s].length) delete f.chs[s];
          break;
        }
        case 'yrclear': if (f.yr) delete f.yr[el.dataset.s]; break;
        case 'wstep': {
          const curv = has(f.wMax) ? +f.wMax : 20;
          const step = curv >= 20 ? 5 : 1;
          f.wMax = Math.max(1, curv + step * +el.dataset.d);
          break;
        }
        case 'wq': f.wMax = el.dataset.v === '' ? null : +el.dataset.v; f.wMin = null; break;
        case 'sw': f[el.dataset.k] = !f[el.dataset.k]; break;
        case 'rm': { const d = F.describe(f)[+el.dataset.i]; if (d) F.removeDesc(f, d); break; }
        case 'reset': ui.st.f = F.blank(); ui.st.fx = new Set(); ui.st.fxAll = false; saveDraft(); ui.refresh(); return;
        case 'save': return saveFilter(f);
        case 'mine': return mineSheet();
        case 'start': {
          const list = ui.st.flist || [];
          const d = F.describe(f).map((x) => x.label).join(' · ');
          UB.startSheet({ qids: list.map((q) => q.id), title: d || 'كل الأسئلة', kind: el.dataset.v === 'exam' ? 'exam' : 'practice', src: { label: d, f: U.clone(f) } });
          return;
        }
        case 'pq': {
          const list = ui.st.flist || [];
          UB.startList(list.map((q) => q.id), F.describe(f).map((x) => x.label).join(' · ') || 'كل الأسئلة', 'practice', +el.dataset.i);
          return;
        }
        default: return;
      }
      saveDraft();
      ui.refresh();
    },
    input(k, el) {
      const f = cur();
      if (k === 'num') {
        const v = el.value === '' ? null : Math.max(0, Math.round(+el.value));
        f[el.dataset.k] = v;
      } else if (k === 'q') f.q = el.value;
      saveDraft();
      clearTimeout(ui.st.ftimer);
      ui.st.ftimer = setTimeout(() => ui.refresh(), 350);
    },
    change(k, el) {
      const f = cur();
      if (k === 'yr') {
        f.yr = f.yr || {};
        const r = f.yr[el.dataset.s] || [null, null];
        r[+el.dataset.p] = el.value === '' ? null : +el.value;
        if (r[0] != null && r[1] != null && r[0] > r[1]) { const t = r[0]; r[0] = r[1]; r[1] = t; }
        if (r[0] == null && r[1] == null) delete f.yr[el.dataset.s]; else f.yr[el.dataset.s] = r;
      } else if (k === 'sort') { f.sort = el.value; ui.st.seed = Math.floor(Math.random() * 1e9); }
      saveDraft();
      ui.refresh();
    },
  };

  async function saveFilter(f) {
    if (F.isEmpty(f)) { ui.toast('اختر فلترًا واحدًا على الأقل قبل الحفظ', 'bad'); return; }
    const sugg = F.describe(f).slice(0, 3).map((d) => d.label).join(' ');
    const name = await ui.prompt({ title: '💾 حفظ الفلتر', label: 'اسم يظهر في الرئيسية والقائمة الجانبية', value: sugg, ok: 'حفظ' });
    if (!name || !name.trim()) return;
    S.saveFilter(name.trim(), F.norm(f));
    ui.toast('حُفظ الفلتر «' + name.trim() + '»', 'ok');
    ui.renderNav();
  }
  function mineSheet() {
    const html = () => {
      const saved = S.saved();
      const row = (p, builtin) => '<div class="list-row" style="align-items:center"><div class="grow"><b>' + esc(p.name) + '</b><div class="note">' + esc(builtin ? p.desc : F.describe(F.norm(p.f)).map((d) => d.label).join(' · ')) + ' · ' + U.nQ(F.count(F.norm(p.f))) + '</div></div>' +
        '<button class="btn g sm" data-a="apply" data-id="' + esc(p.id) + '">تطبيق</button>' +
        (builtin ? '' : '<button class="btn g sm" data-a="ren" data-id="' + esc(p.id) + '">إعادة تسمية</button><button class="btn dg sm" data-a="del" data-id="' + esc(p.id) + '">حذف</button>') + '</div>';
      return ui.sh('📂 فلاتري') + '<div class="card">' + (saved.length ? saved.map((p) => row(p, false)).join('') : '<div class="empty">لم تحفظ أي فلتر بعد. اختر فلاتر ثم اضغط "حفظ الفلتر".</div>') + '</div>' +
        '<div class="sec" style="margin-top:16px"><h3>فلاتر جاهزة</h3></div><div class="card">' + F.PRESETS.map((p) => row(p, true)).join('') + '</div>';
    };
    ui.sheet({
      html: html(),
      onAct: async (a, el, e, h) => {
        const id = el.dataset.id;
        if (a === 'apply') { const p = UB.presetById(id); if (p) { h.close(); ui.st.f = F.norm(p.f); saveDraft(); ui.refresh(); } }
        if (a === 'ren') {
          const p = S.saved().find((x) => x.id === id);
          const name = await ui.prompt({ title: 'إعادة تسمية', value: p ? p.name : '' });
          if (name && name.trim()) { S.updateFilter(id, { name: name.trim() }); h.update(html()); ui.renderNav(); }
        }
        if (a === 'del') {
          const ok = await ui.confirm({ title: 'حذف الفلتر؟', text: 'يُحذف الفلتر المحفوظ فقط، ولا تتأثر إجاباتك.', ok: 'حذف', danger: true });
          if (ok) { S.delFilter(id); h.update(html()); ui.renderNav(); }
        }
      },
    });
  }
})();

</script><script>
/* UroBank — list screens: mistakes, starred, question bank, topic summaries, needs-review */
(function () {
  'use strict';
  const UB = window.UB;
  const U = UB.U, S = UB.S, B = UB.B, F = UB.F, ui = UB.ui, V = UB.V;
  const esc = U.esc, tx = UB.tx;
  const usable = () => B.list.filter((q) => B.usable(q));
  const loading = '<div class="view"><div class="loading">جارٍ التحميل…</div></div>';

  /* ---------- mistakes ---------- */
  V.mistakes = {
    render() {
      if (!B.loaded) return loading;
      const st = ui.st.mk || (ui.st.mk = { tab: 'active' });
      const now = Date.now();
      const all = usable();
      const active = [], due = [], ever = [], rep = [];
      const buckets = { 1: 0, 2: 0, 3: 0 };
      const reasons = {};
      for (const q of all) {
        const i = S.info(q.id);
        if (!i.wrong) continue;
        ever.push(q);
        if (i.active) {
          active.push(q);
          buckets[Math.min(3, i.wrong)]++;
          for (const r of i.reasons) reasons[r] = (reasons[r] || 0) + 1;
        }
        if (i.due && i.due <= now) due.push(q);
        if (i.wrong >= 2 && i.active) rep.push(q);
      }
      const lists = { active, due, rep, ever };
      const list = F.sort(lists[st.tab] || active, 'hard');
      ui.st.mkList = list;
      const showAns = S.pref('showMistakeAns');
      const groups = {};
      list.forEach((q, idx) => { const sp = B.eff(q).spec || 'x'; (groups[sp] = groups[sp] || []).push([q, idx]); });
      const order = tx.specs.map((s) => s.id).concat(['x']);
      const groupHtml = order.filter((sp) => groups[sp]).map((sp) => {
        const rows = groups[sp].map(([q, idx]) => {
          const i = S.info(q.id);
          const lastWrong = i.attempts.filter((x) => x[2] !== 1).pop();
          const extra = '<div class="m"><span class="mini">' + U.rel(i.lastTs) + '</span>' +
            (i.active ? '<span class="mini">صحيح متتالٍ ' + i.streak + '/2</span>' : '<span class="mini ok">خرج من القائمة</span>') +
            (i.due && i.due > now && i.active ? '<span class="mini">المراجعة: ' + U.date(i.due) + '</span>' : i.due && i.due <= now ? '<span class="mini bad">مستحق الآن</span>' : '') +
            [...i.reasons].map((r) => '<span class="mini">' + esc(UB.facLabel('reason', r)) + '</span>').join('') + '</div>' +
            (showAns && lastWrong ? '<div class="note en" style="margin-top:6px"><span style="color:var(--bad)">✕ Your answer: ' + esc(B.optText(q, lastWrong[1])) + '</span><br><span style="color:var(--ok)">✓ Correct: ' + esc(B.optText(q, q.ans)) + '</span></div>' : '');
          return ui.qRow(q, extra, 'data-a="open" data-i="' + idx + '"');
        }).join('');
        const sp0 = tx.get(sp);
        return '<div class="card" style="margin-bottom:14px"><div class="sec" style="padding:12px 16px 2px;margin:0"><h3 class="ens" style="display:flex;gap:8px;align-items:center">' + ui.dot(sp, 26) + esc(sp0 ? sp0.en : 'Other') + '</h3><span class="note">' + U.nQ(groups[sp].length) + '</span></div>' + rows + '</div>';
      }).join('');
      const tabs = [['active', 'القائمة النشطة', active.length], ['due', 'مستحق اليوم', due.length], ['rep', 'أخطأت مرتين فأكثر', rep.length], ['ever', 'كل ما أخطأت فيه يومًا', ever.length]];
      const rsn = Object.keys(reasons).length ? '<div class="chips" style="margin-top:8px">' + UB.REASONS.filter(([k]) => reasons[k]).map(([k, l]) => '<button class="chip" data-a="reason" data-v="' + k + '">' + l + ' <span class="n">' + reasons[k] + '</span></button>').join('') + '</div>' : '<div class="note" style="margin-top:6px">حدد سبب الخطأ بعد كل إجابة خاطئة لترى هنا أين تكمن المشكلة.</div>';
      return '<div class="view"><div class="vtop"><div><h1>مراجعة الأخطاء</h1><div class="sub">يخرج السؤال من القائمة بعد إجابتين صحيحتين متتاليتين في جلستين مختلفتين · السجل لا يُمسح</div></div>' +
        '<div class="row"><button class="btn g sm" data-a="ans">' + (showAns ? '🙈 إخفاء إجاباتي' : '👁 إظهار إجاباتي') + '</button><button class="btn p" data-a="exam"' + (active.length ? '' : ' disabled') + '>↻ امتحان من أخطائي</button></div></div>' +
        '<div class="cgrid" style="margin-bottom:16px">' +
        '<div class="card pad"><div class="row" style="align-items:flex-end;gap:16px"><div><div class="ens" style="font-size:40px;font-weight:800;color:var(--bad);line-height:1">' + active.length + '</div><div class="muted">في قائمة الأخطاء</div></div>' +
        '<div class="grow"></div><button class="btn s sm" data-a="due"' + (due.length ? '' : ' disabled') + '>راجع المستحق اليوم (' + due.length + ')</button></div>' +
        '<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px">' +
        [1, 2, 3].map((k) => '<button class="stat" data-a="wc" data-v="' + k + '"><b>' + buckets[k] + '</b><span>' + (k === 1 ? 'أخطأت مرة' : k === 2 ? 'مرتين' : '3 مرات فأكثر') + '</span></button>').join('') + '</div></div>' +
        '<div class="card pad"><div class="sec"><h3>أسباب أخطائي</h3><span class="note">المس السبب لتتدرب عليه</span></div>' + rsn + '</div></div>' +
        '<div class="seg" style="margin-bottom:14px;max-width:760px">' + tabs.map(([k, l, n]) => '<button class="' + (st.tab === k ? 'on' : '') + '" data-a="tab" data-v="' + k + '">' + l + ' <span class="ens" style="opacity:.7">' + n + '</span></button>').join('') + '</div>' +
        (list.length ? groupHtml : '<div class="card empty"><div class="big">🎉</div>' + (st.tab === 'active' ? 'لا توجد أخطاء نشطة. أحسنت!' : 'لا توجد أسئلة هنا.') + '</div>') + '</div>';
    },
    act(a, el) {
      const st = ui.st.mk;
      if (a === 'tab') { st.tab = el.dataset.v; ui.refresh(); return; }
      if (a === 'ans') { S.setPref('showMistakeAns', !S.pref('showMistakeAns')); ui.refresh(); return; }
      const list = ui.st.mkList || [];
      if (a === 'open') { UB.startList(list.map((q) => q.id), 'مراجعة الأخطاء', 'review', +el.dataset.i); return; }
      if (a === 'exam') { UB.openPreset('p-wrong'); return; }
      if (a === 'due') { UB.openPreset('p-due'); return; }
      if (a === 'wc') {
        const v = el.dataset.v;
        const ids = usable().filter((q) => { const i = S.info(q.id); return i.active && Math.min(3, i.wrong) === +v; }).map((q) => q.id);
        UB.startSheet({ qids: ids, title: 'أخطأت ' + UB.facLabel('wc', v), kind: 'review' });
        return;
      }
      if (a === 'reason') {
        const r = el.dataset.v;
        const ids = F.sort(usable().filter((q) => { const i = S.info(q.id); return i.active && i.reasons.has(r); }), 'hard').map((q) => q.id);
        UB.startSheet({ qids: ids, title: 'أخطاء بسبب: ' + UB.facLabel('reason', r), kind: 'review' });
      }
    },
  };

  /* ---------- starred / noted / flagged ---------- */
  V.starred = {
    render() {
      if (!B.loaded) return loading;
      const st = ui.st.sr || (ui.st.sr = { tab: 'star' });
      const all = usable();
      const sets = { star: [], note: [], flag: [] };
      for (const q of all) {
        const i = S.info(q.id);
        if (i.star) sets.star.push(q);
        if (i.note) sets.note.push(q);
        if (i.flag) sets.flag.push(q);
      }
      const list = sets[st.tab].sort((a, b) => a.order.localeCompare(b.order));
      ui.st.srList = list;
      const rows = list.map((q, idx) => {
        const i = S.info(q.id);
        return ui.qRow(q, i.note ? '<div class="banner info" style="margin:8px 0 0;padding:8px 12px;font-size:13.5px">📝 ' + esc(i.note) + '</div>' : '', 'data-a="open" data-i="' + idx + '"');
      }).join('');
      const tabs = [['star', '⭐ المحفوظة', sets.star.length], ['note', '📝 عليها ملاحظة', sets.note.length], ['flag', '🚩 المعلَّمة', sets.flag.length]];
      return '<div class="view"><div class="vtop"><div><h1>المحفوظة</h1><div class="sub">الأسئلة التي حفظتها أو كتبت عليها ملاحظة أو علّمتها</div></div>' +
        '<button class="btn p" data-a="start"' + (list.length ? '' : ' disabled') + '>📖 تدرّب على هذه القائمة</button></div>' +
        '<div class="seg" style="margin-bottom:14px;max-width:620px">' + tabs.map(([k, l, n]) => '<button class="' + (st.tab === k ? 'on' : '') + '" data-a="tab" data-v="' + k + '">' + l + ' <span class="ens" style="opacity:.7">' + n + '</span></button>').join('') + '</div>' +
        '<div class="card">' + (rows || '<div class="empty"><div class="big">⭐</div>لا توجد أسئلة هنا بعد. أثناء الحل استخدم أزرار ⭐ و📝 و🚩 أسفل الشاشة.</div>') + '</div></div>';
    },
    act(a, el) {
      if (a === 'tab') { ui.st.sr.tab = el.dataset.v; ui.refresh(); return; }
      const list = ui.st.srList || [];
      const title = { star: 'المحفوظة', note: 'عليها ملاحظة', flag: 'المعلَّمة' }[ui.st.sr.tab];
      if (a === 'open') UB.startList(list.map((q) => q.id), title, 'practice', +el.dataset.i);
      if (a === 'start') UB.startSheet({ qids: list.map((q) => q.id), title, kind: 'practice' });
    },
  };

  /* ---------- tree helper ---------- */
  function treeHtml(counts, sel, open, act, extra) {
    let h = '';
    for (const sp of tx.specs) {
      const c = counts[sp.id];
      if (!c) continue;
      const isOpen = open.has(sp.id);
      h += '<button class="tn' + (sel === sp.id ? ' on' : '') + '" data-a="' + act + '" data-v="' + sp.id + '"><span class="car">' + (isOpen ? '▾' : '◂') + '</span>' + ui.dot(sp.id, 26) + '<span class="nm">' + esc(sp.en) + '</span><span class="ct">' + (extra ? extra(sp.id) : c) + '</span></button>';
      if (!isOpen) continue;
      for (const t of sp.topics) {
        const ct = counts[t.id];
        if (!ct) continue;
        const tOpen = open.has(t.id);
        h += '<button class="tn l2' + (sel === t.id ? ' on' : '') + '" data-a="' + act + '" data-v="' + t.id + '"><span class="car">' + (tOpen ? '▾' : '◂') + '</span><span class="nm">' + esc(t.en) + '</span><span class="ct">' + (extra ? extra(t.id) : ct) + '</span></button>';
        if (!tOpen) continue;
        for (const x of t.subs) {
          const cx = counts[x.id];
          if (!cx) continue;
          h += '<button class="tn l3' + (sel === x.id ? ' on' : '') + '" data-a="' + act + '" data-v="' + x.id + '"><span class="car"></span><span class="nm">' + esc(x.en) + '</span><span class="ct">' + (extra ? extra(x.id) : cx) + '</span></button>';
        }
      }
    }
    return h;
  }
  function taxCounts(list) {
    const c = {};
    for (const q of list) for (const id of B.eff(q).tax) c[id] = (c[id] || 0) + 1;
    return c;
  }
  function toggleOpen(set, id) {
    if (set.has(id)) { set.delete(id); for (const x of [...set]) if (x.startsWith(id + '.')) set.delete(x); }
    else { set.add(id); for (const a of tx.anc(id)) set.add(a); }
  }

  /* ---------- question bank ---------- */
  V.bank = {
    render() {
      if (!B.loaded) return loading;
      const st = ui.st.bk || (ui.st.bk = { sel: '', q: '', open: new Set(), lim: 60, src: '' });
      const all = usable();
      const counts = taxCounts(all);
      const qq = (st.q || '').trim().toLowerCase();
      let list = all.filter((q) => (!st.sel || B.eff(q).tax.includes(st.sel)) && (!st.src || q.src === st.src) && (!qq || B.searchText(q).includes(qq)));
      list = list.sort((a, b) => a.order.localeCompare(b.order));
      ui.st.bkList = list;
      const rows = list.slice(0, st.lim).map((q, idx) => ui.qRow(q, '', 'data-a="open" data-i="' + idx + '"')).join('');
      const label = st.sel ? tx.label(st.sel) : 'كل الأسئلة';
      const srcChips = B.srcList().map((s) => ui.chip('data-a="src" data-v="' + esc(s.id) + '"', esc(s.name), st.src === s.id ? 'inc' : '')).join('');
      return '<div class="view"><div class="vtop"><div><h1>بنك الأسئلة</h1><div class="sub">' + U.nQ(all.length) + ' في ' + B.srcList().length + ' مصادر · تصفح حسب التخصص أو ابحث بكلمة</div></div>' +
        '<div class="row"><button class="btn g sm" data-a="adv">الفلترة المتقدمة</button><button class="btn p sm" data-a="start"' + (list.length ? '' : ' disabled') + '>📖 تدرّب على ' + U.nQ(list.length) + '</button></div></div>' +
        '<div class="split"><div class="card tree" data-scroll="tree">' +
        '<button class="tn' + (!st.sel ? ' on' : '') + '" data-a="node" data-v=""><span class="car"></span><span class="nm" style="font-family:var(--f);direction:rtl;text-align:right">كل الأسئلة</span><span class="ct">' + all.length + '</span></button>' +
        treeHtml(counts, st.sel, st.open, 'node') + '</div>' +
        '<div><div class="card pad" style="margin-bottom:12px"><input class="inp" style="width:100%" data-i="q" data-key="bq" value="' + esc(st.q) + '" placeholder="🔍 ابحث في السؤال أو الاختيارات أو الشرح…" dir="auto">' +
        '<div class="chips" style="margin-top:10px">' + ui.chip('data-a="src" data-v=""', 'كل المصادر', !st.src ? 'inc' : '') + srcChips + '</div></div>' +
        '<div class="card"><div class="sec" style="padding:12px 16px 4px;margin:0"><h3 class="ens">' + esc(label) + '</h3><span class="note">' + U.nQ(list.length) + '</span></div>' +
        (rows || '<div class="empty">لا توجد نتائج.</div>') +
        (list.length > st.lim ? '<div style="padding:12px 16px"><button class="btn g w" data-a="more">عرض المزيد (' + (list.length - st.lim) + ')</button></div>' : '') + '</div></div></div></div>';
    },
    act(a, el) {
      const st = ui.st.bk;
      if (a === 'node') {
        const v = el.dataset.v;
        if (v && st.sel === v) toggleOpen(st.open, v);
        else if (v && !st.open.has(v)) toggleOpen(st.open, v);
        st.sel = v; st.lim = 60;
        ui.refresh();
        return;
      }
      if (a === 'src') { st.src = el.dataset.v; st.lim = 60; ui.refresh(); return; }
      if (a === 'more') { st.lim += 60; ui.refresh(); return; }
      const list = ui.st.bkList || [];
      const title = st.sel ? tx.name(st.sel) : 'بنك الأسئلة';
      if (a === 'open') UB.startList(list.map((q) => q.id), title, 'practice', +el.dataset.i);
      if (a === 'start') UB.startSheet({ qids: list.map((q) => q.id), title, kind: 'practice' });
      if (a === 'adv') UB.loadFilter(Object.assign(st.sel ? { inc: { tax: [st.sel] } } : {}, st.q ? { q: st.q } : {}));
    },
    input(k, el) {
      if (k !== 'q') return;
      ui.st.bk.q = el.value;
      ui.st.bk.lim = 60;
      clearTimeout(ui.st.bkT);
      ui.st.bkT = setTimeout(() => ui.refresh(), 300);
    },
  };

  /* ---------- topic summaries ---------- */
  function hyMark(q) {
    if (q.hy) return true;
    if (!q.dup) return false;
    const srcs = new Set(B.list.filter((x) => x.dup === q.dup).map((x) => x.src));
    return srcs.size >= 2;
  }
  V.topics = {
    render() {
      if (!B.loaded) return loading;
      const st = ui.st.tp || (ui.st.tp = { sel: '', open: new Set() });
      const all = usable();
      const counts = taxCounts(all);
      if (!st.sel) {
        const first = tx.specs.find((s) => counts[s.id]);
        if (first) { st.sel = first.id; st.open.add(first.id); }
      }
      const list = all.filter((q) => B.eff(q).tax.includes(st.sel)).sort((a, b) => (B.eff(a).sub || '').localeCompare(B.eff(b).sub || '') || a.order.localeCompare(b.order));
      ui.st.tpList = list;
      let att = 0, ok = 0, ans = 0;
      for (const q of list) { const i = S.info(q.id); if (i.n) ans++; for (const x of i.attempts) { att++; if (x[2] === 1) ok++; } }
      const acc = att ? U.pct(ok, att) : null;
      let lastSub = null;
      const cards = list.map((q, idx) => {
        const e = B.eff(q);
        let head = '';
        if (st.sel !== e.sub && e.sub !== lastSub) { head = '<div class="sec" style="padding:14px 16px 0;margin:0"><h3 class="ens" style="font-size:15px">' + esc(tx.name(e.sub || e.topic)) + '</h3></div>'; lastSub = e.sub; }
        const sum = (q.sum || q.expl.split(/\.\s+/)[0]).replace(/^[A-J]\s*—\s*/, '');
        return head + '<div class="sumcard"><div class="row" style="gap:6px"><span class="mini pri">' + esc(B.srcLabel(q)) + '</span>' + (hyMark(q) ? '<span class="mini" style="background:var(--warnbg);color:var(--warn)">High-yield</span>' : '') +
          (S.info(q.id).wrong ? '<span class="mini bad">✕ ' + S.info(q.id).wrong + '</span>' : '') + '<span class="grow"></span><button class="btn g sm" style="height:32px" data-a="open" data-i="' + idx + '">افتح السؤال</button></div>' +
          '<p class="en"><b style="color:var(--ok)">✓ ' + esc(B.optText(q, q.ans)) + '</b><br>' + esc(sum) + '</p></div>';
      }).join('');
      return '<div class="view"><div class="vtop"><div><h1>ملخص المواضيع</h1><div class="sub">ملخصات كل أسئلة الموضوع من كل المصادر في صفحة واحدة — مذكرة High-yield جاهزة</div></div></div>' +
        '<div class="split"><div class="card tree">' + treeHtml(counts, st.sel, st.open, 'node') + '</div>' +
        '<div><div class="card pad" style="margin-bottom:12px"><div class="row"><div class="grow"><div class="note">' + esc(tx.label(st.sel, 2)) + '</div><div style="font-size:22px;font-weight:700" class="ens">' + esc(tx.name(st.sel)) + '</div>' +
        '<div class="muted">' + U.nQ(list.length) + ' · حللت ' + ans + (acc != null ? ' · نسبة الصحيح ' + acc + '%' : '') + '</div></div>' +
        '<button class="btn p" data-a="start"' + (list.length ? '' : ' disabled') + '>📖 تدرّب على الموضوع</button></div></div>' +
        '<div class="card">' + (cards || '<div class="empty">لا توجد أسئلة.</div>') + '</div>' +
        '<div class="note" style="margin-top:8px">ملاحظة: الملخص يكشف الإجابة — استخدم هذه الصفحة للمراجعة السريعة، والجلسات النظيفة لاختبار نفسك.</div></div></div></div>';
    },
    act(a, el) {
      const st = ui.st.tp;
      if (a === 'node') {
        const v = el.dataset.v;
        if (st.sel === v) toggleOpen(st.open, v);
        else if (!st.open.has(v)) toggleOpen(st.open, v);
        st.sel = v;
        ui.refresh();
        return;
      }
      const list = ui.st.tpList || [];
      if (a === 'open') UB.startList([list[+el.dataset.i].id], tx.name(st.sel), 'practice', 0);
      if (a === 'start') UB.startSheet({ qids: list.map((q) => q.id), title: tx.name(st.sel), kind: 'practice' });
    },
  };

  /* ---------- needs review ---------- */
  V['needs-review'] = {
    render() {
      if (!B.loaded) return loading;
      const list = B.list.filter((q) => B.status(q) !== 'ok');
      ui.st.nrList = list;
      const rows = list.map((q, idx) => {
        const e = B.eff(q);
        const inc = q.status === 'incomplete';
        const why = inc ? (!q.expl ? 'لا يوجد شرح' : 'الإجابة غير محددة') : 'الثقة ' + Math.round(q.conf * 100) + '٪';
        return '<div class="list-row" style="align-items:center">' + ui.dot(e.spec, 30) + '<div class="grow"><div class="qs en">' + esc(q.stem) + '</div><div class="m"><span class="mini pri">' + esc(B.srcLabel(q)) + '</span>' +
          '<span class="mini ens">' + esc(e.sub || e.topic || e.spec ? tx.label(e.sub || e.topic || e.spec) : '— بلا تصنيف') + '</span><span class="mini ar ' + (inc ? 'bad' : '') + '">' + why + '</span>' + (q.page ? '<span class="mini">ص ' + esc(q.page) + '</span>' : '') + '</div>' +
          (inc ? '<div class="note" style="margin-top:4px">لا يظهر في الجلسات حتى يُستكمل من الكتاب.</div>' : '') + '</div>' +
          '<button class="btn g sm" data-a="edit" data-i="' + idx + '">تعديل</button>' + (inc ? '' : '<button class="btn s sm" data-a="ok" data-i="' + idx + '">✓ صحيح</button>') + '</div>';
      }).join('');
      return '<div class="view"><div class="vtop"><div><h1>بحاجة لمراجعة</h1><div class="sub">أسئلة تصنيفها غير مؤكد أو بياناتها ناقصة. أكّد التصنيف بلمسة أو عدّله.</div></div></div>' +
        '<div class="card">' + (rows || '<div class="empty"><div class="big">✅</div>لا توجد أسئلة بحاجة لمراجعة.</div>') + '</div></div>';
    },
    act(a, el) {
      const q = (ui.st.nrList || [])[+el.dataset.i];
      if (!q) return;
      if (a === 'ok') { S.setReviewed(q.id, true); ui.toast('✓ أُكّد التصنيف'); ui.refresh(); }
      if (a === 'edit') UB.editQuestion(q, () => ui.refresh());
    },
  };
})();

</script><script>
/* UroBank — stats, daily plan, library/import, preferences + backup */
(function () {
  'use strict';
  const UB = window.UB;
  const U = UB.U, S = UB.S, B = UB.B, F = UB.F, ui = UB.ui, V = UB.V;
  const esc = U.esc, tx = UB.tx;
  const loading = '<div class="view"><div class="loading">جارٍ التحميل…</div></div>';
  const usable = () => B.list.filter((q) => B.usable(q));

  /* ======================= STATS ======================= */
  function meter(name, acc, att, attrs, nameIsAr) {
    const [col, lab, ic] = ui.accStatus(acc);
    return '<button class="meter" ' + (attrs || '') + ' data-tip="' + (acc == null ? '—' : acc + '%') + '|' + esc(name) + ' · ' + att + ' محاولة"><div class="nm"' + (nameIsAr ? ' style="font-family:var(--f);direction:rtl;text-align:right"' : '') + '>' + esc(name) + '</div>' + ui.bar(acc || 0, col) +
      '<div class="v"><span class="st-ic" style="color:' + col + '">' + ic + '</span>' + (acc == null ? '—' : acc + '%') + ' <small>' + lab + '</small></div></button>';
  }
  V.stats = {
    render() {
      if (!B.loaded) return loading;
      const per = ui.st.stp || 'month';
      const now = Date.now();
      const cut = per === 'week' ? now - 7 * 864e5 : per === 'month' ? now - 30 * 864e5 : 0;
      const all = usable();
      let att = 0, ok = 0, tSum = 0, guess = 0, distinct = 0;
      const bySub = {}, bySpec = {}, bySrc = {}, byCat = {}, reasons = {};
      let wrongAtt = 0;
      const weeks = Array.from({ length: 8 }, () => [0, 0]);
      const add = (m, k, isOk) => { const o = m[k] || (m[k] = [0, 0]); o[0]++; if (isOk) o[1]++; };
      const buckets = { 1: 0, 2: 0, 3: 0 };
      for (const q of all) {
        const i = S.info(q.id);
        if (!i.n) continue;
        if (i.wrong) buckets[Math.min(3, i.wrong)]++;
        const e = B.eff(q);
        let used = false;
        for (const x of i.attempts) {
          const ms = x[0] * 1000;
          const wk = Math.floor((now - ms) / (7 * 864e5));
          if (wk >= 0 && wk < 8) { weeks[7 - wk][0]++; if (x[2] === 1) weeks[7 - wk][1]++; }
          if (ms < cut) continue;
          used = true;
          const isOk = x[2] === 1;
          att++; if (isOk) ok++;
          tSum += +x[3] || 0;
          if (x[7] === 'g') guess++;
          if (!isOk) { wrongAtt++; const r = x[6] || 'none'; reasons[r] = (reasons[r] || 0) + 1; }
          add(bySub, e.sub || e.topic || e.spec || 'x', isOk);
          add(bySpec, e.spec || 'x', isOk);
          add(bySrc, q.src, isOk);
          const sex = e.sex;
          add(byCat, sex === 'M' ? 'M' : sex === 'F' ? 'F' : sex === 'none' ? 'none' : 'kid', isOk);
          if (q.imgs.some((m) => m.where === 'stem')) add(byCat, 'img', isOk);
          if (q.fmt) add(byCat, 'fmt:' + q.fmt, isOk);
          if (q.qtype === 'management' || q.qtype === 'diagnosis') add(byCat, 'qt:' + q.qtype, isOk);
        }
        if (used) distinct++;
      }
      const acc = att ? U.pct(ok, att) : null;
      const kpis = '<div class="stats">' +
        '<div class="stat"><b>' + U.num(att) + '</b><span>محاولة · ' + U.nQ(distinct) + '</span></div>' +
        '<div class="stat"><b>' + (acc == null ? '—' : acc + '%') + '</b><span>نسبة الصحيح</span></div>' +
        '<div class="stat"><b>' + (att ? Math.round(tSum / att) + '<span style="font-size:14px">s</span>' : '—') + '</b><span>متوسط وقت السؤال</span></div>' +
        '<div class="stat"><b>' + (att ? U.pct(guess, att) + '%' : '—') + '</b><span>إجابات بالتخمين</span></div></div>';
      // weekly accuracy columns (single series: title names it, no legend)
      const lastIdx = weeks.reduce((m, w, i) => (w[0] ? i : m), -1);
      const cols = '<div class="cols" role="img" aria-label="نسبة الصحيح في آخر 8 أسابيع">' + weeks.map((w, i) => {
        const p = w[0] ? U.pct(w[1], w[0]) : null;
        const label = i === 7 ? 'هذا الأسبوع' : 'قبل ' + U.ar(7 - i, ['أسبوع', 'أسبوعين', 'أسابيع', 'أسبوعًا', 'أسبوع']);
        return '<div class="c" tabindex="0" data-tip="' + (p == null ? '—' : p + '%') + '|' + label + (w[0] ? ' · ' + w[0] + ' محاولة' : '') + '">' +
          (i === lastIdx && p != null ? '<span class="lab">' + p + '%</span>' : '') + '<i style="height:' + (p == null ? 0 : Math.max(2, p)) + '%"></i></div>';
      }).join('') + '</div><div class="xlabs">' + weeks.map((w, i) => '<span>' + (i === 7 ? 'now' : '-' + (7 - i) + 'w') + '</span>').join('') + '</div>' +
        '<details style="margin-top:8px"><summary class="note" style="cursor:pointer">عرض كجدول</summary><table class="tbl"><tr><th>الأسبوع</th><th>محاولات</th><th>صحيح</th></tr>' +
        weeks.map((w, i) => '<tr><td>' + (i === 7 ? 'هذا الأسبوع' : 'قبل ' + (7 - i) + ' أسابيع') + '</td><td class="num">' + w[0] + '</td><td class="num">' + (w[0] ? U.pct(w[1], w[0]) + '%' : '—') + '</td></tr>').join('') + '</table></details>';
      const weak = Object.entries(bySub).filter(([, v]) => v[0] >= 2).map(([id, v]) => [id, U.pct(v[1], v[0]), v[0]]).sort((a, b) => a[1] - b[1]).slice(0, 7);
      const weakHtml = weak.length ? weak.map(([id, p, n]) => meter(tx.name(id) || id, p, n, 'data-a="sub" data-v="' + esc(id) + '"')).join('') : '<div class="note">تظهر بعد محاولتين على الأقل في الموضوع خلال هذه الفترة.</div>';
      const srcRows = Object.entries(bySrc).map(([sid, v]) => {
        const s = B.sources[sid] || { name: sid };
        return '<tr><td class="en">' + esc(s.name) + '</td><td class="num">' + v[0] + '</td><td class="num">' + U.pct(v[1], v[0]) + '%</td></tr>';
      }).join('');
      const heat = tx.specs.filter((sp) => bySpec[sp.id]).map((sp) => {
        const v = bySpec[sp.id];
        const p = U.pct(v[1], v[0]);
        const [col, lab, ic] = ui.accStatus(p);
        return '<button data-a="spec" data-v="' + sp.id + '" style="border-inline-start:4px solid ' + col + '" data-tip="' + p + '%|' + esc(sp.en) + ' · ' + v[0] + ' محاولة"><div class="hn">' + esc(sp.en) + '</div><div class="hv">' + p + '%</div><div class="hs"><span style="color:' + col + '">' + ic + '</span> ' + lab + ' · ' + v[0] + '</div></button>';

  /* ======================= PLAN ======================= */
  UB.planToday = function () {
    const plan = S.plan();
    const scope = plan.scope && plan.scope.length ? new Set(plan.scope) : null;
    const now = Date.now();
    const t0 = U.dayStart();
    let unseen = 0, doneNew = 0, doneRev = 0, total = 0;
    const dueIds = [], newIds = [];
    for (const q of B.list) {
      if (!B.usable(q) || (scope && !scope.has(q.src))) continue;
      total++;
      const i = S.info(q.id);
      if (!i.n) { unseen++; newIds.push(q); continue; }
      if (i.attempts[0][0] * 1000 >= t0) doneNew++;
      else if (i.attempts.some((x) => x[0] * 1000 >= t0)) doneRev++;
      if (i.wrong && i.due && i.due <= now) dueIds.push(q);
    }
    const daysLeft = plan.exam ? U.daysBetween(now, U.parseDay(plan.exam)) : null;
    const buffer = daysLeft ? Math.min(14, Math.floor(daysLeft * 0.15)) : 0;
    const startUnseen = unseen + doneNew;
    let goal;
    if (plan.goalMode === 'manual' && plan.goal) goal = plan.goal;
    else if (daysLeft && daysLeft > 0) goal = Math.max(1, Math.ceil(startUnseen / Math.max(1, daysLeft - buffer)));
    else goal = plan.goal || 30;
    return { goal, due: dueIds.length, doneNew, doneRev, unseen, daysLeft, buffer, total, dueIds: F.sort(dueIds, 'old').map((q) => q.id), newIds: F.sort(newIds, 'random').map((q) => q.id) };
  };

        '<div style="font-size:20px;font-weight:700">' + (dl > 0 ? 'باقي ' + U.nDays(dl) : dl === 0 ? 'الامتحان اليوم!' : 'انتهى موعد الامتحان') + '</div>' +
        '<div class="muted" style="margin-top:6px">جديدة اليوم: ' + p.doneNew + ' من ' + p.goal + '</div>' +
        '<div class="muted">مراجعة مستحقة: ' + p.due + (p.doneRev ? ' · راجعت ' + p.doneRev : '') + '</div>' +
        '<div class="muted">لم تحلها بعد: ' + U.nQ(p.unseen) + ' من ' + p.total + '</div></div></div></div>' +
        '<div class="card pad"><div class="sec"><h3>المراجعات القادمة (7 أيام)</h3></div>' + upCols + '</div>' +
        '<div class="card pad"><div class="sec"><h3>آخر 14 يومًا</h3></div>' + dots + '</div>' +

    act(a, el) {

  function importBank(text, fname) {
    let json;
    try { json = JSON.parse(text); } catch (e) { ui.toast('الملف ليس JSON صالحًا', 'bad'); return; }
    const err = B.validate(json);
    if (err) { ui.toast(err, 'bad', 4000); return; }
    const srcs = json.sources || [json.source];
    const name = json.name || srcs.map((s) => s.name).join(' + ') || fname;
    const dupIds = json.questions.filter((q) => B.byId[String(q.id)]).length;
    const sample = json.questions.slice(0, 3).map((q) => '<div class="list-row"><div class="qs en">' + esc(q.stem) + '</div></div>').join('');
    ui.sheet({
      html: ui.sh('استيراد: ' + esc(name), U.nQ(json.questions.length) + ' · ' + esc(srcs.map((s) => s.full || s.name).join('، '))) +
        (dupIds ? '<div class="banner">⚠ ' + U.nQ(dupIds) + ' موجودة مسبقًا (نفس الرقم) وستُتجاهل.</div>' : '') +
        '<div class="card">' + sample + '</div>' +
        '<div class="acts"><button class="btn g" data-a="close">إلغاء</button><button class="btn p" data-a="go">استيراد</button></div>',
      onAct: async (a, el, e, h) => {
        if (a !== 'go') return;
        h.close();
        ui.toast('جارٍ الاستيراد…', '', 6000);
        try {
          await S.uploadBank(text, { name, count: json.questions.length, srcs: srcs.map((s) => s.id) });
          await B.load();
          ui.toast('✓ أُضيف ' + U.nQ(json.questions.length), 'ok');
        } catch (er) {
          if (er && er.code === 'no_assets') {
            B.add(json, { id: 'tmp-' + U.uid(6), name: name + ' (مؤقت)' });
            B.refresh();
            ui.toast('أُضيف مؤقتًا لهذه الجلسة فقط — لا يتوفر التخزين هنا', 'bad', 5000);
          } else ui.toast('تعذّر الاستيراد: ' + ((er && (er.message || er.code)) || ''), 'bad', 5000);
        }
        UB._agg = null;
        ui.refresh();
      },
    });
  }

            '<div class="acts"><button class="btn g" data-a="close">إلغاء</button><button class="btn s" data-a="merge">دمج</button><button class="btn p" data-a="replace">استبدال</button></div>',

  async function doReset() {

</script><script>
/* UroBank — standalone web app mode (outside Claude).
   Progress stays in the page's storage on the device; books and snapshots in IndexedDB; offline via a
   service worker; backup files through the share sheet; optional automatic copy to a private GitHub repo. */
(function () {
  'use strict';
  if (window.claude) return; // inside Claude the artifact runtime provides account storage
  const UB = window.UB;
  const U = UB.U, S = UB.S, ui = UB.ui;
  const esc = U.esc;
  UB.PWA = true;

  /* ---------- IndexedDB: imported books + snapshots ---------- */
  let dbp = null;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('urobank', 1);
      r.onupgradeneeded = () => { const d = r.result; for (const s of ['banks', 'snaps']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { dbp = null; rej(r.error); };
    });
    return dbp;
  }
  async function idb(store, mode, fn) {
    const d = await openDB();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('aborted'));
    });
  }
  const db = (UB.idb = {
    get: (s, k) => idb(s, 'readonly', (st) => st.get(k)),
    set: (s, k, v) => idb(s, 'readwrite', (st) => st.put(v, k)),
    del: (s, k) => idb(s, 'readwrite', (st) => st.delete(k)),
  });

  /* ---------- snapshots on the device ---------- */
  S.canSnap = () => true;
  S.snapNow = async function (slot, kind) {
    const full = S.buildFull();
    const packed = await U.gz(JSON.stringify(full));
    await db.set('snaps', slot, { at: full.at, kind, att: full.attempts, d: packed });
    const b = S.docs.backup;
    b.snaps = (b.snaps || []).filter((x) => x.slot !== slot);
    b.snaps.push({ slot, at: full.at, day: U.dayKey(full.at), kind, att: full.attempts, size: packed.length });
    b.snaps.sort((x, y) => y.at - x.at);
    if (kind === 'auto') b.last = U.dayKey();

    return true;
  };
  S.snapLoad = async function (slot) {
    const m = await db.get('snaps', slot);
    if (!m || !m.d) throw new Error('missing');
    return JSON.parse(await U.ungz(m.d));
  };

  /* ---------- imported books on the device ---------- */
  UB.loadUserBank = async (ub) => {
    const t = await db.get('banks', ub.id);
    if (t == null) throw new Error('missing');
    return typeof t === 'string' ? JSON.parse(t) : t;
  };
  S.uploadBank = async function (text, meta) {
    const list = S.docs.banks.list || [];
    // the same book imported again (another iPad, or after reinstalling): attach the file to its entry
    const same = list.find((x) => x.name === meta.name && x.count === meta.count && String(x.srcs) === String(meta.srcs));
    const id = same ? same.id : 'u-' + U.uid(10);
    await db.set('banks', id, text);
    if (same) return same;
    const entry = { id, name: meta.name, count: meta.count, srcs: meta.srcs, at: Date.now(), size: text.length };
    S.docs.banks.list = list.concat([entry]);
    S.touch('banks');
    return entry;
  };
  S.removeBank = async function (entry) {
    try { await db.del('banks', entry.id); } catch (e) { console.warn(e); }
    S.docs.banks.list = (S.docs.banks.list || []).filter((x) => x.id !== entry.id);
    S.touch('banks');
  };

  /* ---------- backup file: share sheet ("Save to Files" -> iCloud Drive), else a download ---------- */
  S.exportFile = async function () {
    const data = JSON.stringify(S.buildFull());
    const filename = 'UroBank-backup-' + U.dayKey() + '.json';
    const done = () => { S.docs.backup.lastExport = Date.now(); S.touch('backup'); return { ok: true }; };
    try {
      const file = new File([data], filename, { type: 'application/json' });
      // no await before share(): it must run inside the tap
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return done();
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 10000);
      return done();
    } catch (e) {
      if (e && e.name === 'AbortError') return { ok: false, reason: 'declined', data, filename };
      return { ok: false, reason: 'error', data, filename };
    }
  };

  /* ---------- automatic copy to a private GitHub repository ---------- */
  const GHK = 'ub1:gh';
  const FILE = 'urobank-progress.json.gz';
  const GH = (UB.GH = { cfg: null, state: 'off', err: '', errStatus: 0, last: 0, busy: false, again: false, head: null, tree: null, snapDay: '' });
  const apiBase = () => { try { return localStorage.getItem('ub1:ghapi') || 'https://api.github.com'; } catch (e) { return 'https://api.github.com'; } };
  function saveGH() {
    try { localStorage.setItem(GHK, JSON.stringify(GH.cfg ? { cfg: GH.cfg, head: GH.head, tree: GH.tree, last: GH.last, snapDay: GH.snapDay } : null)); } catch (e) {}
  }
  function loadGH() {
    try {
      const o = JSON.parse(localStorage.getItem(GHK) || 'null');
      if (o && o.cfg && o.cfg.token) Object.assign(GH, { cfg: o.cfg, head: o.head || null, tree: o.tree || null, last: o.last || 0, snapDay: o.snapDay || '' });
    } catch (e) {}
  }
  const rp = (cfg) => '/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo);
  async function api(method, path, body, cfg) {
    cfg = cfg || GH.cfg;
    let r;
    try {
      r = await fetch(apiBase() + path, {
        method, cache: 'no-store',
        headers: Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, body ? { 'Content-Type': 'application/json' } : {}),
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (e) { const er = new Error('network'); er.status = 0; throw er; }
    if (r.status === 204) return null;
    let j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok) { const er = new Error((j && j.message) || 'HTTP ' + r.status); er.status = r.status; throw er; }
    return j;
  }
  function errText(e) {
    if (!e || !e.status) return 'لا يوجد اتصال بالإنترنت الآن';
    if (e.status === 401) return 'الرمز (token) غير صحيح أو انتهت صلاحيته';
    if (e.status === 403) return 'الرمز لا يملك صلاحية الكتابة على المستودع (Contents: Read and write)';
    if (e.status === 404) return 'لم أجد المستودع — تأكد من اسم المستخدم واسم المستودع، وأن الرمز يشمل هذا المستودع';
    return 'خطأ من GitHub: ' + (e.message || e.status);
  }
  function setGH(st, err, status) {
    GH.state = st;
    if (err !== undefined) GH.err = err;
    GH.errStatus = status || 0;
    S.setSync(st === 'ok' || st === 'saving' || st === 'offline' || st === 'error' ? st : 'local', GH.err);
  }
  async function headSha() {
    try {
      const j = await api('GET', rp(GH.cfg) + '/git/ref/heads/' + encodeURIComponent(GH.cfg.branch));
      return j && j.object ? j.object.sha : null;
    } catch (e) {
      if (e.status === 409 || (e.status === 404 && GH.repoOk)) return null; // empty repository / no branch yet
      throw e;
    }
  }
  async function decodeBlob(b64) {
    const clean = (b64 || '').replace(/\s+/g, '');
    const bytes = U.unb64(clean);
    const text = bytes[0] === 0x1f && bytes[1] === 0x8b ? await U.ungz('gz:' + clean) : new TextDecoder().decode(bytes);
    const o = JSON.parse(text);
    return S.validBackup(o) ? o : null;
  }
  async function readRemote(sha) {
    const c = await api('GET', rp(GH.cfg) + '/git/commits/' + sha);
    const t = await api('GET', rp(GH.cfg) + '/git/trees/' + c.tree.sha);
    const ent = (t.tree || []).find((x) => x.path === FILE);
    let full = null;
    if (ent) {
      const b = await api('GET', rp(GH.cfg) + '/git/blobs/' + ent.sha);
      full = await decodeBlob(b.content);
    }
    return { tree: c.tree.sha, full };
  }
  async function encodeFull() {
    const json = JSON.stringify(S.buildFull());

  }
  // one commit without parents, branch moved to it: the repository keeps only the current copy
  // (plus 30 rolling daily files), so it does not grow with every save
  async function pushTo(head, baseTree) {
    const content = await encodeFull();
    if (!head) {
      const j = await api('PUT', rp(GH.cfg) + '/contents/' + FILE, { message: 'UroBank backup', content });
      return { head: j.commit.sha, tree: j.commit.tree.sha };
    }
