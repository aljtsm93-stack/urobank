:root {
  --bg: #F4F1EA; --card: #FFFFFF; --ink: #16232E; --ink2: #4A5866; --ink3: #7D8995;
  --line: #E6E1D6; --line2: #EEE9DF; --chip: #F7F5F0; --hover: #F1EDE4;
  --pri: #0F5C63; --pri-ink: #FFFFFF; --pri2: #E3F0EF; --pri3: #B9D9D6;
  --ok: #1F8A5B; --okbg: #E6F4EC; --okline: #A9D8BF;
  --bad: #C2413A; --badbg: #FBEAE8; --badline: #F1CBC6;
  --warn: #9A6410; --warnbg: #FFF4E2; --warnline: #F0DDBB;
  --sum: #FFF8EC; --sumline: #F0DDBB; --sumink: #8A5A14;
  --track: #EEE9DF; --shadow: 0 1px 2px rgba(20,30,40,.05), 0 10px 30px -14px rgba(20,30,40,.25);
  --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
  --f: 'IBM Plex Sans Arabic', 'Plex Local', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fe: Inter, 'IBM Plex Sans Arabic', 'Plex Local', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fs: 1; --side: 236px; --r: 16px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0F151A; --card: #172027; --ink: #E7ECEF; --ink2: #AEB9C1; --ink3: #7F8C97;
  --line: #27323A; --line2: #202A31; --chip: #1C262D; --hover: #1F2A31;
  --pri: #3FA6AC; --pri-ink: #04191C; --pri2: #14333A; --pri3: #1F4F55;
  --ok: #46B37E; --okbg: #12301F; --okline: #2B6447;
  --bad: #E66A61; --badbg: #3A1C1A; --badline: #6A2F2B;
  --warn: #E7B05A; --warnbg: #33270F; --warnline: #5A4520;
  --sum: #2A2416; --sumline: #4B3F22; --sumink: #E8C27A;
  --track: #24303A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}
[data-theme="sepia"] {
  --bg: #EFE5D0; --card: #FBF4E6; --ink: #3A2E21; --ink2: #5E4E3D; --ink3: #8A7862;
  --line: #E0D1B5; --line2: #E8DCC4; --chip: #F4EAD7; --hover: #EFE3CC;
  --pri2: #E1EBE2; --track: #E8DCC4; --sum: #FFF1D6;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
input, select, textarea { font: inherit; color: var(--ink); font-size: 16px; }
a { color: var(--pri); }
.en { direction: ltr; text-align: left; font-family: var(--fe); unicode-bidi: isolate; }
.ens { direction: ltr; unicode-bidi: isolate; font-family: var(--fe); }
.muted { color: var(--ink2); }
.mut3 { color: var(--ink3); }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- app shell ---------- */
.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
.side { width: var(--side); flex: none; background: var(--card); border-inline-end: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 18px 12px 12px; overflow-y: auto; }
.logo { font-family: var(--fe); font-weight: 800; font-size: 24px; letter-spacing: -.3px; padding: 4px 12px 16px; direction: ltr; text-align: right; }
.logo span { color: var(--pri); }
.ni { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--ink2); width: 100%; text-align: start; min-height: 44px; }
.ni svg { width: 22px; height: 22px; flex: none; }
.ni.on { background: var(--pri2); color: var(--pri); font-weight: 700; }
@media (hover: hover) { .ni:hover:not(.on) { background: var(--hover); } }
.ni .b { margin-inline-start: auto; font-size: 12px; font-weight: 700; font-family: var(--fe); background: var(--badbg); color: var(--bad); padding: 1px 8px; border-radius: 99px; }
.side h6 { margin: 14px 12px 6px; font-size: 12.5px; color: var(--ink3); font-weight: 600; }
.preset { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; font-size: 13.5px; width: 100%; text-align: start; color: var(--ink); min-height: 38px; }
.preset i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--pri); }
.preset .n { margin-inline-start: auto; font-family: var(--fe); font-size: 12px; color: var(--ink3); }
@media (hover: hover) { .preset:hover { background: var(--hover); } }
.side .sp { flex: 1; min-height: 10px; }
.syncb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink3); padding: 10px 12px 4px; }
.syncb .d { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); flex: none; }
.syncb.ok .d { background: var(--ok); } .syncb.saving .d { background: var(--st-warn); } .syncb.offline .d, .syncb.error .d { background: var(--bad); }
.main { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
.view { padding: 24px 28px 48px; max-width: 1380px; margin: 0 auto; }
.bnav { display: none; }

/* tablet portrait: icon rail */
@media (max-width: 1023px) {
  :root { --side: 84px; }
  .side { padding: 14px 8px; align-items: stretch; }
  .logo { font-size: 15px; padding: 4px 0 12px; text-align: center; }
  .ni { flex-direction: column; gap: 3px; font-size: 11px; padding: 8px 2px; text-align: center; min-height: 58px; justify-content: center; line-height: 1.2; }
  .ni .b { position: absolute; margin: 0; transform: translate(-16px, -16px); font-size: 10.5px; padding: 0 6px; }
  .ni { position: relative; }
  .side h6, .preset, .syncb .t { display: none; }
  .syncb { justify-content: center; padding: 8px 0; }
  .view { padding: 20px 22px 48px; }
}
/* phone: bottom nav */
@media (max-width: 699px) {
  .side { display: none; }
  .bnav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: var(--card); border-top: 1px solid var(--line); z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
  .bnav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--ink3); }
  .bnav button.on { color: var(--pri); font-weight: 700; }
  .bnav svg { width: 22px; height: 22px; }
  .main { padding-bottom: 70px; }
  .view { padding: 16px 14px 40px; }
}
body.focus .side, body.focus .bnav { display: none; }
body.focus .main { padding-bottom: 0; overflow: hidden; }

/* ---------- generic components ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.pad { padding: 16px 18px; }
.vtop { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.vtop h1 { font-size: 27px; font-weight: 700; margin: 0; line-height: 1.25; }
.vtop .sub { font-size: 14px; color: var(--ink2); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; gap: 10px; }
.sec h3 { font-size: 17px; font-weight: 700; margin: 0; }
.sec .lnk { font-size: 13.5px; color: var(--pri); font-weight: 600; }
.btn { height: 48px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 15.5px; padding: 0 20px; white-space: nowrap; border: 1.5px solid transparent; }
.btn.p { background: var(--pri); color: var(--pri-ink); }
.btn.s { background: var(--card); border-color: var(--pri); color: var(--pri); }
.btn.g { background: var(--card); border-color: var(--line); color: var(--ink); font-weight: 600; }
.btn.d { background: var(--bad); color: #fff; }
.btn.dg { background: var(--card); border-color: var(--badline); color: var(--bad); }
.btn.sm { height: 40px; font-size: 14px; padding: 0 14px; border-radius: 12px; }
.btn.w { width: 100%; }
.btn:disabled, .btn.dis { opacity: .45; pointer-events: none; }
@media (hover: hover) { .btn.p:hover { filter: brightness(1.08); } .btn.g:hover, .btn.s:hover { background: var(--hover); } }
.ib { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: inline-grid; place-items: center; font-size: 17px; flex: none; color: var(--ink); }
.ib.on { background: var(--pri2); border-color: var(--pri3); color: var(--pri); }
.ib:disabled { opacity: .4; }
.ib svg { width: 20px; height: 20px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--chip); color: var(--ink2); border: 1px solid var(--line2); line-height: 1.5; }
.tag.src { background: var(--pri2); color: var(--pri); border-color: transparent; }
.tag.bad { background: var(--badbg); color: var(--bad); border-color: var(--badline); }
.tag.ok { background: var(--okbg); color: var(--ok); border-color: var(--okline); }
.tag.warn { background: var(--warnbg); color: var(--warn); border-color: var(--warnline); }
.tag .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); font-size: 14px; font-weight: 500; white-space: nowrap; min-height: 38px; color: var(--ink); }
.chip .n { font-family: var(--fe); font-size: 11.5px; opacity: .7; }
.chip.inc { background: var(--pri); color: var(--pri-ink); border-color: var(--pri); font-weight: 600; }
.chip.exc { background: var(--badbg); color: var(--bad); border-color: var(--badline); }
.chip.exc .t { text-decoration: line-through; }
.chip.zero:not(.inc):not(.exc) { opacity: .45; }
.chip .x { font-size: 12px; opacity: .8; }
.chip.more { color: var(--pri); font-weight: 600; background: transparent; border-style: dashed; }
.dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; font-family: var(--fe); flex: none; }
.empty { text-align: center; padding: 34px 20px; color: var(--ink2); }
.empty .big { font-size: 34px; margin-bottom: 6px; }
.note { font-size: 13px; color: var(--ink3); }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 14px; background: var(--warnbg); border: 1px solid var(--warnline); color: var(--ink); font-size: 14px; margin-bottom: 16px; }
.banner.info { background: var(--pri2); border-color: var(--pri3); }
.banner b { font-weight: 700; }
.inp { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; min-width: 0; }
.inp:focus, textarea:focus, select:focus { outline: 2px solid var(--pri3); outline-offset: 0; border-color: var(--pri); }
select.inp { padding: 0 10px; }

.sw-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }

.bar { height: 7px; background: var(--track); border-radius: 9px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; border-radius: 9px; background: var(--pri); }
.list-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--line); width: 100%; text-align: start; }
.list-row:first-child { border-top: 0; }
@media (hover: hover) { button.list-row:hover { background: var(--hover); } }
.list-row .qs { font-size: 14.5px; line-height: 1.5; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.list-row .m { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.mini { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--ink2); font-family: var(--fe); white-space: nowrap; border: 1px solid var(--line2); direction: ltr; unicode-bidi: isolate; }

/* ---------- overlays ---------- */

.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1D2A33; color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14.5px; z-index: 90; opacity: 0; pointer-events: none; transition: all .2s; max-width: calc(100vw - 40px); box-shadow: var(--shadow); }

/* ---------- home ---------- */
.hgrid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }

@media (max-width: 699px) { .pgrid { grid-template-columns: 1fr; } }
.pc { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; text-align: start; width: 100%; min-height: 96px; }

.play { width: 34px; height: 34px; border-radius: 10px; background: var(--pri); color: var(--pri-ink); display: grid; place-items: center; font-size: 12px; flex: none; }

/* ---------- filter ---------- */
.fwrap { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, .82fr); gap: 18px; align-items: start; }
.fcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.fg > h4 .l { width: 26px; height: 26px; border-radius: 8px; background: var(--pri2); color: var(--pri); display: grid; place-items: center; font-size: 13px; flex: none; }

}

/* ---------- study (question screen) ---------- */
.study { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }
.qhead { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-bottom: 1px solid var(--line); }
.qnum { font-family: var(--fe); font-weight: 700; font-size: 15px; white-space: nowrap; }
.prog { flex: 1; height: 7px; background: var(--track); border-radius: 9px; overflow: hidden; min-width: 40px; display: flex; }

.timer { font-family: var(--fe); font-weight: 700; font-size: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; direction: ltr; white-space: nowrap; }

  .qbody { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 24px; overflow: hidden; padding: 0 24px; }
  .qcol, .ecol { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 0 28px; min-height: 0; }
  .ecol { margin-top: 0; }
}
.qtags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; direction: ltr; justify-content: flex-start; }
[data-theme="dark"] .qtags .tag[style] { filter: brightness(1.7) saturate(.9); }
.prior { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.qtext { font-size: calc(21px * var(--fs)); line-height: 1.62; font-weight: 500; color: var(--ink); }
@media (max-aspect-ratio: 1/1) and (min-width: 700px) { .qtext { font-size: calc(23px * var(--fs)); } }
@media (max-width: 699px) { .qtext { font-size: calc(18px * var(--fs)); } }
.qimgs { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.qimg { border-radius: 14px; overflow: hidden; position: relative; background: #0b0f12; display: block; width: 100%; text-align: center; border: 1px solid var(--line); }

.qimg .zoom { position: absolute; bottom: 8px; right: 8px; background: rgba(255,255,255,.92); color: #16232E; border-radius: 8px; font-size: 12.5px; padding: 4px 9px; font-weight: 600; }

.opts { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
.opt { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; direction: ltr; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 12px 11px 14px; font-family: var(--fe); font-size: calc(18px * var(--fs)); color: var(--ink); min-height: 56px; line-height: 1.4; position: relative; }
@media (max-aspect-ratio: 1/1) and (min-width: 700px) { .opt { font-size: calc(19px * var(--fs)); } }
@media (max-width: 699px) { .opt { font-size: calc(16px * var(--fs)); } }
.opt .k { width: 32px; height: 32px; border-radius: 9px; background: var(--hover); display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.opt .t { flex: 1; min-width: 0; }
@media (hover: hover) { .opt:not(.lock):hover { border-color: var(--pri3); } }
.opt.picked { border-color: var(--pri); background: var(--pri2); }
.opt.picked .k { background: var(--pri); color: var(--pri-ink); }
.opt.ok { border-color: var(--ok); background: var(--okbg); }

.opt.bad { border-color: var(--bad); background: var(--badbg); }

.opt.prevbad { border-color: var(--badline); border-style: dashed; background: var(--badbg); background: color-mix(in srgb, var(--badbg) 55%, var(--card)); }

.opt .xs { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--ink3); font-size: 15px; flex: none; margin-right: -4px; }
.opt .xs:active { background: var(--hover); }
.guess { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--ink2); }
.verdict { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 12px 16px; border: 1px solid; }

.cmpline { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; line-height: 1.55; }

.placeholder .big { font-size: 30px; margin-bottom: 8px; }
.kbd { font-family: var(--fe); font-size: 11.5px; color: var(--ink3); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 0 2px; background: var(--card); }
.qfoot { flex: none; display: flex; gap: 10px; align-items: center; padding: 12px 22px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card); }

@media (max-width: 1100px) { .qfoot .hint { display: none; } }
@media (max-width: 699px) { .qfoot [data-a="edit"], .qfoot [data-a="flag"] { display: none; } .qfoot [data-a="next"] { min-width: 0 !important; flex: 1; } .qfoot [data-a="prev"] { padding: 0 12px; } .qhead { padding: 10px 12px; gap: 8px; } .qbody { padding: 14px 14px 24px; } .qfoot { padding: 10px 12px; gap: 6px; } .qfoot .ib { width: 44px; height: 44px; } .qfoot .btn { padding: 0 14px; } .qhead .hide-sm { display: none; } }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; }
.navgrid button { height: 46px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-family: var(--fe); font-weight: 700; font-size: 14px; position: relative; }

/* image viewer */
.imgv { position: fixed; inset: 0; background: #05080a; z-index: 80; touch-action: none; overflow: hidden; }

.imgv .bar2 { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; color: #dfe6ea; font-size: 14px; gap: 10px; z-index: 2; background: linear-gradient(#05080acc, transparent); }

/* history */
.att { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.att:first-child { border-top: 0; }

.att .x b { font-size: 14.5px; display: block; font-weight: 600; }
.att .x span { font-size: 12.5px; color: var(--ink3); }

/* results */
.res-top { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.bigring { width: 132px; height: 132px; position: relative; }
.bigring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.bigring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--fe); font-size: 30px; font-weight: 800; }

/* stats / charts */
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .cgrid { grid-template-columns: 1fr; } }
.meter { display: flex; align-items: center; gap: 10px; padding: 8px 0; width: 100%; text-align: start; }
.meter .nm { width: 160px; flex: none; font-family: var(--fe); font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: right; }
.meter .bar { flex: 1; height: 10px; }
.meter .v { font-family: var(--fe); font-size: 13px; font-weight: 700; min-width: 64px; text-align: left; white-space: nowrap; }
.meter .v small { font-weight: 500; color: var(--ink3); }
.st-ic { font-size: 12px; margin-inline-end: 2px; }
.cols { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding: 18px 4px 0; direction: ltr; border-bottom: 1px solid var(--line); position: relative; }
.cols .c { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
.cols .c i { display: block; width: 100%; max-width: 24px; background: var(--pri); border-radius: 4px 4px 0 0; min-height: 2px; }
.cols .c i.dim { background: var(--pri3); }
.cols .c .lab { position: absolute; top: -18px; font-family: var(--fe); font-size: 11.5px; font-weight: 700; color: var(--ink); }
.xlabs { display: flex; gap: 10px; direction: ltr; padding: 6px 4px 0; }
.xlabs span { flex: 1; text-align: center; font-family: var(--fe); font-size: 11px; color: var(--ink3); }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.heat button { border-radius: 12px; padding: 10px 12px; text-align: start; border: 1px solid var(--line2); background: var(--chip); }
.heat .hn { font-family: var(--fe); font-size: 12.5px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.heat .hv { font-family: var(--fe); font-size: 20px; font-weight: 800; color: var(--ink); }
.heat .hs { font-size: 11.5px; color: var(--ink3); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-size: 12.5px; color: var(--ink3); font-weight: 600; text-align: start; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line2); font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.en, .tbl td.num { font-family: var(--fe); }
.tip { position: fixed; z-index: 95; background: #1D2A33; color: #fff; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: nowrap; transform: translate(-50%, -110%); }
.tip b { font-family: var(--fe); font-size: 13.5px; margin-inline-end: 6px; }

/* bank / topics trees */
.tree { display: flex; flex-direction: column; }
.tn { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line2); width: 100%; text-align: start; font-size: 14.5px; min-height: 46px; }
.tn:first-child { border-top: 0; }
.tn.l2 { padding-inline-start: 34px; font-size: 14px; background: var(--chip); background: color-mix(in srgb, var(--chip) 50%, var(--card)); }
.tn.l3 { padding-inline-start: 54px; font-size: 13.5px; background: var(--chip); }
.tn .nm { flex: 1; min-width: 0; font-family: var(--fe); direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn .ct { font-family: var(--fe); font-size: 12.5px; color: var(--ink3); }
.tn .car { width: 18px; color: var(--ink3); font-size: 12px; flex: none; text-align: center; }
.tn.on { background: var(--pri2); color: var(--pri); font-weight: 700; }
.split { display: grid; grid-template-columns: minmax(260px, .8fr) minmax(0, 1.6fr); gap: 16px; align-items: start; }
@media (max-width: 1023px) { .split { grid-template-columns: 1fr; } }
.sumcard { padding: 14px 16px; border-top: 1px solid var(--line2); }
.sumcard:first-child { border-top: 0; }
.sumcard p { margin: 6px 0 0; font-size: 15.5px; line-height: 1.65; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.formgrid label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink2); font-weight: 600; }
@media (max-width: 699px) { .formgrid { grid-template-columns: 1fr; } }
.modecards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 699px) { .modecards { grid-template-columns: 1fr; } }
.mc { border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--chip); text-align: start; }
.mc.on { border-color: var(--pri); background: var(--pri2); }
.mc b { font-size: 16px; }
.mc .d { font-size: 13px; color: var(--ink2); line-height: 1.5; }
.mc .def { font-size: 11.5px; font-weight: 700; color: var(--pri); background: var(--card); border-radius: 99px; padding: 1px 8px; width: max-content; }
.loading { display: grid; place-items: center; min-height: 60vh; color: var(--ink2); font-size: 15px; }

<script>window.UB_FILES={"data/banks.json":{"banks":[{"id":"sample","name":"الأسئلة التجريبية","file":"data/bank-sample.json","base":""}]},"data/bank-sample.json":{"format":"urobank-bank","version":1,"name":"أسئلة تجريبية","note":"Original practice questions written for testing the app. Not from AUA, Campbell or FRCS.","sources":[{"id":"demo1","name":"Sample 1","full":"أسئلة تجريبية مرتبة بالسنوات — للتجربة فقط (السنوات وهمية)","kind":"year","color":"#1C4E8A","demo":true},{"id":"demo2","name":"Sample 2","full":"أسئلة تجريبية مرتبة بالفصول — للتجربة فقط","kind":"chapter","color":"#8C2F39","demo":true}],"questions":[{"id":"d1-2003-01","src":"demo1","num":1,"stem":"A 58-year-old man has an incidentally detected 3.2 cm enhancing, exophytic mass in the lower pole of the right kidney (schematic shown). The contralateral kidney is normal and his eGFR is 72 mL/min/1.73 m². What is the most appropriate management?","options":[{"k":"A","t":"Radical nephrectomy"},{"k":"B","t":"Partial nephrectomy"},{"k":"C","t":"Systemic targeted therapy"},{"k":"D","t":"Observation with repeat imaging in 5 years"},{"k":"E","t":"Renal artery embolization"}],"answer":"B","explanation":"For a clinical T1a renal mass (4 cm or smaller) in a patient who is fit for surgery, partial nephrectomy is the preferred treatment when it is technically feasible. Oncologic outcomes are comparable to radical nephrectomy, while preserving renal parenchyma lowers the risk of chronic kidney disease, which is associated with cardiovascular morbidity and mortality.\n\nRadical nephrectomy is reserved for tumors that are not amenable to nephron-sparing surgery. Systemic therapy has no role in localized disease. Active surveillance can be considered for small masses in elderly or comorbid patients, but never with imaging intervals as long as 5 years. Embolization is not a curative treatment.","summary":"B — Partial nephrectomy. cT1a (≤ 4 cm): nephron-sparing surgery is preferred when feasible — same cancer control as radical nephrectomy with better renal function. High-yield: avoid over-treating small masses with radical nephrectomy.","sub":"onc.kidney.srm","sex":"M","organ":["kidney"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2003,"age":58,"guideline":"AUA","images":[{"file":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0ODAgMzAwIiB3aWR0aD0iNDgwIiBoZWlnaHQ9IjMwMCI+CiAgPHJlY3Qgd2lkdGg9IjQ4MCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiMxMjE4MWMiLz4KICA8dGV4dCB4PSIyNDAiIHk9IjI4IiBmaWxsPSIjOWZiMGJiIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlNjaGVtYXRpYyDigJQgcmlnaHQga2lkbmV5LCBjb3JvbmFsIHZpZXcgKG5vdCBhIHJlYWwgaW1hZ2UpPC90ZXh0PgogIDxwYXRoIGQ9Ik0yMzIgNTZjLTUyIDAtODggNDAtODggMTA0czM2IDEwNCA4OCAxMDRjMjggMCA0Mi0xOCA0Mi00MCAwLTE2LTEwLTI2LTEwLTQwczEwLTI0IDEwLTQwYzAtMjItMTQtNDAtNDItNDB6IiB0cmFuc2Zvcm09InRyYW5zbGF0ZSgtMTAsLTYpIiBmaWxsPSIjNmI3NzgwIi8+CiAgPHBhdGggZD0iTTI1MCAxMTBjLTEyIDEwLTE0IDMwLTQgNDQgOCAxMiA2IDI4LTQgMzgiIHN0cm9rZT0iIzNkNDY0ZCIgc3Ryb2tlLXdpZHRoPSIxMCIgZmlsbD0ibm9uZSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+CiAgPGNpcmNsZSBjeD0iMTg2IiBjeT0iMjM2IiByPSIzNCIgZmlsbD0iI2M5ZDFkNiIvPgogIDxjaXJjbGUgY3g9IjE4NiIgY3k9IjIzNiIgcj0iMzQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZmZmZiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtZGFzaGFycmF5PSI1IDQiLz4KICA8bGluZSB4MT0iMTUyIiB5MT0iMjM2IiB4Mj0iMjIwIiB5Mj0iMjM2IiBzdHJva2U9IiNmM2MyN2EiIHN0cm9rZS13aWR0aD0iMiIvPgogIDxsaW5lIHgxPSIxNTIiIHkxPSIyMjkiIHgyPSIxNTIiIHkyPSIyNDMiIHN0cm9rZT0iI2YzYzI3YSIgc3Ryb2tlLXdpZHRoPSIyIi8+CiAgPGxpbmUgeDE9IjIyMCIgeTE9IjIyOSIgeDI9IjIyMCIgeTI9IjI0MyIgc3Ryb2tlPSIjZjNjMjdhIiBzdHJva2Utd2lkdGg9IjIiLz4KICA8dGV4dCB4PSIxODYiIHk9IjI5MCIgZmlsbD0iI2YzYzI3YSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj4zLjIgY20gZW5oYW5jaW5nIGV4b3BoeXRpYyBsb3dlci1wb2xlIG1hc3M8L3RleHQ+CiAgPHRleHQgeD0iMzMwIiB5PSIxNTAiIGZpbGw9IiM5ZmIwYmIiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxMyI+UmVuYWwgaGlsdW08L3RleHQ+CiAgPGxpbmUgeDE9IjMyNiIgeTE9IjE0NiIgeDI9IjI2MiIgeTI9IjE0MCIgc3Ryb2tlPSIjOWZiMGJiIiBzdHJva2Utd2lkdGg9IjEiLz4KPC9zdmc+Cg==","modality":"Diagram","caption":"رسم توضيحي — ليس صورة أشعة حقيقية","where":"stem"}]},{"id":"d2-c3-01","src":"demo2","num":1,"stem":"A 66-year-old man underwent complete transurethral resection of a bladder tumor. Pathology shows high-grade T1 urothelial carcinoma with concomitant carcinoma in situ; muscularis propria is present in the specimen. What is the most appropriate next step?","options":[{"k":"A","t":"Single postoperative dose of mitomycin C only"},{"k":"B","t":"Repeat TURBT followed by induction and maintenance BCG"},{"k":"C","t":"Observation with cystoscopy every 3 months"},{"k":"D","t":"Radiotherapy"},{"k":"E","t":"Systemic chemotherapy"}],"answer":"B","explanation":"High-grade T1 disease carries a substantial risk of residual tumor and of understaging at the first resection. A repeat resection within about 6 weeks is recommended to confirm complete resection and accurate staging before intravesical therapy.\n\nIntravesical BCG, given as an induction course followed by maintenance, is the standard adjuvant treatment for high-risk non-muscle-invasive bladder cancer, including T1 high-grade tumors with CIS. Radical cystectomy may be considered in selected very-high-risk patients. A single dose of chemotherapy alone is inadequate for high-risk disease, and observation is not appropriate.","summary":"B — Re-TURBT, then induction + maintenance BCG. T1 HG tumors are often understaged, so re-resect before BCG. High-yield: single-dose chemotherapy alone is inadequate for high-risk NMIBC.","sub":"onc.bladder.nmibc","sex":"M","organ":["bladder"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":["onc.bladder.bcg"],"conf":1.0,"chapter":{"n":3,"title":"Bladder cancer"},"age":66,"guideline":"AUA","page":41},{"id":"d1-2001-01","src":"demo1","num":1,"stem":"A 32-year-old man undergoes radical inguinal orchiectomy for a testicular mass. Pathology shows pure seminoma confined to the testis without lymphovascular invasion. CT of the chest, abdomen and pelvis is normal and postoperative tumor markers are normal. What is the preferred management?","options":[{"k":"A","t":"Active surveillance"},{"k":"B","t":"Retroperitoneal lymph node dissection"},{"k":"C","t":"Three cycles of BEP chemotherapy"},{"k":"D","t":"Radiotherapy to the contralateral testis"},{"k":"E","t":"Hemiscrotectomy"}],"answer":"A","explanation":"Most patients with clinical stage I seminoma are cured by orchiectomy alone. Active surveillance is the preferred option because it spares the large majority of men who will never relapse from treatment toxicity; relapses are usually detected early and salvaged successfully.\n\nSingle-agent carboplatin or retroperitoneal radiotherapy are acceptable alternatives for men who cannot comply with surveillance. Primary RPLND is not standard for stage I seminoma, three cycles of BEP represent overtreatment, and contralateral testicular radiotherapy or hemiscrotectomy have no role here.","summary":"A — Active surveillance. Stage I seminoma is usually cured by orchiectomy; surveillance spares most men unnecessary treatment. Carboplatin or radiotherapy are alternatives if surveillance is not feasible.","sub":"onc.testis.seminoma","sex":"M","organ":["testis"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2001,"age":32},{"id":"d2-c9-01","src":"demo2","num":1,"stem":"Chronic infection with Schistosoma haematobium is most strongly associated with which bladder malignancy?","options":[{"k":"A","t":"Urothelial carcinoma in situ"},{"k":"B","t":"Squamous cell carcinoma"},{"k":"C","t":"Adenocarcinoma of urachal origin"},{"k":"D","t":"Small cell carcinoma"},{"k":"E","t":"Leiomyosarcoma"}],"answer":"B","explanation":"Schistosoma haematobium eggs deposited in the bladder wall cause chronic inflammation, fibrosis and squamous metaplasia, which predispose to squamous cell carcinoma. In endemic regions, bilharzial bladder cancer is typically squamous and often presents at an advanced, muscle-invasive stage in patients younger than those with urothelial carcinoma.\n\nUrachal adenocarcinoma arises at the bladder dome from urachal remnants, and small cell carcinoma and leiomyosarcoma are rare and not specifically linked to schistosomiasis.","summary":"B — Squamous cell carcinoma. Chronic bilharzial inflammation causes squamous metaplasia and SCC of the bladder. High-yield in endemic regions.","sub":"inf.special.schisto","sex":"none","organ":["bladder"],"special":[],"qtype":"pathology","format":"recall","highYield":true,"tax2":["onc.bladder.nonuro"],"conf":0.68,"chapter":{"n":9,"title":"Infections"}},{"id":"d1-2004-01","src":"demo1","num":1,"stem":"Which histologic finding carries the worst prognosis in Wilms tumor?","options":[{"k":"A","t":"Favorable histology with blastemal predominance"},{"k":"B","t":"Diffuse anaplasia"},{"k":"C","t":"Nephrogenic rests"},{"k":"D","t":"Epithelial predominance"},{"k":"E","t":"Cystic partially differentiated nephroblastoma"}],"answer":"B","explanation":"Anaplasia, defined by markedly enlarged hyperchromatic nuclei and atypical mitotic figures, is the most important unfavorable histologic feature in Wilms tumor. Diffuse anaplasia is associated with chemotherapy resistance and poorer survival than focal anaplasia or favorable histology, and it leads to more intensive treatment.\n\nNephrogenic rests are precursor lesions, and cystic partially differentiated nephroblastoma has an excellent prognosis after surgery alone.","summary":"B — Diffuse anaplasia: the key unfavorable histology in Wilms tumor, linked to chemoresistance and worse survival. Stage and histology are the main prognostic factors.","sub":"ped.tumors.wilms","sex":"none","organ":["kidney"],"special":[],"qtype":"pathology","format":"recall","highYield":true,"tax2":["onc.kidney"],"conf":1.0,"year":2004},{"id":"d2-c1-01","src":"demo2","num":1,"stem":"A 2-day-old boy had bilateral hydroureteronephrosis and a thick-walled, distended bladder on prenatal ultrasound. After birth he has a poor urinary stream and a rising serum creatinine. What is the most appropriate initial step?","options":[{"k":"A","t":"Immediate bilateral cutaneous ureterostomies"},{"k":"B","t":"Bladder drainage with a small urethral catheter"},{"k":"C","t":"Start anticholinergic medication"},{"k":"D","t":"Observation and repeat ultrasound at 6 months"},{"k":"E","t":"Bilateral nephrostomy tubes as first-line treatment"}],"answer":"B","explanation":"This presentation is typical of posterior urethral valves, the most common cause of congenital lower urinary tract obstruction in boys. The first priority is to relieve the obstruction by draining the bladder with a small urethral feeding tube or catheter, then to stabilize fluid and electrolyte status and confirm the diagnosis with voiding cystourethrography.\n\nPrimary endoscopic valve ablation follows once the infant is stable. Upper tract diversion is reserved for infants whose renal function does not improve with adequate bladder drainage, and observation is dangerous in a neonate with a rising creatinine.","summary":"B — Drain the bladder with a small urethral catheter first. Suspected PUV: relieve obstruction, stabilize, confirm with VCUG, then valve ablation. Upper tract diversion only if no improvement.","sub":"ped.puv.dx","sex":"boy","organ":["urethra","bladder"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":1,"title":"Pediatric urology"},"age":0.0055},{"id":"d1-2002-01","src":"demo1","num":1,"stem":"An 18-month-old girl with a febrile urinary tract infection undergoes voiding cystourethrography (schematic shown). Contrast refluxes into a moderately dilated, mildly tortuous ureter and a dilated renal pelvis; the calyceal fornices are blunted but papillary impressions are still visible. What is the grade of reflux?","options":[{"k":"A","t":"Grade I"},{"k":"B","t":"Grade II"},{"k":"C","t":"Grade III"},{"k":"D","t":"Grade IV"},{"k":"E","t":"Grade V"}],"answer":"D","explanation":"The International Reflux Study grading is based on the VCUG appearance. Grade I reflux reaches the ureter only; grade II reaches the pelvis and calyces without dilation; grade III shows mild to moderate dilation of the ureter and collecting system with slight or no blunting of the fornices.\n\nGrade IV shows moderate dilation and tortuosity of the ureter with moderate dilation of the pelvis and calyces, complete obliteration of the sharp fornical angles, but preservation of papillary impressions in most calyces. Grade V shows gross dilation and tortuosity with loss of papillary impressions.","summary":"D — Grade IV. Moderate ureteric dilation and tortuosity, blunted fornices, papillary impressions preserved. Loss of papillary impressions = grade V.","sub":"ped.vur.grading","sex":"girl","organ":["ureter","kidney"],"special":[],"qtype":"diagnosis","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2002,"age":1.5,"images":[{"file":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0ODAgMzIwIiB3aWR0aD0iNDgwIiBoZWlnaHQ9IjMyMCI+CiAgPHJlY3Qgd2lkdGg9IjQ4MCIgaGVpZ2h0PSIzMjAiIGZpbGw9IiMxYTIwMjUiLz4KICA8dGV4dCB4PSIyNDAiIHk9IjI0IiBmaWxsPSIjOWZiMGJiIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlNjaGVtYXRpYyBWQ1VHIChub3QgYSByZWFsIGltYWdlKTwvdGV4dD4KICA8ZWxsaXBzZSBjeD0iMjQwIiBjeT0iMjcyIiByeD0iNzgiIHJ5PSIzNiIgZmlsbD0iI2U0ZThlYSIvPgogIDxwYXRoIGQ9Ik0yMDYgMjUwIEMgMTkwIDIyMCwgMjE0IDIwMCwgMTk2IDE3NiBTIDIxMCAxMzIsIDE5MiAxMTIiIHN0cm9rZT0iI2U0ZThlYSIgc3Ryb2tlLXdpZHRoPSIxOCIgZmlsbD0ibm9uZSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+CiAgPHBhdGggZD0iTTE5MiAxMTIgQyAxNzAgMTA0LCAxNTAgODYsIDE1NiA2NCBDIDE2MiA0NiwgMTk2IDQyLCAyMTQgNTYgQyAyMzIgNzAsIDIyMCA5OCwgMTkyIDExMiBaIiBmaWxsPSIjZTRlOGVhIi8+CiAgPGNpcmNsZSBjeD0 y is performed by 18 months of age.\n\nEarly orchiopexy is thought to improve germ cell development and fertility potential, and it places the testis where it can be examined later in life. Hormonal therapy is not recommended to induce descent. Delaying surgery to school age or puberty is associated with worse testicular outcomes.","summary":"B — Orchiopexy between 6 and 18 months. Spontaneous descent is unlikely after 6 months; early surgery favors fertility and allows later self-examination.","sub":"ped.genital.udt","sex":"boy","organ":["testis"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":1,"title":"Pediatric urology"},"age":0.5,"guideline":"AUA"},{"id":"d1-2005-01","src":"demo1","num":1,"stem":"A 14-year-old boy presents 4 hours after the sudden onset of severe left scrotal pain with nausea. The left testis is high-riding with a horizontal lie and the cremasteric reflex is absent. What is the most appropriate next step?","options":[{"k":"A","t":"Scrotal Doppler ultrasound, then reassess the next morning"},{"k":"B","t":"Immediate scrotal exploration"},{"k":"C","t":"Oral antibiotics for epididymitis"},{"k":"D","t":"Analgesia and scrotal elevation"},{"k":"E","t":"Nuclear testicular scan"}],"answer":"B","explanation":"Sudden severe scrotal pain with nausea, a high-riding testis with a horizontal lie and an absent cremasteric reflex are highly suggestive of testicular torsion. When clinical suspicion is high, surgical exploration should not be delayed by imaging, because testicular salvage falls sharply as the duration of ischemia increases, particularly beyond 6 hours.\n\nAt exploration the testis is detorsed and fixed, and the contralateral testis is fixed as well. Doppler ultrasound is useful when the diagnosis is uncertain but must not delay surgery.","summary":"B — Immediate exploration. Classic torsion signs: do not delay for imaging; salvage falls after about 6 hours. Fix both testes.","sub":"ped.scrotum.torsion","sex":"boy","organ":["testis","scrotum"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2005,"age":14},{"id":"d2-c5-01","src":"demo2","num":1,"stem":"A 45-year-old woman reports leakage of urine with coughing and sneezing for one year. She has no urgency, her post-void residual is low and urinalysis is normal. She would like treatment but prefers to avoid surgery for now. What is the most appropriate first-line treatment?","options":[{"k":"A","t":"Pelvic floor muscle training"},{"k":"B","t":"Midurethral sling"},{"k":"C","t":"Intradetrusor onabotulinumtoxinA"},{"k":"D","t":"Antimuscarinic medication"},{"k":"E","t":"Bladder augmentation"}],"answer":"A","explanation":"This is uncomplicated stress urinary incontinence. Supervised pelvic floor muscle training for at least three months is the recommended first-line treatment and improves or cures symptoms in many women, with no risk of surgical complications.\n\nA midurethral sling is the standard surgical option when conservative measures fail and the patient wishes to have surgery. Botulinum toxin and antimuscarinics treat urgency incontinence and overactive bladder, not stress incontinence, and augmentation has no role.","summary":"A — Pelvic floor muscle training. First-line for uncomplicated SUI; midurethral sling if conservative therapy fails.","sub":"fem.sui.cons","sex":"F","organ":["bladder","urethra"],"special":[],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"chapter":{"n":5,"title":"Female urology"},"age":45},{"id":"d1-2006-01","src":"demo1","num":1,"stem":"A 67-year-old woman has urgency, frequency and urgency incontinence. Bladder training and two oral medications (an antimuscarinic and a beta-3 agonist) have failed. Her post-void residual is 30 mL. Which treatment is most appropriate next?","options":[{"k":"A","t":"Intradetrusor onabotulinumtoxinA injection"},{"k":"B","t":"Retropubic midurethral sling"},{"k":"C","t":"Augmentation cystoplasty"},{"k":"D","t":"Long-term indwelling catheter"},{"k":"E","t":"Bladder neck closure"}],"answer":"A","explanation":"Refractory overactive bladder is defined as failure of behavioral therapy and adequate trials of pharmacotherapy. Third-line options include intradetrusor onabotulinumtoxinA, sacral neuromodulation and percutaneous tibial nerve stimulation. Before botulinum toxin, patients must be willing and able to perform clean intermittent catheterization if urinary retention develops.\n\nA midurethral sling treats stress incontinence and may worsen urgency. Augmentation cystoplasty is reserved for rare, severe refractory cases, and indwelling catheters or bladder neck closure are last resorts.","summary":"A — Intradetrusor onabotulinumtoxinA (or sacral neuromodulation / PTNS) for refractory OAB. Counsel about possible retention and intermittent catheterization.","sub":"fem.oab.botox","sex":"F","organ":["bladder"],"special":[],"qtype":"management","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"year":2006,"age":67,"guideline":"AUA"},{"id":"d2-c5-02","src":"demo2","num":2,"stem":"A 42-year-old woman develops continuous vaginal leakage of urine 10 days after an abdominal hysterectomy. Cystoscopy shows a 3 mm supratrigonal vesicovaginal fistula with healthy surrounding tissue. What is the most appropriate initial management?","options":[{"k":"A","t":"Immediate transabdominal repair with an omental flap"},{"k":"B","t":"Continuous bladder drainage with a urethral catheter for several weeks"},{"k":"C","t":"Bilateral nephrostomy tubes"},{"k":"D","t":"Ileal conduit urinary diversion"},{"k":"E","t":"Anticholinergic medication alone"}],"answer":"B","explanation":"Small, uncomplicated vesicovaginal fistulas recognized early after surgery may close spontaneously with continuous bladder drainage. A trial of urethral catheter drainage for several weeks is a reasonable first step, particularly for fistulas of only a few millimetres surrounded by healthy tissue.\n\nIf the fistula persists, surgical repair by a vaginal or abdominal approach is performed, with tissue interposition when indicated. Urinary diversion and nephrostomy tubes are not appropriate for a small benign fistula, and anticholinergics alone do not treat the leak.","summary":"B — Trial of continuous catheter drainage. Small early VVFs can close spontaneously; repair (vaginal or abdominal) if leakage persists.","sub":"fem.fistula.vvf","sex":"F","organ":["bladder"],"special":[],"qtype":"management","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"chapter":{"n":5,"title":"Female urology"},"age":42},{"id":"d1-2000-01","src":"demo1","num":1,"stem":"A 34-year-old man with a complete T4 spinal cord injury develops a pounding headache, flushing above the level of injury and a blood pressure of 210/120 mmHg. He is lying supine. What is the most appropriate first step?","options":[{"k":"A","t":"Give intravenous labetalol immediately"},{"k":"B","t":"Sit him upright, loosen tight clothing and check the bladder for distension"},{"k":"C","t":"Order an urgent brain CT"},{"k":"D","t":"Perform urodynamic testing"},{"k":"E","t":"Start an oral alpha-blocker and reassess tomorrow"}],"answer":"B","explanation":"This is autonomic dysreflexia, a medical emergency seen with spinal cord injury at or above T6. A noxious stimulus below the level of injury, most often bladder distension or a blocked catheter, triggers uncontrolled sympathetic discharge.\n\nInitial management is to sit the patient upright to lower blood pressure, loosen tight clothing and look for and remove the trigger: check the bladder and catheter first, then the bowel. If systolic pressure remains very high after these measures, a rapid-acting antihypertensive is given.","summary":"B — Sit upright, loosen clothing, empty the bladder. Autonomic dysreflexia (injury at or above T6): remove the trigger first; antihypertensives only if BP stays high.","sub":"neuro.nlutd.ad","sex":"M","organ":["bladder"],"special":["sci"],"qtype":"management","format":"clinical","highYield":true,"tax2":[],"conf":1.0,"year":2000,"age":34},{"id":"d2-c6-01","src":"demo2","num":1,"stem":"During filling cystometry in a 58-year-old woman with urgency, the tracing shows phasic rises in detrusor pressure that coincide with urgency, while abdominal pressure stays flat (schematic shown). What is the urodynamic finding?","options":[{"k":"A","t":"Detrusor overactivity"},{"k":"B","t":"Low bladder compliance"},{"k":"C","t":"Urodynamic stress incontinence"},{"k":"D","t":"Bladder outlet obstruction"},{"k":"E","t":"Detrusor underactivity"}],"answer":"A","explanation":"Detrusor pressure is calculated as vesical pressure minus abdominal pressure. Involuntary phasic detrusor contractions during the filling phase, spontaneous or provoked and often accompanied by urgency, define detrusor overactivity.\n\nLow compliance appears as a gradual, steady rise in detrusor pressure during filling rather than waves. Urodynamic stress incontinence is leakage with increased abdominal pressure in the absence of a detrusor contraction, while outlet obstruction and underactivity are judged during the voiding phase using pressure-flow studies.","summary":"A — Detrusor overactivity: involuntary phasic Pdet waves during filling. A steady Pdet rise means low compliance instead.","sub":"neuro.uds.interp","sex":"F","organ":["bladder"],"special":[],"qtype":"diagnosis","format":"clinical","highYield":false,"tax2":[],"conf":1.0,"chapter":{"n":6,"title":"Neurourology"},"age":58,"images":[{"file":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MjAgMzAwIiB3aWR0aD0iNTIwIiBoZWlnaHQ9IjMwMCI+CiAgPHJlY3Qgd2lkdGg9IjUyMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiNmZmZmZmYiLz4KICA8dGV4dCB4PSIyNjAiIHk9IjIyIiBmaWxsPSIjNGE1ODY2IiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlNjaGVtYXRpYyBmaWxsaW5nIGN5c3RvbWV0cnkgKG5vdCBhIHJlYWwgdHJhY2luZyk8L
