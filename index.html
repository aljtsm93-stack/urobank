    const entries = [{ path: FILE, mode: '100644', type: 'blob', sha: blob.sha }];
    const day = U.dayKey();
    if (GH.snapDay !== day) entries.push({ path: 'daily/day-' + U.pad(U.dayNum() % 30) + '.json.gz', mode: '100644', type: 'blob', sha: blob.sha });
    const tree = await api('POST', rp(GH.cfg) + '/git/trees', baseTree ? { base_tree: baseTree, tree: entries } : { tree: entries });
    const commit = await api('POST', rp(GH.cfg) + '/git/commits', { message: 'UroBank backup ' + new Date().toISOString().slice(0, 16).replace('T', ' '), tree: tree.sha, parents: [] });
    await api('PATCH', rp(GH.cfg) + '/git/refs/heads/' + encodeURIComponent(GH.cfg.branch), { sha: commit.sha, force: true });
    GH.snapDay = day;
    return { head: commit.sha, tree: tree.sha };
  }
  const userChanges = () => [...S.dirty].some((id) => id !== 'backup');
  async function sync() {
    if (!GH.cfg) return;
    if (GH.busy) { GH.again = true; return; }
    GH.busy = true;
    setGH('saving');
    try {
      for (let round = 0; round < 3; round++) {
        const head = await headSha();
        if (head && head !== GH.head) {
          // another device saved (or first sync here): merge its copy before writing ours
          const rem = await readRemote(head);
          if (rem.full) S.mergeRemote(rem.full.docs);
          GH.head = head; GH.tree = rem.tree; saveGH();
        }
        if (head && !userChanges()) break;
        const verAt = S.ver;
        let res;
        try { res = await pushTo(head, GH.tree); }
        catch (e) { if ((e.status === 409 || e.status === 422) && round < 2) { GH.head = null; continue; } throw e; }
        GH.head = res.head; GH.tree = res.tree; GH.last = Date.now(); saveGH();
        if (S.ver === verAt) { S.dirty.clear(); S.flushLocal(); }
        break;
      }
      setGH('ok', '');
    } catch (e) {
      console.warn('github sync', e);
      setGH(e.status ? 'error' : 'offline', errText(e), e.status);
    } finally {
      GH.busy = false;
      if (GH.again) { GH.again = false; later(2500); }
    }
  }
  let timer = null;
  function later(ms) {
    if (!GH.cfg) return;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; sync(); }, ms);
  }
  GH.syncNow = () => sync();
  GH.connect = async function (owner, repo, token) {
    const cfg = { owner: owner.replace(/^@/, ''), repo, token, branch: 'main' };
    const info = await api('GET', rp(cfg), null, cfg);
    if (info && info.permissions && info.permissions.push === false) { const e = new Error('read only'); e.status = 403; throw e; }
    cfg.branch = (info && info.default_branch) || 'main';
    cfg.private = !!(info && info.private);
    const before = { cfg: GH.cfg, head: GH.head, tree: GH.tree, last: GH.last, snapDay: GH.snapDay };
    Object.assign(GH, { cfg, head: null, tree: null, last: 0, snapDay: '', repoOk: true });
    saveGH();
    await sync();
    if (GH.state === 'error' && [401, 403, 404].includes(GH.errStatus)) {
      const e = new Error(GH.err); e.status = GH.errStatus;
      Object.assign(GH, before); saveGH();
      setGH(GH.cfg ? 'ok' : 'off', '');
      throw e;
    }
    return cfg;
  };
  GH.disconnect = function () {
    Object.assign(GH, { cfg: null, head: null, tree: null, last: 0, snapDay: '' });
    saveGH();
    setGH('off', '');
  };
  loadGH();
  if (GH.cfg) GH.repoOk = true;

  // about 45 s after the first change; a change made while a copy is being sent triggers another one after it
  S.on('change', (what) => {
    if (!GH.cfg || what === 'remote') return;
    if (!timer) timer = setTimeout(() => { timer = null; sync(); }, 45000);
  });
  document.addEventListener('visibilitychange', () => {
    if (!GH.cfg) return;
    if (document.hidden) { if (userChanges()) { clearTimeout(timer); timer = null; sync(); } }
    else later(1500);
  });
  window.addEventListener('online', () => later(1000));
  S.on('sync', U.debounce(() => { if (ui.cur === 'prefs' && !ui.top()) ui.refresh(); }, 300));

  /* ---------- settings: save & backup cards ---------- */
  UB.pwaBackupHtml = function () {
    const bk = S.docs.backup;
    const gh = GH.cfg;
    const st = GH.state;
    const tag = !gh ? '<span class="tag warn">محفوظ على هذا الجهاز فقط</span>'
      : st === 'ok' ? '<span class="tag ok">☁ محفوظ على الجهاز + نسخة في GitHub</span>'
      : st === 'saving' ? '<span class="tag warn">جارٍ النسخ إلى GitHub…</span>'
      : st === 'offline' ? '<span class="tag warn">غير متصل — يُنسخ تلقائيًا عند الاتصال</span>'
      : '<span class="tag bad">تعذّر النسخ إلى GitHub</span>';
    const ghCard = '<div class="card pad"><div class="sec"><h3>☁ النسخ التلقائي إلى GitHub</h3></div>' + (gh
      ? '<div class="muted" style="margin-bottom:8px">متصل بالمستودع <b class="ens">' + esc(gh.owner + '/' + gh.repo) + '</b></div>' +
        (gh.private === false ? '<div class="banner">⚠ هذا المستودع عام (Public): يستطيع أي شخص رؤية تقدمك. اجعله Private من إعداداته في GitHub.</div>' : '') +
        (st === 'error' && GH.err ? '<div class="banner">⚠ ' + esc(GH.err) + '</div>' : '') +
        '<div class="note" style="margin-bottom:10px">آخر نسخ: ' + (GH.last ? U.rel(GH.last) + ' · ' + U.time(GH.last) : 'لم يتم بعد') + '. يُنسخ تقدمك تلقائيًا بعد أي تغيير بأقل من دقيقة وعند إغلاق التطبيق، ويُحفظ هناك أيضًا ملف لكل يوم (آخر 30 يومًا).</div>' +
        '<div class="row"><button class="btn p" data-a="gh-sync">↻ نسخ الآن</button><button class="btn g" data-a="gh-off">فصل</button></div>'
      : '<div class="muted" style="line-height:1.8;margin-bottom:10px">ينسخ تقدمك تلقائيًا إلى مستودع خاص بك على GitHub (مجاني). إذا حُذف التطبيق أو غيّرت الآيباد: ثبّت التطبيق واربط الحساب نفسه، فيعود كل شيء.</div>' +
        '<button class="btn p" data-a="gh-setup">☁ ربط GitHub</button>') + '</div>';
    return '<div class="card pad"><div class="sec"><h3>💾 الحفظ والنسخ الاحتياطي</h3></div>' +
      '<div class="row" style="margin-bottom:10px">' + tag + '</div>' +
      '<table class="tbl"><tr><td>المحاولات المحفوظة</td><td class="num">' + U.num(S.totalAttempts()) + '</td></tr>' +
      '<tr><td>آخر نسخة يومية على الجهاز</td><td>' + (bk.last && U.parseDay(bk.last) ? U.date(U.parseDay(bk.last), true) : '—') + '</td></tr>' +
      '<tr><td>آخر ملف احتياطي (iCloud)</td><td>' + (bk.lastExport ? U.date(bk.lastExport, true) : 'لم يُحفظ بعد') + '</td></tr></table>' +
      '<div class="row" style="margin-top:12px"><button class="btn p" data-a="export">💾 حفظ ملف احتياطي (iCloud)</button>' +
      '<label class="btn g" style="cursor:pointer">📥 استعادة من ملف<input type="file" data-c="restore" style="display:none"></label>' +
      '<button class="btn g" data-a="snap">نسخة الآن</button></div>' +
      '<div class="note" style="margin-top:10px">تُحفظ كل إجابة فورًا على هذا الجهاز، مع نسخة كاملة كل يوم (آخر 30 يومًا). حذف أيقونة التطبيق يحذف بياناته من الجهاز، لذلك فعّل النسخ التلقائي إلى GitHub أو احفظ ملفًا في iCloud بين حين وآخر.</div></div>' +
      ghCard;
  };
  UB.pwaAct = function (a) {
    if (a === 'gh-setup') { ghSetup(); return true; }
    if (a === 'gh-sync') {
      sync().then(() => { ui.toast(GH.state === 'ok' ? '✓ نُسخ تقدمك إلى GitHub' : GH.err || 'تعذّر النسخ', GH.state === 'ok' ? 'ok' : 'bad'); ui.refresh(); });
      return true;
    }
    if (a === 'gh-off') {
      ui.confirm({ title: 'فصل GitHub؟', text: 'يتوقف النسخ التلقائي. نسختك في GitHub تبقى كما هي، وتستطيع الربط مرة أخرى في أي وقت.', ok: 'فصل' })
        .then((ok) => { if (ok) { GH.disconnect(); ui.refresh(); ui.renderNav(); } });
      return true;
    }
    return false;
  };
  function ghSetup() {
    let last = {};
    try { last = JSON.parse(localStorage.getItem('ub1:ghlast') || '{}') || {}; } catch (e) { last = {}; }
    const html = (err, busy) => ui.sh('☁ ربط النسخ التلقائي بـ GitHub', 'مرة واحدة فقط · مجاني') +
      '<ol style="margin:0 0 12px;padding-inline-start:20px;line-height:1.9;font-size:14.5px">' +
      '<li>سجّل الدخول إلى GitHub، أو أنشئ حسابًا مجانيًا.</li>' +
      '<li>أنشئ مستودعًا جديدًا باسم <b class="ens">urobank-data</b> واختر <b class="ens">Private</b>. <a href="https://github.com/new" target="_blank" rel="noopener">فتح الصفحة ↗</a></li>' +
      '<li>أنشئ رمز وصول (token): <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">فتح الصفحة ↗</a><br>' +
      'في <span class="ens">Repository access</span> اختر <span class="ens">Only select repositories</span> ثم <span class="ens">urobank-data</span>. وفي <span class="ens">Permissions</span> اجعل <span class="ens">Contents</span> على <span class="ens">Read and write</span>، واختر أطول مدة صلاحية.</li>' +
      '<li>انسخ الرمز والصقه هنا.</li></ol>' +
      '<div class="formgrid"><label>اسم المستخدم في GitHub<input class="inp en" data-f="owner" autocapitalize="off" autocorrect="off" spellcheck="false"></label>' +
      '<label>اسم المستودع<input class="inp en" data-f="repo" autocapitalize="off" autocorrect="off" spellcheck="false"></label></div>' +
      '<label style="display:block;margin-top:10px">الرمز (token)<input class="inp en" data-f="token" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…" style="width:100%"></label>' +
      (err ? '<div class="banner" style="margin-top:10px">⚠ ' + esc(err) + '</div>' : '') +
      '<div class="note" style="margin-top:8px">الرمز يبقى على هذا الجهاز فقط، ولا يصل إلا إلى هذا المستودع.</div>' +
      '<div class="acts"><button class="btn g" data-a="close">إلغاء</button><button class="btn p" data-a="connect"' + (busy ? ' disabled' : '') + '>' + (busy ? 'جارٍ الربط…' : 'ربط') + '</button></div>';
    const fill = (h, v) => { for (const k of ['owner', 'repo', 'token']) { const el = h.sheet.querySelector('[data-f="' + k + '"]'); if (el) el.value = v[k] || ''; } };
    const h0 = ui.sheet({
      cls: 'lg', sticky: true, html: html(''),
      onAct: async (a, el, e, h) => {
        if (a !== 'connect') return;
        const val = (k) => (h.sheet.querySelector('[data-f="' + k + '"]').value || '').trim();
        const v = { owner: val('owner'), repo: val('repo'), token: val('token') };
        if (!v.owner || !v.repo || !v.token) { h.update(html('اكتب اسم المستخدم واسم المستودع والرمز')); fill(h, v); return; }
        h.update(html('', true)); fill(h, v);
        try {
          await GH.connect(v.owner, v.repo, v.token);
          try { localStorage.setItem('ub1:ghlast', JSON.stringify({ owner: v.owner, repo: v.repo })); } catch (er) {}
          h.close();
          ui.toast(GH.state === 'ok' ? '✓ تم الربط ونُسخ تقدمك إلى GitHub' : 'تم الربط — يُنسخ تقدمك عند الاتصال', GH.state === 'ok' ? 'ok' : '', 4500);
          ui.refresh(); ui.renderNav();
        } catch (er) { h.update(html(errText(er))); fill(h, v); }
      },
    });
    fill(h0, { owner: last.owner || '', repo: last.repo || 'urobank-data', token: '' });
  }

  /* ---------- start ---------- */
  function registerSW() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    let had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!had) { had = true; return; } // first install, nothing to announce
      ui.confirm({ title: 'نسخة أحدث من التطبيق جاهزة', text: 'أعد التشغيل لاستخدامها. تقدمك محفوظ.', ok: 'إعادة التشغيل', cancel: 'لاحقًا' })
        .then((ok) => { if (ok) location.reload(); });
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then((reg) => setInterval(() => reg.update().catch(() => {}), 6 * 3600e3))
      .catch((e) => console.warn('service worker', e));
  }
  UB.pwaStart = function () {
    S.firstSync = true; // nothing to wait for: the data is on the device
    setGH(GH.cfg ? 'ok' : 'off', '');
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    registerSW();
    setTimeout(() => S.autoSnapshot(), 4000);
    setInterval(() => S.autoSnapshot(), 3600e3);
    if (GH.cfg) later(1200);
  };
})();

</script><script>
/* UroBank — boot */
(function () {
  'use strict';
  const UB = window.UB;
  const U = UB.U, S = UB.S, B = UB.B, ui = UB.ui;

  UB.doExport = async function () {
    const r = await S.exportFile();
    if (r.ok) { ui.toast('✓ جُهّز الملف — اختر "حفظ في الملفات" ثم iCloud Drive', 'ok', 4500); ui.refresh(); return; }
    if (r.reason === 'declined') { ui.toast('أُلغي الحفظ'); return; }
    ui.sheet({
      html: ui.sh('💾 نسخة احتياطية', 'تعذّر حفظ الملف مباشرة في هذه الشاشة') +
        '<div class="muted" style="margin-bottom:10px">انسخ النص التالي والصقه في ملف نصي (مثلًا في تطبيق الملفات أو الملاحظات). تستطيع استعادته لاحقًا من الإعدادات.</div>' +
        '<textarea class="inp en" rows="7" readonly>' + U.esc(r.data.length > 400000 ? r.data.slice(0, 400000) + '…' : r.data) + '</textarea>' +
        '<div class="acts"><button class="btn p" data-a="copy">نسخ النص</button></div>',
      onAct: async (a) => {
        if (a !== 'copy') return;
        try { await navigator.clipboard.writeText(r.data); ui.toast('نُسخ النص', 'ok'); S.docs.backup.lastExport = Date.now(); S.touch('backup'); }
        catch (e) { ui.toast('تعذّر النسخ — حدد النص وانسخه يدويًا', 'bad'); }
      },
    });
  };

  async function boot() {
    S.init();
    ui.applyTheme();
    ui.bind();
    const soon = (title) => ({ render: () => '<div class="view"><div class="vtop"><h1>' + title + '</h1></div><div class="empty"><div class="big">🛠</div>هذه الشاشة قيد البناء.</div></div>' });
    const names = { plan: 'خطة اليوم', bank: 'بنك الأسئلة', mistakes: 'مراجعة الأخطاء', starred: 'المحفوظة', topics: 'ملخص المواضيع', stats: 'الإحصائيات', library: 'المصادر والاستيراد', 'needs-review': 'بحاجة لمراجعة', prefs: 'الإعدادات' };
    for (const k in names) if (!UB.V[k]) UB.V[k] = soon(names[k]);
    ui.show();
    await B.load();
    ui.show();
    let banksSig = U.stable(S.docs.banks.list || []);
    const rerender = U.debounce(() => {
      ui.renderNav();
      if (ui.cur !== 'study' && !ui.top()) ui.refresh();
    }, 350);
    S.on('change', (what) => {
      UB._agg = null;
      if (what === 'meta') ui.applyTheme();
      if (what === 'restore' || what === 'reset') {
        // a restored copy may list other imported books: load them
        const sig = U.stable(S.docs.banks.list || []);
        if (sig !== banksSig) { banksSig = sig; B.load().then(() => { UB._agg = null; ui.refresh(); ui.renderNav(); }); }
        B.refresh(); ui.refresh(); ui.renderNav();
        return;
      }
      if (what === 'banks') banksSig = U.stable(S.docs.banks.list || []);
      rerender();
    });
    S.on('remote', async () => {
      ui.applyTheme();
      const sig = U.stable(S.docs.banks.list || []);
      if (sig !== banksSig) { banksSig = sig; await B.load(); }
      else B.refresh();
      rerender();
    });
    if (UB.PWA && UB.pwaStart) UB.pwaStart(); else S.connect();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
